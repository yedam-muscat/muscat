<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<main layout:fragment="content">
	<div class="container-fluid main-row">
		<h2 id="boardTitle">문서기안</h2>

		<div class="row h-100">
			<!-- ▣ 좌측 사이드바: 문서 양식 목록 -->
			<nav class="col-md-4 col-lg-3 d-md-block bg-light sidebar p-3">
				<h5>문서 양식</h5>
				<div class="input-group mb-3">
					<input type="text" id="searchKeyword" class="form-control"
						placeholder="양식 제목 검색">
					<button class="btn btn-outline-secondary" type="button"
						id="btnSearch">검색</button>
				</div>
				<div class="list-group" id="form-list"></div>
			</nav>

			<!-- ▣ 우측 컨텐츠: 문서 작성 영역 -->
			<div class="col-md-8 ms-sm-auto col-lg-9 px-md-4 content-area">
				<div id="form-display-area" class="pt-3">
					<!-- 초기 안내 메시지 -->
					<div id="form-placeholder" class="text-center text-muted mt-5">
						<h3>
							<i class="bi bi-file-earmark-text"></i>
						</h3>
						<p>좌측에서 작성할 문서 양식을 선택하세요.</p>
					</div>

					<!-- 양식 선택 시 표시될 영역 -->
					<div id="form-content" style="display: none;">
						<div
							class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
							<h2 class="h2" id="form-title"></h2>
						</div>
						<div class="mb-3">
							<button id="openApprovalModal" class="btn btn-primary">결재선
								설정</button>
						</div>
						<div id="approval-summary" class="mb-3"></div>
						<form id="form-renderer"></form>
						<div class="mt-4 text-end">
							<button class="btn btn-primary" id="btnSubmitRequest">결재요청</button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- ▣ 결재선 모달 -->
		<div class="modal fade" id="approvalModal" tabindex="-1"
			aria-hidden="true">
			<div class="modal-dialog modal-lg modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">결재 · 참조 설정</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"
							aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<div class="container-fluid">
							<div class="row g-3">
								<!-- 좌측 : 사원 목록 -->
								<div class="col-5">
									<input id="empFilter" type="text" class="form-control mb-2"
										placeholder="사원 검색" />
									<ul id="employeeList" class="list-group"></ul>
								</div>
								<!-- 가운데 : 이동 버튼 -->
								<div
									class="col-2 d-flex flex-column align-items-center justify-content-center gap-2">
									<button id="toApprove" class="btn btn-outline-primary   w-100"
										title="결재로 이동">결재 ▶</button>
									<button id="toReference"
										class="btn btn-outline-secondary w-100" title="참조로 이동">참조
										▶</button>
								</div>
								<!-- 우측 : 결재 / 참조 -->
								<div class="col-5">
									<h6 class="fw-bold">결재</h6>
									<ul id="approveList" class="list-group mb-3"></ul>
									<h6 class="fw-bold">참조</h6>
									<ul id="referenceList" class="list-group"></ul>
								</div>
							</div>
						</div>
					</div>
					<div class="modal-footer d-flex justify-content-end gap-2">
						<button class="btn btn-outline-secondary" id="saveFavorite">즐겨찾기
							저장</button>
						<button class="btn btn-primary" id="saveApprovalLine">결재선
							저장</button>
					</div>
				</div>
			</div>
		</div>

	</div>

	<!-- ▣ 라이브러리 -->

	<script src="https://formbuilder.online/assets/js/form-builder.min.js"></script>
	<script src="https://formbuilder.online/assets/js/form-render.min.js"></script>

	<!-- ▣ 서버 경로 (Thymeleaf) -->
	<script th:inline="javascript">
    let docFormListUrl = /*[[ @{/appr/docFormList.do} ]]*/ '';
    let userListUrl    = /*[[ @{/chat/findMember.do} ]]*/ '';
    let reqApprUrl    = /*[[ @{/appr/reqAppr.do} ]]*/ '';
  </script>

	<!-- ▣ 메인 스크립트 -->
	<script>
	  /** ============================
	   *  util : 스크롤 스타일 (모달 내부 리스트 고정 높이)
	   * ============================*/
	  const applyScrollStyles = () => {
	    ['employeeList','approveList','referenceList'].forEach(id => {
	      const el = document.getElementById(id);
	      if(el){
	        el.style.minHeight = '7.5rem';   // 약 3줄
	        el.style.maxHeight = '40vh';
	        el.style.overflow  = 'auto';
	      }
	    });
	  };
	
  /** ============================
   *  1) 상태(Model) ----------------
   * =============================*/
  let docFormList = [];
   let selectedDocForm = {};
  const docFormMap = new Map();

  // 결재선 전용 상태
  let available   = [];   // 대기 사원
  let approvers   = [];   // 결재
  let references  = [];   // 참조
  const pickedIds = new Set(); // approvers + references id 집합 (중복 방지)

  /** ============================
   *  2) 공통 유틸 ----------------
   * =============================*/
  const makeEmpLabel = e => `${e.mberNm}(${e.deptName}/${e.rankName})`;

  /** ============================
   *  3) 문서 양식 ----------------
   * =============================*/
  const pageSize     = 10;
  let   currentPage  = 1;
  let   searchKeyword= '';

  function loadDocForms(page = 1){
    currentPage = page;
    $.get(docFormListUrl, {
      pageIndex       : page,
      searchCondition : '1',
      searchKeyword
    }).done(res => {
      docFormList = res.resultList;
      docFormMap.clear();
      docFormList.forEach(i=>docFormMap.set(i.dformId,i));
      renderFormList();
    }).fail(()=>Swal.fire({icon:"error",title:"양식 조회 실패"}));
  }

  function renderFormList(){
    const $list = $('#form-list').empty();
    docFormList.forEach(item =>
      $list.append(`<a href="#" class="list-group-item list-group-item-action"
                       data-form-id="${item.dformId}">${item.dformName}</a>`));
  }

  /** ============================
   *  4) 결재선 --------------------
   * =============================*/
  function loadUserList(){
    $.get(userListUrl).done(res => {
      available = res.result.slice();   // 깊은 복사
      renderAvailable();
    }).fail(()=>Swal.fire({icon:"error",title:"사원 목록 조회 실패"}));
  }

  /* --- 렌더러 --- */
  function renderAvailable(filter=''){
    const $ul = $('#employeeList').empty();
    available
      .filter(e => !pickedIds.has(e.mberId))                   // 이미 선택된 인원 제외
      .filter(e => !filter || e.mberNm.includes(filter))       // 검색어 적용
      .forEach(e => $ul.append(`<li class="list-group-item" data-id="${e.mberId}">${makeEmpLabel(e)}</li>`));
  }

  function renderPicked(){
    const toLi = (arr, showOrder) => arr.map((e,i)=>
      `<li class="list-group-item d-flex justify-content-between align-items-center" data-id="${e.mberId}">
        ${showOrder?`<span class="badge bg-secondary me-2 order-badge">${i+1}</span>`:''}
        <span>${makeEmpLabel(e)}</span>
        <button class="btn btn-sm btn-link text-danger remove-item">삭제</button>
      </li>`).join('');

    $('#approveList').html(toLi(approvers,true));
    $('#referenceList').html(toLi(references,false));
  }
  
  /* --- 저장 요약 영역 --- */
  function refreshApprovalSummary(){
    const $summary = $('#approval-summary').empty();
    if(!approvers.length && !references.length) return;

    if(approvers.length){
      $summary.append('<h6 class="fw-bold mb-1">결재선</h6>');
      $summary.append(`<div class="mb-2">${approvers.map((e,i)=>`<span class="badge bg-primary me-1">${i+1}.${e.mberNm}</span>`).join(' ')}</div>`);
    }
    if(references.length){
      $summary.append('<h6 class="fw-bold mb-1">참조자</h6>');
      $summary.append(`<div>${references.map(e=>`<span class="badge bg-secondary me-1">${e.mberNm}</span>`).join(' ')}</div>`);
    }
  }

  /* --- 이동 / 삭제 --- */
  function moveSelected(target){   // target: 'approve' | 'reference'
    $('#employeeList .list-group-item.active').each(function(){
      const id  = $(this).data('id');
      const emp = available.find(e=>e.mberId===id);
      if(!emp || pickedIds.has(id)) return;
      if(target==='approve')   approvers.push(emp);
      if(target==='reference') references.push(emp);
      pickedIds.add(id);
    });
    renderAvailable($('#empFilter').val());
    renderPicked();
  }

  function removeFromPicked(id){
    approvers  = approvers .filter(e=>e.mberId!==id);
    references = references.filter(e=>e.mberId!==id);
    pickedIds.delete(id);
    renderAvailable($('#empFilter').val());
    renderPicked();
  }

  function refreshApproveOrder(){
    $('#approveList .order-badge').each((idx,el)=>$(el).text(idx+1));
  }
  
  function syncApproversWithDOM(){
	  approvers = [];                                // 배열 초기화
	  $('#approveList li').each(function(){
	    const id = $(this).data('id');
	    // available / references / approvers 중 어디 있든 동일 객체 찾아 push
	    const emp = available.find(e=>e.mberId===id)
	            || references.find(e=>e.mberId===id)
	            || approvers.find(e=>e.mberId===id);
	    if(emp) approvers.push(emp);
	  });
	  refreshApproveOrder();                         // 뱃지 번호 재계산
	}

  /** ============================
   *  5) 이벤트 바인딩 -------------
   * =============================*/
  $(document).ready(()=>{
    /*  문서양식  */
    loadDocForms();
    loadUserList();

    $('#btnSearch').on('click', ()=>{
      searchKeyword = $('#searchKeyword').val();
      loadDocForms();
    });
    $('#searchKeyword').on('keyup', e => (e.key==='Enter') && $('#btnSearch').click());

    $('#form-list').on('click','a', function(e){
      e.preventDefault();
      const id = $(this).data('form-id');
      selectedDocForm = docFormMap.get(id);
      if(!selectedDocForm) return;
      $('#form-placeholder').hide();
      $('#form-content').show();
      $('#form-title').text(selectedDocForm.dformName);
      $('#form-renderer').formRender({formData:selectedDocForm.dformContent});
    });

    /*  결재선  */
    // 좌측 사원 선택
    $(document).on('click','#employeeList .list-group-item',function(){
      $(this).toggleClass('active');
    });

    // 이동 버튼
    $('#toApprove').on('click',   ()=>moveSelected('approve'));
    $('#toReference').on('click', ()=>moveSelected('reference'));

    // 삭제 버튼(우측 → 좌측)
    $(document).on('click','.remove-item',function(){
      const id=$(this).closest('li').data('id');
      removeFromPicked(id);
    });

    // 드래그 정렬
    $('#approveList').sortable({
  		placeholder: 'ui-state-highlight',
  		update: () => {              // 드래그 종료 시 호출
    		syncApproversWithDOM();    // 배열 순서 ← DOM 순서
  		}
	});

    // 검색 필터
    $('#empFilter').on('input',function(){
      renderAvailable($(this).val().trim());
    });
    
    $('#saveApprovalLine').on('click', () => {
    	  //savedFlag = true;                // ✔ 저장 표시
    	  refreshApprovalSummary();        // 요약 출력
    	  bootstrap.Modal.getInstance(document.getElementById('approvalModal')).hide();
    	});

    // 모달 열기
    $('#openApprovalModal').on('click', () => {
    	  const modalEl = document.getElementById('approvalModal');
    	  let modal;

    	  // ▸ Bootstrap 5.2+
    	  if (bootstrap.Modal && typeof bootstrap.Modal.getOrCreateInstance === 'function') {
    	    modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    	  }
    	  // ▸ Bootstrap 5.0–5.1
    	  else if (bootstrap.Modal && typeof bootstrap.Modal === 'function') {
    	    modal = bootstrap.Modal.getInstance?.(modalEl) || new bootstrap.Modal(modalEl);
    	  }
    	  // ▸ Bootstrap 4.x (jQuery 플러그인 방식)
    	  else {
    	    $(modalEl).modal('show');
    	    applyScrollStyles();
    	    return;
    	  }
    	  modal.show();
    	  applyScrollStyles();   // 모달 로드 후 스크롤 스타일
    	});
    
    $('#approvalModal').on('hidden.bs.modal', () => {
    	  refreshApprovalSummary();   // 저장 버튼과 같은 함수 호출
    	  document.activeElement.blur(); 
    	});
    
    $('#btnSubmitRequest').on('click', function (e) {
    	  e.preventDefault();                       // 페이지 이동 방지

    	  /* 1) 작성-폼 입력값 */
    	  const formDataArr = $('#form-renderer').serializeArray();   // [{name:"field1",value:"…"}, …]
    	  const formDataObj = Object.fromEntries(formDataArr.map(({name,value}) => [name, value]));

    	  /* 2) 결재·참조 배열 → id 목록만 전송 예시 */
    	  const payload = {
    		adocContent : formDataObj,                       // 작성 내용
    	    approvers   : approvers  .map(e => e.mberId),    // [ "u001", "u007", … ]
    	    references  : references .map(e => e.mberId),    // [ "u099", … ]
    	    dformId     : selectedDocForm.dformId,            // 선택한 양식 ID
    	    mberId      : loginVO.id,
    	  };
  

     	  $.ajax({
    	    url  : reqApprUrl,
    	    type : 'POST',
    	    contentType: 'application/json',
    	    data : JSON.stringify(payload)
    	  })
    	  .done(() => Swal.fire({icon:'success',title:'결재요청 완료'}))
    	  .fail(() => Swal.fire({icon:'error',  title:'서버 오류, 다시 시도해 주세요'})); 
    	});
  });
  </script>
</main>
</html>
