<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<main layout:fragment="content">
	<div id="auth">
		<div class="row h-100">
			<div class="col-lg-8 col-12">
				<div id="auth-left px-2 py-2">
					<div class="card">
						<div class="card-header text-white">
							<h5 class="mb-0">결재요청상세</h5>
						</div>
						<div class="card-body" id="adocForm" style="max-width: 800px">
							<div id="approval-header" class="mb-4"></div>
							<div id="formRender" class="border mb-3 p-3 bg-light"></div>
						</div>

						<div class="card-body" style="max-width: 800px">
							<div class="mb-3">
								<label for="approvalComment" class="form-label fw-bold">코멘트</label>
								<textarea class="form-control" id="ahistoryComment" rows="3"
									placeholder="반려 또는 승인에 대한 의견을 남겨주세요."></textarea>
							</div>

							<div class="d-flex justify-content-end gap-2 mt-4">
								<button type="button" id="rejectApprBtn"
									class="btn btn-danger px-4">반려</button>
								<button type="button" id="confirmApprBtn"
									class="btn btn-primary px-4">승인</button>
								<button type="button" id="printPdfBtn" class="btn btn-info px-4">PDF
									출력</button>
							</div>
						</div>

					</div>
				</div>
			</div>
		</div>
		</div>

	<script src="https://formbuilder.online/assets/js/form-render.min.js"></script>

	<script th:inline="javascript">
	 /*<![CDATA[*/
		let apprDoc = /*[[ ${apprDoc} ]]*/'';
		let apprLine = /*[[ ${apprLine} ]]*/'';
		let apprHistory = /*[[ ${apprHistory} ]]*/'';

		let mngUrl = /*[[ @{/appr/reqAppr.do} ]]*/'';
		let handleUrl = /*[[ @{/appr/handleAppr.do} ]]*/'';

		console.log(apprDoc)
		console.log(apprLine)
		console.log(apprHistory)

		// Function to draw approval stamps
		function drawApprovalStamps(approvalLine, approvalHistory) {
		    const historyMap = new Map();
		    (approvalHistory || []).forEach(history => {
		        historyMap.set(history.mberId, history.ahistoryStatus);
		    });

		    (approvalLine || []).forEach(approver => {
		        const stampArea = document.querySelector(`.approval-stamp-area[data-approver-id="${approver.mberId}"]`);
		        if (stampArea) {
		            const status = historyMap.get(approver.mberId);
		            const stampDiv = document.createElement('div');
		            stampDiv.classList.add('approval-stamp');
		            
		            if (approver.isDraft) {                      // ★ 추가: 기안자
		                stampDiv.classList.add('approved');
		                stampDiv.textContent = approver.mberNm;
		            } else if (status === 'B1') { // 승인
		                stampDiv.classList.add('approved');
		                stampDiv.textContent = approver.mberNm;
		            } else if (status === 'B0') { // 반려
		                stampDiv.classList.add('rejected');
		                stampDiv.textContent = '반려';
		            } else { // 대기 또는 미결
		                stampDiv.classList.add('pending');
		                stampDiv.textContent = '대기';
		            }
		            stampArea.innerHTML = ''; // Clear existing content
		            stampArea.appendChild(stampDiv);
		        }
		    });
		}


		$('document').ready(
				function() {
					
					function handleAppr(ahistoryStatus) {
						
						let apprOne = apprLine.find(item => item.mberId === loginVO.id);
						
						const payload = {
								ahistoryComment : $('#ahistoryComment').val().trim(),
								adocId : apprDoc.adocId,
								ahistoryStatus : ahistoryStatus,
								mberId : loginVO.id,
								alineOrder : apprOne.alineOrder,
								alineId : apprOne.alineId,
								alineDetailId : apprOne.alineDetailId,
							};
						
						console.log(payload);
						
 						$.ajax({
							type : "POST",
							url : handleUrl,
							contentType : "application/json; charset=utf-8",
							data : JSON.stringify(payload),
							dataType : 'json'
						}).done(function(data, textStatus, xhr) {

							if (data.resultSuccess) {
								Swal.fire({
									icon : "success",
									title : `${ahistoryStatus == 'B0' ? '반려' : '승인'} 처리되었습니다`,
								}).then(() => {
									location.href = mngUrl
								})
							} else {
								Swal.fire({
									icon : "error",
									title : data.resultMsg
								})
							}

						}).fail(function() {
							Swal.fire({
								icon : "error",
								title : "오류가 발생했습니다"
							})
						});
					}
					
					
					$('#rejectApprBtn').on('click', function() {
						Swal.fire({
						    title: '반려처리 하시겠습니까?',
						    icon: 'warning',
						    showCancelButton: true,
							})
						  .then(result => {
						    if (result.isConfirmed) {
						    	handleAppr('B0');
						    } else if (result.isDismissed) {
						    	
						    }
						  });
					})
					
					$('#confirmApprBtn').on('click', function() {
						Swal.fire({
						    title: '승인처리 하시겠습니까?',
						    icon: 'warning',
						    showCancelButton: true,
							})
						  .then(result => {
						    if (result.isConfirmed) {
						    	handleAppr('B1');
						    } else if (result.isDismissed) {
						    	
						    }
						  });
					})

					$('#btnToList').on('click', function() {
						location.href = mngUrl;
					});

					// --- 결재선 동적 생성 로직 ---
const drafter = {
  mberId : apprDoc.mberId ?? 'drafter',   // id가 없으면 임시키
  mberNm : apprDoc.mberNm,
  isDraft: true                           // ← 기안자 플래그
};
					
		            let approverCellsHtml = '';
		            const apprLines = [drafter, ...(apprLine || [])];
		            apprLines.forEach(approver => {
		                approverCellsHtml += `
		                    <div class="col border-start text-center" style="width: 100px;">
		                        <div class="py-1 bg-light border-bottom"></div>
		                        <div class="py-3 approval-stamp-area" style="height: 80px;" data-approver-id="${approver.mberId}"></div>
		                        <div class="py-1 border-top">${approver.mberNm}</div>
		                    </div>
		                `;
		            });

		            const approvalHeaderHtml = `
		                <div class="row align-items-center">
		                    <div class="col-auto">
		                        <div class="d-flex border">
		                            <div class="d-flex align-items-center justify-content-center p-2" style="width: 40px;">
		                                <span class="fw-bold">결<br>재</span>
		                            </div>
		                            ${approverCellsHtml}
		                        </div>
		                    </div>
		                </div>
		            `;
		            $('#approval-header').html(approvalHeaderHtml);
					
					// Call drawApprovalStamps after the approval line HTML is rendered
					drawApprovalStamps(apprLines, apprHistory);

			        try {
			            // 1. 양식 구조만으로 빈 폼을 렌더링합니다.
			            const formStructureObject = JSON.parse(apprDoc.dformContent);
			            
			            $('#formRender').formRender({
			                formData: formStructureObject,
			                render: true,
			            });

			            // 2. 입력 데이터를 객체로 변환합니다.
			            const userInputArray = JSON.parse(apprDoc.adocContent);
			            const formDataObject = {};
			            userInputArray.forEach(item => {
			                if (item && item.name) { formDataObject[item.name] = item.value; }
			            });

			            // 3. jQuery로 직접 값을 설정하고, 필드를 비활성화합니다.
			            setTimeout(function() {
			                for (const name in formDataObject) {
			                    if (Object.prototype.hasOwnProperty.call(formDataObject, name)) {
			                        const value = formDataObject[name];
			                        const $field = $(`[name="${name}"]`);

			                        if ($field.length > 0) {
			                            // 값 설정 로직
			                            if ($field.is(':radio')) {
			                                $(`[name="${name}"][value="${value}"]`).prop('checked', true);
			                            } else if ($field.is(':checkbox')) {
			                                const values = Array.isArray(value) ? value : [value];
			                                values.forEach(val => {
			                                    $(`[name="${name}"][value="${val}"]`).prop('checked', true);
			                                });
			                            } else {
			                                $field.val(value);
			                            }
			                            
			                            // ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
			                            // ★★★ 추가된 부분: 모든 필드를 비활성화(disabled) 처리 ★★★
			                            $field.prop('disabled', true);
			                            // ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
			                        }
			                    }
			                }
			                console.log("🎉🎉🎉 값 설정 및 비활성화 완료!");
			            }, 100);

			        } catch (error) {
			            console.error("스크립트 실행 중 예외가 발생했습니다:", error);
			        }
				});
		/*]]>*/
	</script>

	<script>
		function generatePdf() {
			const element = document.querySelector('#adocForm'); // PDF로 변환할 요소 선택
			
			html2pdf(element, {
				margin: 10,
				filename: `${apprDoc.dformName + '_' + apprDoc.mberNm}.pdf`,
				image: { type: 'jpeg', quality: 0.98 },
				html2canvas: { scale: 2 },
				jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
			});
		}

		$('document').ready(function() {
			$('#printPdfBtn').on('click', function() {
				generatePdf();
			});
		});
	</script>
</main>
