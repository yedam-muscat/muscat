				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">닫기</button>

			</div>
		</div>

			let options = {
				onSave : function(formData) {
					
					Swal.fire({
						icon : "question",
						title : "저장하시겠습니까?",
						showCancelButton: true,
						confirmButtonText: "저장",
						cancelButtonText: "취소"
					}).then((result) => {
						  if (result.isConfirmed) {
							  
							  const payload = {
									  dformName : $('#dformName').val(),
									  dformContent : JSON.stringify(formData),
									  dformDesc: $('#dformDesc').val(),
									  useYn: $('[name="useYn"]').val(),
									};
							  
							  console.log(payload);
							  console.log(JSON.stringify(payload));
							  
 							  $.ajax({
									type : "POST",
									url : docFormRegUrl,
									contentType : "application/json; charset=utf-8",
									data : JSON.stringify(payload),
									dataType : 'json'
								}).done(function(data, textStatus, xhr) {
									Swal.fire({
										icon : "success",
										title : "문서양식이 등록되었습니다"
									})
								}).fail(function() {
									Swal.fire({
										icon : "error",
										title : "오류가 발생했습니다"
									})
								});
						  } 
					});
				},
                i18n: koreanI18n
			}
			
			// formBuilder 에디터 생성
			const fb = $('#fb-editor').formBuilder(options);

			// 미리보기 모달 렌더링
			$('#previewModal').on('show.bs.modal', function() {
				const formData = fb.actions.getData('json');

				$('#rendered-form').formRender({
					formData : formData
				});
			});
			
			// 저장 버튼 클릭
			$('#saveBtn').on('click', function() {
				fb.actions.save();
			});
