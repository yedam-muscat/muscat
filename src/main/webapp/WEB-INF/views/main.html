	<script th:inline="javascript">
		let mainBoardUrl = /*[[@{/main/recentBoard.do}]]*/'';
		
		/*<![CDATA[*/
		(() => {
		  /* -------- 설정 값만 위쪽에 모으기 -------- */
		  const USE_24H = true;            // false → 12h AM/PM
		  const LOCALE  = 'ko-KR';         // 브라우저 언어 대신 고정하려면 변경
		  const TIMEZONE= 'Asia/Seoul';    // 서버 시간대와 달라도 OK

		  /* -------- DOM 캐시 -------- */
		  const $time = document.getElementById('clockDisplay');
		  const $date = document.getElementById('clockDate');

		  /* -------- 유틸 -------- */
		  const pad = n => n.toString().padStart(2, '0');

		  /* -------- 렌더 루프 -------- */
		  function tick() {
		    const now = new Date();

		    /* 시간 */
		    if (USE_24H) {
		      $time.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
		    } else {
		      $time.textContent = now.toLocaleTimeString(LOCALE,
		        { timeZone: TIMEZONE, hour12: true });
		    }
		    $time.setAttribute('datetime', now.toISOString());

		    /* 날짜 (예: 2025년 7월 8일 (화)) */
		    $date.textContent = now.toLocaleDateString(LOCALE, {
		      timeZone: TIMEZONE,
		      year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
		    });

		    requestAnimationFrame(tick);    // 60 fps → 부드럽게 초 단위 갱신
		  }
		  tick();
		})();
		/*]]>*/
		
		/*<![CDATA[*/
(() => {
  const dateText = document.getElementById('dateText');

  const prevBtn  = document.getElementById('prevBtn');

    // YYYY-MM-DD (2025년 7월 8일) 형식
    dateText.textContent = currentDate.toLocaleDateString('ko-KR', {
      year:'numeric', month:'long', day:'numeric'
    });

    });

    const isToday = isSameDay(currentDate, new Date());

    // 일정 조회
    loadSchedule(currentDate);       // ⬅︎ 여기서 Ajax or fetch 호출
  }

  // 날짜 비교 유틸
  const isSameDay = (a, b) =>
    a.getFullYear() === b.getFullYear() &&
    a.getMonth()    === b.getMonth()    &&
    a.getDate()     === b.getDate();

  // 버튼 이벤트
  prevBtn.addEventListener('click',  () => { currentDate.setDate(currentDate.getDate() - 1); render(); });
  nextBtn.addEventListener('click',  () => { currentDate.setDate(currentDate.getDate() + 1); render(); });
  todayBtn.addEventListener('click', () => { currentDate = new Date(); currentDate.setHours(0,0,0,0); render(); });

  // 초기 렌더
  render();

  /* --------- 예시: 일정 조회 함수 --------- */

    // 서버로 보낼 ISO-8601 날짜 문자열 (YYYY-MM-DD)
    const ymd = dateObj.toISOString().split('T')[0];

    // fetch(`/api/schedule?date=${ymd}`)
    //   .then(res => res.json())
    //   .then(data => updateScheduleTable(data));

    console.log('[loadSchedule] ▶', ymd);    // 데모용
  }
})();
 /*]]>*/

	<script th:inline="javascript">
		let listUrl = /*[[ @{/appr/reqApprList.do} ]]*/ '';
		let detailUrl = /*[[ @{/appr/reqApprDetail.do} ]]*/ '';
	    const pageSize = 10;
	    let currentPage = 1;
	    let searchCondition = '';
	    let searchKeyword = '';
	</script>

	<script>
		$.ajax({
			type : "GET",
			url : mainBoardUrl,
		}).done(function(data, textStatus, xhr) {
			
	          const body = document.getElementById('articleBody');
	          body.innerHTML = '';
	          const list  = data.resultList || [];
	          const total = parseInt(data.resultCnt||0);

	          /* 레코드가 없을 때 */
	          if(list.length===0){
	            body.innerHTML = '<tr><td colspan="5" class="text-center">게시글이 없습니다.</td></tr>';
	          }else{
	            list.forEach((row,idx)=>{
	              /* ① 답글 들여쓰기 & 아이콘 */
	              if (idx < 5) {
	              const depth   = Number(row.replyLc||0);          // 0,1,2…
	              const indent  = '&nbsp;'.repeat(depth*4);        // 4칸×깊이
	              const icon    = depth>0 ? '↳&nbsp;' : '';        // 화살표
	              const title   = `${indent}${icon}${row.nttSj}`;

	              /* ② TR 작성 */
	              const tr = document.createElement('tr');
	              tr.className = 'text-center';
	              tr.innerHTML = `
	                <td class="text-start title-cell">
	                    <a href="/muscat/board/articleDetail.do?bbsId=${data.bbsId}&nttId=${row.nttId}">
	                      ${title}
	                    </a>
	                </td>
	                <td>${row.frstRegisterNm||''}</td>
	                <td>${(row.frstRegisterPnttm||'').slice(0,10)}</td>
	                <td>${(row.inqireCo||0).toLocaleString()}</td>`;
	              body.appendChild(tr);
	              }
	            });
	          }
		}).fail(function() {
		});
		
		loadList();
		
		function loadList(page = 1) {
	        currentPage = page;
	        
	    	$.ajax({
				type : "GET",
				url : listUrl,
				data : {
					mberId : loginVO.id,
					pageIndex : page,
					searchCondition : searchCondition,
					searchKeyword : searchKeyword,
				},
			}).done(function(data, textStatus, xhr) {
		        let tbody = $('#listBody');
		        tbody.html('');
		        
		        console.log(data);
		        
		        const resultList = data.resultList || [];
		        const totalCount = parseInt(data.paginationInfo.totalRecordCount || 0);
		        const totalPages = Math.ceil(totalCount / pageSize);
		        
		        resultList.forEach(item => {
		          tbody.append(`<tr data-temp-id="${item.adocId }">
			  	            <td>${item.adocId }</td>
			  	            <td>${item.dformName }</td>
			  	            <td>${item.mberNm }</td>
		        		    <td>${fmtDateTime(item.regDate)}</td>
		        		    <td>${fmtDateTime(item.updDate)}</td>
		  	            </tr>
		  	          `);
		        });
		        
		        tbody.on('click', 'tr', function () {
		        	  const id = $(this).data('temp-id');
		        	  window.location.href = `${detailUrl}?adocId=${encodeURIComponent(id)}`;
		        	});

		        renderPagination(totalPages);
			}).fail(function() {
				Swal.fire({
					icon : "error",
					title : "오류가 발생했습니다"
				})
			});
	    }
	</script>
	<script>
(() => {
  // ────── 유틸 함수 ──────
  const today     = new Date();
  let   viewYear  = today.getFullYear();
  let   viewMonth = today.getMonth();        // 0-11

  const $cal = document.getElementById('dashboardCalendar');

  // ────── 달력 렌더링 ──────
  function render() {
    // ① 제목 영역 (월 · 년 · 이동 화살표)
    const header =
      `<div class="cal-header">
         <button class="cal-prev">&#x2039;</button>
         <span>${viewYear}년 ${viewMonth + 1}월</span>
         <button class="cal-next">&#x203A;</button>
       </div>`;

    // ② 요일 헤더
    const yoil = ['일','월','화','수','목','금','토'];
    const thead =
      `<thead><tr>${yoil.map(d => `<th>${d}</th>`).join('')}</tr></thead>`;

    // ③ 날짜 셀
    const first = new Date(viewYear, viewMonth, 1);
    const last  = new Date(viewYear, viewMonth + 1, 0).getDate();

    let html = '<tbody><tr>';
    let day  = 1;

    // 첫 주 빈칸
    for (let i = 0; i < first.getDay(); i++) html += '<td></td>';

    // 날짜 채우기
    while (day <= last) {
      const date = new Date(viewYear, viewMonth, day);
      const isToday =
        date.toDateString() === today.toDateString() ? ' today' : '';
      html += `<td class="cal-day${isToday}" data-date="${date.toISOString()}">${day}</td>`;
      if (date.getDay() === 6 && day !== last) html += '</tr><tr>';
      day++;
    }
    // 마지막 주 빈칸
    const remain = 7 - new Date(viewYear, viewMonth, last).getDay() - 1;
    for (let i = 0; i < remain; i++) html += '<td></td>';

    html += '</tr></tbody>';

    // ④ 조립
    $cal.innerHTML =
      `${header}<table class="cal-table">${thead}${html}</table>`;

    // ⑤ 이벤트
    $cal.querySelector('.cal-prev').onclick = () => {
      viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } render();
    };
    $cal.querySelector('.cal-next').onclick = () => {
      viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } render();
    };
    $cal.querySelectorAll('.cal-day').forEach(td =>
      td.onclick = () => {
        const sel = $cal.querySelector('.selected');
        if (sel) sel.classList.remove('selected');
        td.classList.add('selected');
        const picked = td.dataset.date.substring(0, 10); // YYYY-MM-DD
        // TODO: 여기서 일정 조회 함수 호출
        // loadSchedule(picked);
      });
  }
  render();
})();
</script>
