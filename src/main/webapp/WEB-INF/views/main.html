<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<main layout:fragment="content">
	<div class="container-fluid my-4">
		<div class="row g-4">
			<!-- 왼쪽 세로 영역(폭 4/12) -->
			<div class="col-lg-4 d-flex flex-column gap-4">
				<!-- 카드 1 -->
				<div class="card shadow-sm dashboard-card flex-fill">
					<div class="card-header fw-bold">출퇴근</div>
					<div class="card-body"></div>
				</div>

				<!-- 카드 2 -->
				<div class="card shadow-sm dashboard-card flex-fill">
					<div class="card-header fw-bold">오늘의 일정</div>
					<div class="card-body"></div>
				</div>
			</div>

			<!-- 오른쪽 넓은 영역(폭 8/12) -->
			<div class="col-lg-8 d-flex flex-column gap-4">
				<!-- 카드 3 -->
				<div class="card shadow-sm dashboard-card flex-fill">
					<div class="card-header fw-bold">공지사항</div>
					<div class="card-body">
						<table class="table table-bordered align-middle">
							<thead class="table-light text-center">
								<tr>
									<th>제목</th>
									<th style="width: 120px">작성자</th>
									<th style="width: 120px">작성일</th>
									<th style="width: 90px">조회수</th>
								</tr>
							</thead>
							<tbody id="articleBody"></tbody>
						</table>
					</div>
				</div>

				<!-- 카드 4 -->
				<div class="card shadow-sm dashboard-card flex-fill">
					<div class="card-header fw-bold">결재내역</div>
					<div class="card-body"></div>
				</div>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
		let mainBoardUrl = /*[[@{/main/recentBoard.do}]]*/'';
	</script>

	<script>
		$.ajax({
			type : "GET",
			url : mainBoardUrl,
		}).done(function(data, textStatus, xhr) {

			console.log(data);
			
	          const body = document.getElementById('articleBody');
	          body.innerHTML = '';
	          const list  = data.resultList || [];
	          const total = parseInt(data.resultCnt||0);

	          /* 레코드가 없을 때 */
	          if(list.length===0){
	            body.innerHTML = '<tr><td colspan="5" class="text-center">게시글이 없습니다.</td></tr>';
	          }else{
	            list.forEach((row,idx)=>{
	              /* ① 답글 들여쓰기 & 아이콘 */
	              const depth   = Number(row.replyLc||0);          // 0,1,2…
	              const indent  = '&nbsp;'.repeat(depth*4);        // 4칸×깊이
	              const icon    = depth>0 ? '↳&nbsp;' : '';        // 화살표
	              const title   = `${indent}${icon}${row.nttSj}`;

	              /* ② TR 작성 */
	              const tr = document.createElement('tr');
	              tr.className = 'text-center';
	              tr.innerHTML = `
	                <td class="text-start title-cell">
	                    <a href="/muscat/board/articleDetail.do?bbsId=${data.bbsId}&nttId=${row.nttId}">
	                      ${title}
	                    </a>
	                </td>
	                <td>${row.frstRegisterNm||''}</td>
	                <td>${(row.frstRegisterPnttm||'').slice(0,10)}</td>
	                <td>${(row.inqireCo||0).toLocaleString()}</td>`;
	              body.appendChild(tr);
	            });
	          }
		}).fail(function() {
		});
	</script>
</main>
</html>
