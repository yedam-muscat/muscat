<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<main layout:fragment="content">
<style>
  #chatbot-modal {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 300px;
    height: 400px;
    background: white;
    border: 1px solid #ccc;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    z-index: 1000;
    display: none; /* 기본적으로 숨김 */
    
    flex-direction: column;
    
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  #chatbot-modal.show {
    display: flex;
    opacity: 1;
    transform: translateY(0);
  }
</style>
  <!-- 🤖 챗봇 아이콘 -->
  <div id="chatbot-icon" style="
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #007bff;
      color: white;
      font-size: 30px;
      text-align: center;
      line-height: 60px;
      cursor: pointer;
      z-index: 1000;">
    🤖
  </div>

  <!-- 💬 모달 챗봇창 -->
  <div id="chatbot-modal" style="
      display: none;
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 300px;
      height: 400px;
      background: white;
      border: 1px solid #ccc;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      z-index: 1000;
      display: flex;
      flex-direction: column;">
      
      
      
    <div id="chat-log" style="flex: 1; padding: 10px; overflow-y: auto;"></div>
    <div style="padding: 10px; display: flex; gap: 5px;">
      <input type="text" id="chat-input" style="flex: 1;" placeholder="메시지를 입력하세요">
      <button id="chat-send">전송</button>
    </div>
  </div>

  <!-- 💡 스크립트 -->
  <script>
  document.addEventListener('DOMContentLoaded', function () {
	  const icon = document.getElementById('chatbot-icon');
	  const modal = document.getElementById('chatbot-modal');

	  icon.addEventListener('click', function () {
	    if (modal.classList.contains('show')) {
	      // 닫기: fade-out 후 display: none 처리
	      modal.classList.remove('show');
	      setTimeout(() => { modal.style.display = 'none'; }, 300); // 트랜지션 시간과 맞춤
	    } else {
	      // 열기
	      modal.style.display = 'flex';
	      requestAnimationFrame(() => {
	        modal.classList.add('show');
	      });
	    }
	  });
	});


    // 전송 버튼 클릭 시 메시지 전송
    document.getElementById('chat-send').onclick = function () {
      sendChat();
    };

    // Enter 키로도 전송 가능
    document.getElementById('chat-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        sendChat();
      }
    });

    function sendChat() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;
      appendMessage('나', msg);
      
      //일정 추가 요청인지 간단 판
      if (msg.includes('일정 추가')) {
    const schedule = parseScheduleInput(msg);
    if (schedule) {
      const startDate = `2025-${String(schedule.startMonth).padStart(2,'0')}-${String(schedule.startDay).padStart(2,'0')}`;
      const endDate = `2025-${String(schedule.endMonth).padStart(2,'0')}-${String(schedule.endDay).padStart(2,'0')}`;
      addSchedule({startDate, endDate, title: schedule.title});
    } else {
      appendMessage('챗봇', '일정 정보를 이해하지 못했어요. 예: "7월 5일부터 7월 7일까지 회의 일정 추가해줘"');
    }
    input.value = '';
    return;
  }
      sendMessageToBot(msg);
      input.value = '';
    }

    function appendMessage(sender, message) {
      const log = document.getElementById('chat-log');
      const div = document.createElement('div');
      div.innerHTML = `<strong>${sender}:</strong> ${message}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function sendMessageToBot(msg) {
      fetch('/chatbot/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      })
        .then(res => res.text())
        .then(reply => {
          appendMessage('챗봇', reply);
        })
        .catch(err => {
          appendMessage('챗봇', '⚠️ 오류가 발생했습니다.');
          console.error(err);
        });
    }
    
    function sendChat() {
    	  const input = document.getElementById('chat-input');
    	  const msg = input.value.trim();
    	  if (!msg) return;

    	  appendMessage('나', msg);

    	  // 룰 기반 명령 처리
    	  if (msg.includes('캘린더') || msg.includes('일정')) {
    	    appendMessage('챗봇', '📅 캘린더로 이동합니다.');
    	    window.location.href = '/muscat/cal/calMonth.do';  // 캘린더 페이지 경로로 이동
    	    return;
    	  }

    	  sendMessageToBot(msg);
    	  input.value = '';
    	}
    
    function sendChat() {
    	  const input = document.getElementById('chat-input');
    	  const msg = input.value.trim();
    	  if (!msg) return;

    	  appendMessage('나', msg);

    	  // 🧠 키워드 기반 명령 처리
    	  const lowerMsg = msg.toLowerCase(); // 소문자로 통일해서 처리

    	  if (lowerMsg.includes('게시판')) {
    	    appendMessage('챗봇', '📝 게시판으로 이동합니다!');
    	    window.location.href = '/muscat/board/masterList.do';
    	    return;
    	  }

    	  // 그 외 일반 메시지는 AI 또는 룰 처리
    	  sendMessageToBot(msg);
    	  input.value = '';
    	}
    
    //일정 추가 
    function parseScheduleInput(text) {
    	  // 아주 단순 예시, 실제로는 정규식, 날짜 파싱 라이브러리 필요
    	  // "7월 5일부터 7월 7일까지 회의 일정 추가해줘"
    	  const match = text.match(/(\d+)월\s*(\d+)일.*?(\d+)월\s*(\d+)일.*?(.+)일정/);
    	  if (!match) return null;

    	  return {
    	    startMonth: Number(match[1]),
    	    startDay: Number(match[2]),
    	    endMonth: Number(match[3]),
    	    endDay: Number(match[4]),
    	    title: match[5].trim()
    	  };
    	}
    
    function addSchedule(schedule) {
    	  fetch('/api/schedule/add', {
    	    method: 'POST',
    	    headers: { 'Content-Type': 'application/json' },
    	    body: JSON.stringify(schedule)
    	  })
    	  .then(res => res.json())
    	  .then(data => {
    	    if (data.success) {
    	      appendMessage('챗봇', '일정이 성공적으로 추가되었습니다! 📅');
    	    } else {
    	      appendMessage('챗봇', '일정 추가에 실패했습니다. 다시 시도해주세요.');
    	    }
    	  })
    	  .catch(() => {
    	    appendMessage('챗봇', '서버 오류가 발생했습니다.');
    	  });
    	}

  </script>

</main>
</html>
