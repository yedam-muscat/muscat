<style>
#chatbot-modal {
	 position: fixed;
   top: 100px;        /* ← 여기 */
  left: 100px;
  width: 300px;
  height: 400px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  z-index: 1000;
  display: none;
  flex-direction: column;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  resize: both;
  overflow: auto;
  min-width: 250px;
  min-height: 300px;
  max-width: 500px;
  max-height: 700px;
  user-select: none; /* 드래그시 텍스트 선택 방지 */
}
/* 헤더는 드래그 영역 */
.chatbot-header {
  background-color: #007bff;
  color: white;
  font-weight: bold;
  text-align: center;
  padding: 12px;
  font-size: 16px;
  cursor: move; /* 마우스 커서 이동 모양 */
  flex-shrink: 0;
}

#chatbot-modal.show {
	display: flex;
	opacity: 1;
	transform: translateY(0);
}

/*  헤더 */
.chatbot-header {
	background-color: #007bff;
	color: white;
	font-weight: bold;
	text-align: center;
	padding: 12px;
	font-size: 16px;
	flex-shrink: 0;
}

/*  본문 */
.chatbot-body {
	flex: 1;
	padding: 10px;
	overflow-y: auto;
	background-color: #f9f9f9;
}

/* ️ 입력 영역 */
.chatbot-footer {
	padding: 10px;
	display: flex;
	gap: 5px;
	border-top: 1px solid #ddd;
	background-color: #fff;
	flex-shrink: 0;
}

.chatbot-footer input[type="text"] {
	flex: 1;
	padding: 6px;
	border: 1px solid #ccc;
	border-radius: 4px;
}

.chatbot-footer button {
	padding: 6px 10px;
	background-color: #007bff;
	border: none;
	color: white;
	border-radius: 4px;
	cursor: pointer;
}

.chatbot-footer button:hover {
	background-color: #0056b3;
}
/* 공통 스타일 */
.message {
  display: flex;
  margin: 6px 0;
}

.message .bubble {
  padding: 8px 12px;
  border-radius: 15px;
  max-width: 70%;
  font-size: 14px;
  line-height: 1.4;
}

/* 사용자 메시지: 오른쪽 */
.message.user {
  justify-content: flex-end;
}

.message.user .bubble {
  background-color: #d1e7ff;
  color: black;
  border-bottom-right-radius: 0;
}

/* 챗봇 메시지: 왼쪽 */
.message.bot {
  justify-content: flex-start;
}

.message.bot .bubble {
  background-color: #e9ecef;
  color: black;
  border-bottom-left-radius: 0;
}

</style>
			<!--  챗봇 아이콘 -->
			<div id="chatbot-icon" style="position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; 
			background: #007bff; color: white; font-size: 30px; text-align: center; line-height: 60px; cursor: pointer; z-index: 1000;">🤖</div>

			<!--  모달 챗봇창 -->
			<div id="chatbot-modal">

				<div class="chatbot-header">하리</div>
				<div class="chatbot-body" id="chat-log"
					style="flex: 1; padding: 10px; overflow-y: auto;"></div>

				<div class="chatbot-footer">
					<input type="text" id="chat-input" style="flex: 1;"
						placeholder="메시지를 입력하세요">
					<button id="chat-send">전송</button>
				</div>

			</div>
			<!-- 기존 footer 코드 위 또는 아래에 삽입 -->
			<div id="miniAlert" onclick="openChatRoomFromAlert()" 
			     style="display:none; position: fixed; bottom: 20px; right: 20px; 
			     z-index: 9999; background: white; border: 1px solid #ccc; 
			     border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); 
			     padding: 10px 15px; cursor: pointer;"></div>


			
	<script>
    // 아이콘 클릭 시 모달 열기/닫기
    document.getElementById('chatbot-icon').onclick = function () {
    	const modal = document.getElementById('chatbot-modal');
    	const header = document.querySelector('.chatbot-header');

    	let isDragging = false;
    	let offsetX, offsetY;

    	header.addEventListener('mousedown', function(e) {
    	  isDragging = true;
    	  offsetX = e.clientX - modal.getBoundingClientRect().left;
    	  offsetY = e.clientY - modal.getBoundingClientRect().top;
    	  document.body.style.userSelect = 'none'; // 텍스트 선택 방지
    	});

    	document.addEventListener('mousemove', function(e) {
    	  if (!isDragging) return;

    	  const left = e.clientX - offsetX;
    	  const top = e.clientY - offsetY;

    	  modal.style.left = left + 'px';
    	  modal.style.top = top + 'px';
    	  modal.style.right = 'auto';
    	  modal.style.bottom = 'auto';
    	});

    	document.addEventListener('mouseup', function(e) {
    	  if (isDragging) {
    	    isDragging = false;
    	    document.body.style.userSelect = '';
    	  }
    	});
    };

    // 전송 버튼 클릭 시 메시지 전송
    document.getElementById('chat-send').onclick = function () {
      sendChat();
    };

    // Enter 키로도 전송 가능
    document.getElementById('chat-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        sendChat();
      }
    });
  
    function sendChat() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;
      appendMessage('나', msg);
      
   // 캘린더 이동
      if (msg.includes('#캘린더') || msg.includes('#일정')) {
        appendMessage('챗봇', '📅 캘린더로 이동합니다.');
        window.location.href = '/muscat/cal/calMonth.do';  // 캘린더 페이지 경로로 이동
        return;
      }else if (msg.includes('#게시판')){
          appendMessage('챗봇', '📝 게시판으로 이동합니다!');
          window.location.href = '/muscat/board/masterList.do';  // 캘린더 페이지 경로로 이동
          return;
      }
      sendMessageToBot(msg);
      input.value = '';
    }

    function appendMessage(sender, message) {
    	  const log = document.getElementById('chat-log');
    	  const div = document.createElement('div');

    	  // 보낸 사람에 따라 클래스 지정
    	  const isBot = sender === '챗봇';
    	  div.className = isBot ? 'message bot' : 'message user';
	

    	  // 줄바꿈 처리
    	  const formatted = message.replace(/\n/g, "<br>");
    	  div.innerHTML = `<div class="bubble"><strong>${sender}:</strong><br>${formatted}</div>`;
    	  log.appendChild(div);
    	  log.scrollTop = log.scrollHeight;
    	}
    

    document.addEventListener('DOMContentLoaded', () => {
    	  const icon  = document.getElementById('chatbot-icon');
    	  const modal = document.getElementById('chatbot-modal');
    	  const input = document.getElementById('chat-input');

    	  icon.addEventListener('click', () => {
    		  const isOpen = modal.classList.contains('show');

    		  if (isOpen) {
    		    modal.classList.remove('show');
    		    setTimeout(() => { modal.style.display = 'none'; }, 300);
    		  } else {
    		    // 위치 계산
    		    const iconRect = icon.getBoundingClientRect();
    		    const modalHeight = 400; // 또는 modal.offsetHeight
    		    const modalWidth = 300;

    		    // 🟡 화면 밖으로 나가지 않도록 top 보정
    		    const calculatedTop = iconRect.top - modalHeight - 10;
    		    const top = Math.max(10, calculatedTop); // 최소 10px 위 여백

    		    // ⬅️ 왼쪽도 화면 벗어나지 않게
    		    const calculatedLeft = iconRect.left + (iconRect.width / 2) - (modalWidth / 2);
    		    const maxLeft = window.innerWidth - modalWidth - 10;
    		    const left = Math.max(10, Math.min(calculatedLeft, maxLeft));

    		    modal.style.display = 'flex';
    		    modal.style.top = `${top}px`;
    		    modal.style.left = `${left}px`;
    		    modal.style.bottom = 'auto';
    		    modal.style.right = 'auto';

    		    requestAnimationFrame(() => {
    		      modal.classList.add('show');
    		      input.focus();

    		      if (!document.getElementById('chat-log').hasChildNodes()) {
    		        showWelcomeMessage();
    		      }
    		    });
    		  }
    		});
    	});
    function sendMessageToBot(message) {
    	  fetch('/muscat/chatbot/message.do', {
    	    method: 'POST',
    	    headers: { 'Content-Type': 'application/json' },
    	    body: JSON.stringify({ message: message })
    	  })
    	  .then(response => response.json())
    	  .then(botReply => {
    	    appendMessage('챗봇', botReply);
    	  })
    	  .catch(err => {
    	    appendMessage('챗봇', '⚠️ 서버와 통신 중 오류가 발생했습니다.');
    	    console.error(err);
    	  });
    	}
    
    //도움말
    function showWelcomeMessage() {
    	  appendMessage('챗봇', `안녕하세요 😊 저는 하리입니다.\n무엇을 도와드릴까요?\n\n📝 사용법 안내\n------------------------------\n- ⏰ 현재 시간: "지금 몇 시야?"\n- 🌍 세계 시간: "세계 시간 알려줘"\n- 📅 페이지 이동: **#캘린더**, **#게시판** 등\n- 🧍 직원 검색: "김하리 찾아줘"\n\n👉 *페이지 이동 시에는 꼭 # 기호를 붙여주세요!*`);
    	}

  </script>
		</div>
	</div>
</footer>
</html>
