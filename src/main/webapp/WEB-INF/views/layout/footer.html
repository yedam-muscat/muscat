<html xmlns:th="http://www.thymeleaf.org">

	<div class="footer clearfix mb-0 text-muted">

<style>
#chatbot-modal {
	position: fixed;
	bottom: 90px;
	right: 20px;
	width: 300px;
	height: 400px;
	background: white;
	border: 1px solid #ccc;
	border-radius: 10px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
	z-index: 1000;
	display: none; /* 기본적으로 숨김 */
	flex-direction: column;
	opacity: 0;
	transform: translateY(20px);
	transition: opacity 0.3s ease, transform 0.3s ease;

	/*  아래 5줄 추가로 리사이즈 가능하게 설정 */
	resize: both;
	overflow: auto;
	min-width: 250px;
	min-height: 300px;
	max-width: 500px;
	max-height: 700px;
}

#chatbot-modal.show {
	display: flex;
	opacity: 1;
	transform: translateY(0);
}

/*  헤더 */
.chatbot-header {
	background-color: #007bff;
	color: white;
	font-weight: bold;
	text-align: center;
	padding: 12px;
	font-size: 16px;
	flex-shrink: 0;
}

/*  본문 */
.chatbot-body {
	flex: 1;
	padding: 10px;
	overflow-y: auto;
	background-color: #f9f9f9;
}

/* ️ 입력 영역 */
.chatbot-footer {
	padding: 10px;
	display: flex;
	gap: 5px;
	border-top: 1px solid #ddd;
	background-color: #fff;
	flex-shrink: 0;
}

.chatbot-footer input[type="text"] {
	flex: 1;
	padding: 6px;
	border: 1px solid #ccc;
	border-radius: 4px;
}

.chatbot-footer button {
	padding: 6px 10px;
	background-color: #007bff;
	border: none;
	color: white;
	border-radius: 4px;
	cursor: pointer;
}

.chatbot-footer button:hover {
	background-color: #0056b3;
}
/* 공통 스타일 */
.message {
  display: flex;
  margin: 6px 0;
}

.message .bubble {
  padding: 8px 12px;
  border-radius: 15px;
  max-width: 70%;
  font-size: 14px;
  line-height: 1.4;
}

/* 사용자 메시지: 오른쪽 */
.message.user {
  justify-content: flex-end;
}

.message.user .bubble {
  background-color: #d1e7ff;
  color: black;
  border-bottom-right-radius: 0;
}

/* 챗봇 메시지: 왼쪽 */
.message.bot {
  justify-content: flex-start;
}

.message.bot .bubble {
  background-color: #e9ecef;
  color: black;
  border-bottom-left-radius: 0;
}

</style>
			<!--  챗봇 아이콘 -->
			<div id="chatbot-icon"
				style="position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #007bff; color: white; font-size: 30px; text-align: center; line-height: 60px; cursor: pointer; z-index: 1000;">
				🤖</div>

			<!--  모달 챗봇창 -->
			<div id="chatbot-modal">

				<div class="chatbot-header">하리</div>
				<div class="chatbot-body" id="chat-log"
					style="flex: 1; padding: 10px; overflow-y: auto;"></div>

				<div class="chatbot-footer">
					<input type="text" id="chat-input" style="flex: 1;"
						placeholder="메시지를 입력하세요">
					<button id="chat-send">전송</button>
				</div>

			</div>


			
	<script>
    // 아이콘 클릭 시 모달 열기/닫기
    document.getElementById('chatbot-icon').onclick = function () {
      const modal = document.getElementById('chatbot-modal');
      modal.style.display = modal.style.display === 'none' ? 'flex' : 'none';
    };

    // 전송 버튼 클릭 시 메시지 전송
    document.getElementById('chat-send').onclick = function () {
      sendChat();
    };

    // Enter 키로도 전송 가능
    document.getElementById('chat-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        sendChat();
      }
    });
    function addSchedule(schedule) {
    	  fetch('/api/schedule/add', {
    	    method: 'POST',
    	    headers: { 'Content-Type': 'application/json' },
    	    body: JSON.stringify(schedule)
    	  })
    	  .then(res => res.json())
    	  .then(data => {
    	    if (data.success) {
    	      appendMessage('챗봇', '일정이 성공적으로 추가되었습니다! 📅');
    	    } else {
    	      appendMessage('챗봇', '일정 추가에 실패했습니다. 다시 시도해주세요.');
    	    }
    	  })
    	  .catch(() => {
    	    appendMessage('챗봇', '서버 오류가 발생했습니다.');
    	  });
    	}

    function sendChat() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;
      appendMessage('나', msg);
      
   // 룰 기반 명령 처리
      if (msg.includes('#캘린더') || msg.includes('#일정')) {
        appendMessage('챗봇', '📅 캘린더로 이동합니다.');
        window.location.href = '/muscat/cal/calMonth.do';  // 캘린더 페이지 경로로 이동
        return;
      }else if (msg.includes('#게시판')){
          appendMessage('챗봇', '📝 게시판으로 이동합니다!');
          window.location.href = '/muscat/board/masterList.do';  // 캘린더 페이지 경로로 이동
          return;
      }
      sendMessageToBot(msg);
      input.value = '';
    }

    function appendMessage(sender, message) {
    	  const log = document.getElementById('chat-log');
    	  const div = document.createElement('div');

    	  // 보낸 사람에 따라 클래스 지정
    	  const isBot = sender === '챗봇';
    	  div.className = isBot ? 'message bot' : 'message user';
	

    	  // 줄바꿈 처리
    	  const formatted = message.replace(/\n/g, "<br>");

    	  div.innerHTML = `<div class="bubble"><strong>${sender}:</strong><br>${formatted}`;
    	  log.appendChild(div);
    	  log.scrollTop = log.scrollHeight;
    	}
    

    document.addEventListener('DOMContentLoaded', () => {
    	  const icon  = document.getElementById('chatbot-icon');
    	  const modal = document.getElementById('chatbot-modal');
    	  const input = document.getElementById('chat-input');

    	  icon.addEventListener('click', () => {
    	    const isOpen = modal.classList.contains('show');

    	    if (isOpen) {
    	      /* 닫기 */
    	      modal.classList.remove('show');
    	      setTimeout(() => { modal.style.display = 'none'; }, 300);
    	    } else {
    	      /* 열기 */
    	      modal.style.display = 'flex';          // 먼저 화면에 표시
    	      requestAnimationFrame(() => {          // 다음 페인트 주기에…
    	        modal.classList.add('show');         // 트랜지션 시작
    	        input.focus();                       // 그리고 즉시 포커스!
    	     //  챗봇 열릴 때 환영 메시지 추가
    	        if (!document.getElementById('chat-log').hasChildNodes()) {
    	          showWelcomeMessage();
    	        }
    	      });
    	    }
    	  });
    	});
    function sendMessageToBot(message) {
    	  fetch('/muscat/chatbot/message.do', {
    	    method: 'POST',
    	    headers: { 'Content-Type': 'application/json' },
    	    body: JSON.stringify({ message: message })
    	  })
    	  .then(response => response.text())
    	  .then(botReply => {
    	    appendMessage('챗봇', botReply);
    	  })
    	  .catch(err => {
    	    appendMessage('챗봇', '⚠️ 서버와 통신 중 오류가 발생했습니다.');
    	    console.error(err);
    	  });
    	}
    
    function showWelcomeMessage() {
    	  appendMessage('챗봇', `안녕하세요 😊 저는 하리입니다.\n무엇을 도와드릴까요?\n\n📝 사용법 안내\n------------------------------\n- ⏰ 현재 시간: "지금 몇 시야?"\n- 🌍 세계 시간: "세계 시간 알려줘"\n- 📅 페이지 이동: **#캘린더**, **#게시판** 등\n- 🧍 직원 검색: "김하리 찾아줘"\n\n👉 *페이지 이동 시에는 꼭 # 기호를 붙여주세요!*`);
    	}

  </script>
		</div>
	</div>
</footer>
</html>
