<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>일정 등록</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<style>
* {
	font-style: normal !important;
}

html, body {
	height: 100%;
	margin: 0;
	overflow: hidden;
	font-size: 14px;
}

.compact-form {
	display: flex;
	flex-direction: column;
	gap: 10px;
	height: 100vh;
	padding: 20px 40px;
	width: 800px;
	overflow-y: auto;
}

.form-row {
	display: flex;
	gap: 10px;
	align-items: center;
}

.form-row label {
	min-width: 80px;
	margin-bottom: 0;
}

.form-row input, .form-row select, .form-row textarea {
	flex: 1;
}

textarea {
	resize: none;
}
</style>
</head>

<main layout:fragment="content">
	<div class="container-fluid">
		<div class="row min-vh-100">
			<div class="col-lg-8 col-md-12 col-sm-14 p-7">
				<div class="schedule-form">
					<form id="scheduleForm" method="post" enctype="multipart/form-data">
						<div class="compact-form">
							<!-- 제목 -->
							<div class="form-row">
								<label for="title">제목</label> <input
									th:value="${schedule != null ? schedule.schdulNm : ''}"
									type="text" id="title" class="form-control" required>
							</div>

							<!-- 시작일 -->
							<input type="date" id="start" class="form-control"
								th:value="${schedule != null ? schedule.schdulBgnde.substring(0,4) + '-' + schedule.schdulBgnde.substring(4,6) + '-' + schedule.schdulBgnde.substring(6,8) : ''}"
								required />

							<!-- 시작시간 -->
							<input type="time" id="startTime" class="form-control"
								th:value="${schedule != null ? schedule.schdulBgnde.substring(8,10) + ':' + schedule.schdulBgnde.substring(10,12) : ''}"
								required />

							<!-- 종료일 -->
							<input type="date" id="end" class="form-control"
								th:value="${schedule != null ? schedule.schdulEndde.substring(0,4) + '-' + schedule.schdulEndde.substring(4,6) + '-' + schedule.schdulEndde.substring(6,8) : ''}"
								required />

							<!-- 종료시간 -->
							<input type="time" id="endTime" class="form-control"
								th:value="${schedule != null ? schedule.schdulEndde.substring(8,10) + ':' + schedule.schdulEndde.substring(10,12) : ''}"
								required />


							<!-- 체크박스 -->
							<div class="form-row">
								<div class="form-check me-2">
									<input class="form-check-input" type="checkbox" id="allDay">
									<label class="form-check-label" for="allDay">종일</label>
								</div>
								<div class="form-check me-2">
									<input class="form-check-input" type="checkbox" id="private">
									<label class="form-check-label" for="private">비공개</label>
								</div>
								<div class="form-check">
									<input class="form-check-input" type="checkbox" id="repeat">
									<label class="form-check-label" for="repeat">반복</label>
								</div>
							</div>

							<!-- 참석자 -->
							<div class="form-row">
								<label for="participantInput">참석자</label> <input type="text"
									id="participantInput" class="form-control"
									placeholder="이름 입력 후 추가 클릭">
								<button type="button" class="btn btn-outline-secondary"
									onclick="addParticipant()">+추가</button>
							</div>

							<div id="participantList" class="form-row"></div>

							<!-- 장소 -->
							<div class="form-row">
								<label for="location">장소</label> <input type="text"
									id="location" class="form-control"
									th:value="${schedule != null ? schedule.schdulPlace : ''}">
							</div>

							<!-- 캘린더 -->
							<div class="form-row">
								<label for="calendar">캘린더</label> <select id="calendar"
									class="form-select"
									th:value="${schedule != null ? schedule.calId : ''}">
									<option value="">캘린더 선택</option>
								</select>
							</div>

							<!-- 내용 -->
							<div class="form-row">
								<label for="description">내용</label>
								<textarea id="description" class="form-control" rows="2"
									th:text="${schedule != null ? schedule.schdulCn : ''}"></textarea>
							</div>

							<!-- 장소 예약 -->
							<div class="form-row">
								<label for="room">장소 예약</label> <select id="room"
									class="form-select">
									<option value="">선택 안 함</option>
								</select>
							</div>

							<!-- 첨부파일 -->
							<div class="form-row">
								<label for="file">첨부파일</label> <input type="file" id="file"
									class="form-control">
							</div>

							<!-- 버튼 -->
							<div class="form-row">
								<button id="submitBtn" class="btn btn-success">등록</button>
								<button type="button" class="btn btn-secondary"
									onclick="resetForm()">초기화</button>
								<a href="calMonth.do" class="btn btn-outline-primary">캘린더</a>
							</div>
						</div>
					</form>
				</div>
			</div>

			<div class="col-lg-6 d-none d-lg-block bg-light"></div>
		</div>
	</div>
	<script th:inline="javascript">
   let schedule = /*[[${schedule}]]*/ 'default';
  
   function formatDateTime(date, time) {
	    if (!date || !time) return '';
	    return date.replace(/-/g, '') + time.replace(/:/g, '') + '00';
	  }
   
  function addParticipant() {
    const input = $('#participantInput');
    const name = input.val().trim();
    const list = $('#participantList');

    if (name !== '') {
      const badge = $(`
        <span class="badge bg-secondary d-inline-flex align-items-center" style="padding-right:8px;">
          ${name}
          <button type="button" class="btn-close btn-close-white btn-sm ms-2" aria-label="삭제"></button>
          <input type="hidden" name="participants" value="${name}">
        </span>
      `);
      badge.find('button').click(() => badge.remove());
      list.append(badge);
      input.val('');
    }
  }

  function resetForm() {
    $('#scheduleForm')[0].reset();
    $('#participantList').empty();
    $('#repeatCycle')?.parent().remove();
  }

  $('#allDay').on('change', function () {
    if (this.checked) {
      const startVal = $('#start').val();
      const endVal = $('#end').val();
      if (startVal) $('#startTime').val('00:00');
      if (endVal) $('#endTime').val('23:59');
    }
  });

  $('#repeat').on('change', function () {
    if (this.checked && !$('#repeatCycle').length) {
      const html = `
        <div class="form-section">
          <label class="form-label">반복 주기</label>
          <select id="repeatCycle" name="repeatCycle" class="form-select" style="max-width: 200px;">
            <option value="none">선택 안함</option>
            <option value="daily">매일</option>
            <option value="weekly">매주</option>
            <option value="monthly">매월</option>
            <option value="yearly" selected>매년</option>
          </select>
        </div>`;
      $('#repeat').closest('.form-check').after(html);
    } else {
      $('#repeatCycle')?.parent().remove();
    }
  });

  function loadCalendars(selectedCalId = '') {
	  const $calendar = $('#calendar');
	  $calendar.empty().append(`<option value="">캘린더 선택</option>`);

	  // 내 캘린더 불러오기
	  $.ajax({
	    url: '/muscat/cal/listCalendar',
	    type: 'GET',
	    dataType: 'json',
	    success: function (response1) {
	      const calendars = Array.isArray(response1.result) ? response1.result : response1;
	      calendars.forEach(cal => {
	        const calId = (cal.CAL_ID || '').trim();
	        const calName = (cal.CAL_NAME || '').trim();
	        const color = (cal.COLOR || '#1e90ff').trim();

	        $calendar.append(
	          $('<option></option>')
	            .val(calId)
	            .text(`[내] ${calName}`)
	            .css('color', color)
	        );
	      });

	      // 공유 캘린더도 이어서 불러오기
	      $.ajax({
	        url: '/muscat/cal/sharedCalendars',
	        type: 'GET',
	        dataType: 'json',
	        success: function (response2) {
	          const shared = Array.isArray(response2) ? response2 : response2.result || [];
	          shared.forEach(cal => {
	            const calId = (cal.share_id || '').trim(); // 구분자
	            const calName = (cal.shere_nm || '').trim();
	            const color = (cal.color || '#1e90ff').trim();

	            $calendar.append(
	              $('<option></option>')
	                .val(calId)
	                .text(`[공유] ${calName}`)
	                .css('color', color)
	            );
	          });

	          // 선택된 ID 있으면 세팅
	          if (selectedCalId) {
	            $calendar.val(selectedCalId).prop("selected", true);
	          }
	        },
	        error: function () {
	          alert('공유 캘린더를 불러오는 데 실패했습니다.');
	        }
	      });
	    },
	    error: function () {
	      alert('내 캘린더 목록을 불러오는 데 실패했습니다.');
	    }
	  });
	}

  $('#scheduleForm').on('submit', function (e) {
	  e.preventDefault();

	  const params = new URLSearchParams(window.location.search);
	  const isEditMode = params.get('edit') === 'true';
	  const schdulId = isEditMode ? params.get('schdulId') : 'sch_' + Date.now().toString().slice(-6);

	  const data = {
	    schdulId: schdulId,
	    schdulNm: $('#title').val(),
	    schdulPlace: $('#location').val(),
	    schdulCn: $('#description').val(),
	    schdulBgnde: formatDateTime($('#start').val(), $('#startTime').val()),
	    schdulEndde: formatDateTime($('#end').val(), $('#endTime').val()),
	    frstRegisterId: loginVO.id,
	    leaderId: loginVO.id,
	    schdulChargerId: loginVO.id,
	    calId: $('#calendar').val(),
	    reptitSeCode: $('#repeat').is(':checked') ? repeatMap[$('#repeatCycle').val()] : 'N',
	    reservedRoom: $('#room').val()
	  };

	  const url = isEditMode 
	    ? '/muscat/cal/updateSchedule' 
	    : '/muscat/cal/insertSchedule';

	  $.ajax({
	    url: url,
	    type: 'POST',
	    contentType: 'application/json',
	    data: JSON.stringify(data),
	    success: function () {
	      Swal.fire({
	        icon: 'success',
	        title: isEditMode ? '일정이 수정되었습니다!' : '일정이 등록되었습니다!',
	        confirmButtonText: '확인'
	      }).then(() => {
	        window.location.href = 'calMonth.do';
	      });
	    },
	    error: function (xhr) {
	      alert((isEditMode ? '수정' : '등록') + ' 실패: ' + xhr.responseText);
	    }
	  });
	});

  $('#start, #startTime, #end, #endTime').on('change', loadAvailableRooms);

  function loadAvailableRooms(selectedRoomId = '') {
	  console.log('룸아이디')
	  const start = $('#start').val();
	  const startTime = $('#startTime').val();
	  const $roomSelect = $('#room');

	  $roomSelect.empty().append('<option value="">선택 안 함</option>');

	  const loadAndSet = function (rooms) {
	    rooms.forEach(room => {
	      $roomSelect.append(`<option value="${room.MTGRUM_ID}">${room.MTGRUM_NM}</option>`);
	    });
	    if (selectedRoomId) {
	        $roomSelect.val(selectedRoomId).prop("selected", true);

	        const selectedRoomName = $roomSelect.find('option:selected').text();
	        $('#location').val(selectedRoomName === '선택 안 함' ? '' : selectedRoomName);
	      }
	    };

	  if (!start || !startTime) {
	    $.ajax({
	      url: '/muscat/cal/allRooms',
	      type: 'GET',
	      success: function (response) {
	        const rooms = Array.isArray(response) ? response : response.result || [];
	        loadAndSet(rooms);
	      },
	      error: function () {
	        alert('전체 회의실 목록을 불러오는 데 실패했습니다.');
	      }
	    });
	  } else {
	    const reserveDateTime = start.replace(/-/g, "") + startTime.replace(/:/g, "") + "00";
	    $.ajax({
	      url: '/muscat/cal/availableRooms',
	      type: 'GET',
	      data: { reserveDateTime },
	      success: function (response) {
	        const rooms = Array.isArray(response) ? response : response.result || [];
	        loadAndSet(rooms);
	      },
	      error: function () {
	        alert('예약 가능한 회의실 목록을 불러오는 데 실패했습니다.');
	      }
	    });
	  }
	}

  $(document).ready(() => {
	  const params = new URLSearchParams(window.location.search);
	  const isEditMode = (params.get('edit') || '').toLowerCase() === 'true';
	  const schdulId = params.get('schdulId');

	  if (isEditMode) {
		    $('#submitBtn').text('수정');
		  

	    $.ajax({
	      url: '/muscat/cal/getSchedule',
	      type: 'GET',
	      data: { schdulId },
	      success: function (data) {
	        $('#title').val(data.schdulNm);
	        $('#start').val(data.schdulBgnde?.slice(0, 8)?.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'));
	        $('#startTime').val(data.schdulBgnde?.slice(8, 12)?.replace(/(\d{2})(\d{2})/, '$1:$2'));
	        $('#end').val(data.schdulEndde?.slice(0, 8)?.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'));
	        $('#endTime').val(data.schdulEndde?.slice(8, 12)?.replace(/(\d{2})(\d{2})/, '$1:$2'));
	        $('#location').val(data.schdulPlace);
	        $('#description').val(data.schdulCn);
	      
	        loadCalendars(data.calId);
	        loadAvailableRooms(data.roomId);
	      },
	      error: function () {
	        alert('일정 정보를 불러오지 못했습니다.');
	      }
	    });
	  } else {
		  $('#submitBtn').text('등록');
		    loadCalendars();        // 그냥 목록만
		    loadAvailableRooms();   // 그냥 목록만
	  }

	  
	  $('#room').on('change', function () {
	    const selectedRoomName = $(this).find('option:selected').text();
	    $('#location').val(selectedRoomName === '선택 안 함' ? '' : selectedRoomName);
	  });
	});
</script>

</main>
</html>
