<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>캘린더</title>
<link
	href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css"
	rel="stylesheet" />
<script
	src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/ko.js"></script>
<style>
/* 모달 헤더 스타일 */
* {font-style: normal !important;}
.modal-header {background-color: #0d6efd; color: white; border-bottom: 1px solid #dee2e6;}
.modal-title {font-weight: 600; font-size: 1.25rem;font-style: normal;}
.btn-close {filter: brightness(0) invert(1);}
/* 모달 바디 스타일 */
.modal-body label {font-weight: 500; margin-top: 0.5rem;}
.modal-body input.form-control {border-radius: 0.375rem; padding: 0.5rem 0.75rem; font-size: 0.95rem;}
/* 모달 푸터 스타일 */
.modal-footer {border-top: 1px solid #dee2e6; padding-top: 0.75rem;}
.modal-content {border-radius: 12px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);}
/* 버튼 스타일 조정 */
.modal-footer .btn-primary {background-color: #0d6efd; border: none;}
.modal-footer .btn-primary:hover {background-color: #0b5ed7;}
.modal-footer .btn-secondary {background-color: #6c757d; border: none;}
.modal-footer .btn-secondary:hover {background-color: #5c636a;}
</style>
</head>
<main layout:fragment="content">
	<div class="calendar-sidebar">
		<div class="p-1 border-end"
			style="background-color: #f3fdee; width: 220px; height: 700px; float: left;">
			<button class="btn btn-success w-100 mt-2"
				onclick="location.href='calDetail.do'">일정등록</button>
			<h6
				class="my-calendar-header border-top mt-2 d-flex justify-content-between align-items-center">
				<strong>내 캘린더함</strong>
				<button class="btn btn-sm btn-outline-secondary py-0 px-2"
					id="addMyCalendar">+</button>
			</h6>
			<div id="myCalendarList"></div>
			<h6
				class="shared-calendar-header border-top mt-2 d-flex justify-content-between align-items-center">
				<strong>공유 캘린더</strong>
				<button class="btn btn-sm btn-outline-secondary py-0 px-2"
					id="addSharedCalendar">+</button>
			</h6>
			<div id="sharedCalendarList"></div>
		</div>
	</div>
	<div class="container-fluid" style="padding-right: 50px">
		<div id="calendar" style="margin-left: 220px;"></div>
	</div>
	<!-- 모달창 -->
	<div class="modal fade" id="eventModal" tabindex="-1"
		aria-labelledby="eventModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="eventModalLabel">일정 등록</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="닫기"></button>
				</div>
				<div class="modal-body">
					<form id="eventForm">
						<div class="mb-3">
							<label for="eventTitle" class="form-label">제목</label> <input
								type="text" class="form-control" id="eventTitle" required>
							<label for="calendarSelect" class="form-label">캘린더 선택</label> <select
								id="calendarSelect" class="form-select mb-2" required>
								<option value="">캘린더 선택</option>
							</select> <label for="eventContent" class="form-label">내용</label> <input
								type="text" class="form-control" id="eventContent" required>
							<label for="eventlocation" class="form-label">장소</label> <input
								type="text" class="form-control" id="eventlocation" required>
							<label for="startTime" class="form-label">시작 시간</label> <input
								type="time" class="form-control" id="startTime" required>
							<label for="endTime" class="form-label">종료 시간</label> <input
								type="time" class="form-control" id="endTime" required>
						</div>
						<input type="hidden" id="eventStart"> <input type="hidden"
							id="eventEnd"> <input type="hidden" id="eventAllDay">
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">닫기</button>
					<button type="button" class="btn btn-primary" id="saveEventBtn">저장</button>
				</div>
			</div>
		</div>
	</div>
	<!-- 캘린더 등록 -->
	<div class="modal fade" id="calendarModal" tabindex="-1"
		aria-labelledby="calendarModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content p-3">
				<div class="d-flex justify-content-between align-items-center mb-2">
					<h5 class="modal-title">캘린더 등록</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="닫기"></button>
				</div>
				<div>
					<label class="form-label">이름</label> <input type="text"
						id="calendarName" class="form-control mb-2"> <label
						class="form-label">색상</label> <input type="color"
						id="calendarColor" class="form-control form-control-color mb-3"
						value="#1e90ff">
					<div class="mt-4 d-flex justify-content-end">
						<button class="btn btn-secondary me-2" data-bs-dismiss="modal">취소</button>
						<button class="btn btn-success" id="saveCalendarBtn">등록</button>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- 공유 캘린더 등록 모달 -->
	<div class="modal fade" id="calendarModalShared" tabindex="-1"
		aria-labelledby="calendarModalSharedLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content p-3">
				<div class="d-flex justify-content-between align-items-center mb-2">
					<h5 class="modal-title">공유 캘린더 등록</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
				</div>
				<div>
					<label class="form-label">캘린더 이름</label> 
					<input type="text" id="calendarSharedName" class="form-control mb-2">
						 <label class="form-label">캘린더 색상</label> 
						<input type="color" id="calendarSharedColor" class="form-control form-control-color mb-3" value="#1e90ff">
					<div class="mb-3">
						<label for="userList" class="form-label">공유 대상 선택</label>
						<div id="userList" style="max-height: 200px; overflow-y: auto; border: 1px solid #ccc; padding: 8px; border-radius: 4px;"></div>
					</div>
					<div class="mt-4 d-flex justify-content-end">
						<button class="btn btn-secondary me-2" data-bs-dismiss="modal">취소</button>
						<button class="btn btn-success" id="saveSharedCalendarBtn">등록</button>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- 일정 상세 보기 모달 -->
	<div class="modal fade" id="eventDetailModal" tabindex="-1"
		aria-labelledby="eventDetailModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content p-3">
				<div class="modal-header">
					<h5 class="modal-title" id="eventDetailModalLabel">일정 상세 정보</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
				</div>
				<div class="modal-body">
					<input type="hidden" id="detailScheduleId">
					<p>
						<strong>제목:</strong> <span id="detailTitle"></span>
					</p>
					<p>
						<strong>내용:</strong> <span id="detailContent"></span>
					</p>
					<p>
						<strong>장소:</strong> <span id="detailPlace"></span>
					</p>
					<p>
						<strong>시작:</strong> <span id="detailStart"></span>
					</p>
					<p>
						<strong>종료:</strong> <span id="detailEnd"></span>
					</p>
				</div>
				<div class="modal-footer">
					<button class="btn btn-danger" id="deleteEventBtn">삭제</button>
					<button class="btn btn-primary" id="editEventBtn">수정</button>
					<button class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
				</div>
			</div>
		</div>
	</div>
	<!-- 캘린더 수정 모달 -->
	<div class="modal fade" id="calendarEditModal" tabindex="-1"
		aria-labelledby="calendarEditModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="calendarEditModalLabel">캘린더 수정</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
				</div>
				<div class="modal-body">
					<input type="hidden" id="editCalendarId">
					<input type="hidden" id="editCalendarType">
					<div class="mb-3">
						<label for="editCalendarName" class="form-label">캘린더 이름</label> 
						<input type="text" class="form-control" id="editCalendarName">
					</div>
					<div class="mb-3">
						<label for="editCalendarColor" class="form-label">색상</label> 
						<input type="color" class="form-control form-control-color" id="editCalendarColor" value="#1e90ff" title="색상 선택">
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" id="deleteCalendarBtn" class="btn btn-danger">삭제</button>
					<button type="button" id="updateCalendarBtn" class="btn btn-primary">저장</button>
				</div>
			</div>
		</div>
	</div>
	<script>
	console.log(loginVO);
	// 공유 대상 선택용 사용자 리스트
	  const selectedUsers = new Set();
	// 유저 선택 토글
	function toggleUser(mberId, event) {
		let selectedItem = $(event.target);
		if (selectedUsers.has(mberId)) {
			selectedUsers.delete(mberId);
			selectedItem.css('background', 'transparent');
		} else {
			selectedUsers.add(mberId);
			selectedItem.css('background', '#007bff');
		}
	}
	document.addEventListener('DOMContentLoaded', function () {
		console.log('✅ 로그인 정보:', loginVO); 
		  let clickTimer = null;
		  let isAll = false;
		  const calendarModal = new bootstrap.Modal(document.getElementById('calendarModal'));
		  const eventModal = new bootstrap.Modal(document.getElementById('eventModal'));
		  let calendarColors = {};
	  // 캘린더 목록 불러오기 함수
	 function loadCalendars(callback) {
      $.ajax({
        url: '/muscat/cal/listCalendar',
        method: 'GET',
        data: { ownerId: loginVO.id.trim() },
        success: function (response) {
          const calendars = Array.isArray(response.result) ? response.result : response;
          calendarColors = {}; // 초기화
          $('#myCalendarList').empty();
          $('#sharedCalendarList').empty();
          $('#calendarSelect').empty().append('<option value="">캘린더 선택</option>');
          if (Array.isArray(calendars)) {
            calendars.forEach(cal => {
              const calId = (cal.CAL_ID || '').trim();
              const color = (cal.COLOR || '#1e90ff').trim();
              calendarColors[calId] = color;
              const calName = (cal.CAL_NAME || '').trim();
              const ownerId = (cal.OWNER_ID || '').trim();   
              const html = `
            	    <div class="calendar-item"
            	         data-calendar-id="${calId}"
            	         data-calendar-type="${ownerId === loginVO.id ? 'personal' : 'shared'}"
            	         data-owner-id="${ownerId}"
            	         style="cursor:pointer;">
            	      <input type="checkbox" class="calendar-toggle" data-calendar-id="${calId}" checked>
            	      <span style="color: ${color};">●</span> ${calName}
            	    </div>`;
              if (ownerId === loginVO.id) {
                $('#myCalendarList').append(html);
              } else {
                $('#sharedCalendarList').append(html);
              }
              $('#calendarSelect').append(`<option value="${calId}">${calName}</option>`);
            });
            if (callback) callback();
          } else {
            Swal.fire({ icon: 'error', title: '불러오기 실패',  text: '캘린더 목록을 불러오지 못했습니다.'});
          }
        },
        error: function () {
          Swal.fire({icon: 'error', title: '불러오기 실패', text: '서버에서 캘린더 목록을 불러오지 못했습니다.'});
        }
      });
    }
	 function renderSharedCalendars(sharedCalendars) {
		  const $container = $('#sharedCalendarList');
		  $container.empty();
		  sharedCalendars.forEach(cal => {
			    const calId = (cal.shareId || '').trim();
			    const calName = (cal.shereNm || '').trim();
			    const color = (cal.shColor || '#1e90ff').trim();
			    const ownerId = (cal.ownerId || '').trim();
			    const html = `
			        <div class="calendar-item"
			             data-calendar-id="${calId}"
			             data-calendar-type="shared"
			             data-owner-id="${ownerId}"
			             style="cursor:pointer;">
			          <input type="checkbox" class="calendar-toggle" data-calendar-id="${calId}" checked>
			          <span style="color: ${color};">●</span> ${calName}
			        </div>`;
		    $container.append(html);
		  });
		}
	  //loadCalendars();
	  function loadSharedCalendars(callback) {
  $.ajax({
    url: '/muscat/cal/sharedCalendars',
    type: 'GET',
    data: { loginId: loginVO.id},
    success: function (response) {
      const sharedCalendars = response.result || response || [];
      console.log('✅ 공유 캘린더 API 응답:', response);
      const $container = $('#sharedCalendarList');
      $container.empty();
      sharedCalendars.forEach(cal => {
        const calId = (cal.shareId || cal.share_id || '').trim();
        const calName = (cal.shereNm || '').trim();
        const color = (cal.shColor || cal.color || '#1e90ff').trim();
        const ownerId = (cal.ownerId || '').trim();
        calendarColors[calId] = color;
        const html = `
            <div class="calendar-item"
                 data-calendar-id="${calId}"
                 data-calendar-type="shared"
                 data-owner-id="${ownerId}"
                 style="cursor:pointer;">
              <input type="checkbox" class="calendar-toggle" data-calendar-id="${calId}" checked>
              <span style="color: ${color};">●</span> ${calName}
            </div>`;
        $container.append(html);
        $('#calendarSelect').append(`<option value="${calId}">${calName}</option>`);
      });
      // 공유 캘린더 리스트 렌더링
      renderSharedCalendars(sharedCalendars);
      if (callback) callback();
    },
    error: function (xhr, status, error) {
      console.error('❌ 공유 캘린더 API 오류:', status, error);
      Swal.fire({icon: 'error',title: '공유 캘린더 로딩 실패', text: '서버에서 공유 캘린더 목록을 불러오지 못했습니다.'});
      if (callback) callback();
    }
  });
}
	  //등록모달창
	  function populateCalendarSelect($select, selectedCalType = null, selectedCalId = null) {
		  $select.empty().append('<option value="">캘린더 선택</option>');
		  // 내 캘린더
		  $.ajax({
		    url: '/muscat/cal/listCalendar',
		    type: 'GET',
		    data: { ownerId: loginVO.id.trim() },
		    dataType: 'json',
		    success: function (response1) {
		      const calendars = Array.isArray(response1.result) ? response1.result : response1;
		      calendars.forEach(cal => {
		        const calId = (cal.CAL_ID || '').trim();
		        const calName = (cal.CAL_NAME || '').trim();
		        const color = (cal.COLOR || '#1e90ff').trim();
		        $select.append(
		          $('<option></option>').val(`personal:${calId}`).text(`[내] ${calName}`).css('color', color)
		        );
		      });
		      // 공유 캘린더도 이어서 로딩
		      $.ajax({
		        url: '/muscat/cal/sharedCalendars',
		        type: 'GET',
		        data: { loginId: loginVO.id.trim() },
		        dataType: 'json',
		        success: function (response2) {
		          const shared = Array.isArray(response2.result) ? response2.result : response2;
		          shared.forEach(cal => {
		            const calId = (cal.shareId || cal.share_id || '').trim();
		            const calName = (cal.shereNm || '').trim();
		            const color = (cal.shColor || cal.color || '#1e90ff').trim();
		            $select.append(
		              $('<option></option>').val(`shared:${calId}`).text(`[공유] ${calName}`).css('color', color)
		            );
		          });
		          // 선택값 있으면 설정
		          if (selectedCalType && selectedCalId) {
		            $select.val(`${selectedCalType}:${selectedCalId}`);
		          }
		        },
		        error: function () {
		          Swal.fire({  icon: 'error', title: '공유 캘린더 불러오기 실패',  text: '공유 캘린더를 불러오지 못했습니다.'});
		        }
		      });
		    },
		    error: function () {
		      Swal.fire({ icon: 'error', title: '내 캘린더 불러오기 실패', text: '내 캘린더를 불러오지 못했습니다.'});
		    }
		  });
		}	  
	  const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
	      initialView: 'dayGridMonth',
	      locale: 'ko',
	      themeSystem: 'bootstrap5',
	      height: 700,
	      fixedWeekCount: false,
	      dayMaxEventRows: true,
	      headerToolbar: {left: 'prev,next today',center: 'title',right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'},
	      events: function(fetchInfo, successCallback, failureCallback) {
	    	  const checkedCalendars = $('.calendar-toggle:checked')
	    	    .map(function () {return $(this).data('calendar-id') }).get();
	    	  console.log('선택된 캘린더:', checkedCalendars);
	    	  $.ajax({
	    		  url: '/muscat/cal/listSchedule',
	    		  type: 'GET',
	    		  dataType: 'json',
	    		  xhrFields: { withCredentials: true },
	    		  success: function(response) {
	    		    const list = response.result || response || [];
	    		    console.log('✅ 서버 응답 받은 일정 리스트:', list);
	    		    list.forEach(e => console.log('서버 이벤트 데이터:', e));
	    		 // 이벤트 필터링 전에 로그 찍기
	    		      list.forEach(e => {
	    		        console.log('이벤트 ID:', e.schdul_id);
	    		        console.log('  calId:', e.calId);
	    		        console.log('  shareId:', e.shareId || e.share_id);
	    		        console.log('  checkedCalendars:', checkedCalendars);
	    		      });
	    		    const events = list.filter(e => {
	    		        const calId = (e.calId || '').trim();
	    		        const shareId = (e.shareId || e.share_id || '').trim();
	    		        const included = checkedCalendars.includes(calId) || (shareId && checkedCalendars.includes(shareId));
	    		        console.log(`이벤트 ${e.schdul_id} 필터 통과 여부:`, included);
	    		        return included;
	    		      }).map(e => {
	    		        const calId = (e.calId || '').trim();
	    		        const shareId = (e.shareId || e.share_id || '').trim();
	    		        const key = calendarColors[calId] ? calId : shareId;
	    		        return {
	    		          id: e.schdul_id,
	    		          title: e.title || e.schdul_cn || '제목 없음',
	    		          start: e.start_dt,
	    		          end: e.end_dt,
	    		          backgroundColor: calendarColors[key] || e.color || '#3788d8',
	    		          borderColor: calendarColors[key] || e.color || '#3788d8',
	    		          extendedProps: {
	    		            place: e.schdul_place,
	    		            content: e.schdul_cn
	    		          }
	    		        };
	    		      });
	    		    console.log('최종 전달 이벤트:', events);
	    		    successCallback(events); // ✅ 여기 위치로 이동해야 함
	    		  },
	    		  error: failureCallback
	    		});
	      },
	      eventDrop: function(info) {
	    	    handleEventUpdate(info);  // ✅ 일정 드래그(이동) 시
	    	  },

	    	  eventResize: function(info) {
	    	    handleEventUpdate(info);  // ✅ 일정 길이 조절(시간 변경) 시
	    	  },
	      eventDidMount: function(info) {
	        const dotEl = info.el.querySelector('.fc-daygrid-event-dot');
	        if (dotEl && info.event.backgroundColor) {
	          dotEl.style.borderColor = info.event.backgroundColor;
	          dotEl.style.backgroundColor = info.event.backgroundColor;
	        }
	      },
	      selectable: true,
	      editable: true,
	      dateClick: function(info) {
	        if (clickTimer === null) {
	          clickTimer = setTimeout(() => {
	            clickTimer = null;
	            $('#eventTitle').val('').focus();
	            $('#eventContent').val('');
	            $('#eventlocation').val('');
	            $('#eventStart').val(info.dateStr);
	            $('#startTime').val('');
	            $('#endTime').val('');
	            populateCalendarSelect($('#calendarSelect'));
	            eventModal.show();
	          }, 200);
	        } else {
	          clearTimeout(clickTimer);
	          clickTimer = null;
	          const start = new Date(info.date);
	          const end = new Date(start.getTime() + 60 * 60 * 1000);
	          const toLocal = dt => dt.toISOString().slice(0, 16);
	          window.location.href = `calDetail.do?start=${toLocal(start)}&end=${toLocal(end)}`;
	        }
	      },
	      eventClick: function(info) {
	    	  const event = info.event;
	    	  console.log('클릭한 이벤트 ID:', event.id);

	 function handleEventUpdate(info) {
		  const event = info.event; 
		  const scheduleId = event.id;
		  const newStart = event.start;
		  const newEnd = event.end || newStart;

		  const convertToDBFormat = (dateObj) => {
		    return dateObj.toISOString().replace(/[-:T]/g, '').slice(0, 14);
		  };

		  const payload = {
				  schdulId: scheduleId,
				  schdulNm: event.title,        
				  schdulCn: event.extendedProps?.content || '',  
				  schdulPlace: event.extendedProps?.place || '', 
				  schdulBgnde: convertToDBFormat(newStart), schdulEndde: convertToDBFormat(newEnd),        
				  lastUpdusrId: loginVO.id     
		  };
		  $.ajax({
		    type: 'POST',
		    url: '/muscat/cal/updateSchedule',
		    contentType: 'application/json',
		    data: JSON.stringify(payload),
		    success: function () {
		      Swal.fire({
		        icon: 'success',
		        title: '일정 이동 완료',
		        text: '일정 시간이 수정되었습니다.'
		      });

		        title: '수정 실패',
		        text: '서버 오류로 인해 일정 수정에 실패했습니다.'
		      });
		      info.revert();  // 변경 취소
		    }
		  });
		}
