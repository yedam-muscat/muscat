<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
  <meta charset="UTF-8">
  <title>캘린더</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/ko.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  

<style>
  /* 모달 헤더 스타일 */
  .modal-header {
    background-color: #0d6efd;
    color: white;
    border-bottom: 1px solid #dee2e6;
  }

  .modal-title {
    font-weight: 600;
    font-size: 1.25rem;
  }

  .btn-close {
    filter: brightness(0) invert(1); /* 흰색 닫기 버튼 */
  }

  /* 모달 바디 스타일 */
  .modal-body label {
    font-weight: 500;
    margin-top: 0.5rem;
  }

  .modal-body input.form-control {
    border-radius: 0.375rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.95rem;
  }

  /* 모달 푸터 스타일 */
  .modal-footer {
    border-top: 1px solid #dee2e6;
    padding-top: 0.75rem;
  }

  .modal-content {
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  }

  /* 버튼 스타일 조정 */
  .modal-footer .btn-primary {
    background-color: #0d6efd;
    border: none;
  }

  .modal-footer .btn-primary:hover {
    background-color: #0b5ed7;
  }

  .modal-footer .btn-secondary {
    background-color: #6c757d;
    border: none;
  }

  .modal-footer .btn-secondary:hover {
    background-color: #5c636a;
  }
</style>
</head>

<main layout:fragment="content">
  <div class="container">
    <div id="calendar"></div>
  </div>

<!-- 모달창 -->
  <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="eventModalLabel">이벤트 등록</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
        </div>
        <div class="modal-body">
          <form id="eventForm">
            <div class="mb-3">
              <label for="eventTitle" class="form-label">제목</label>
              <input type="text" class="form-control" id="eventTitle" required>
              <label for="eventContent" class="form-label">내용</label>
              <input type="text" class="form-control" id="eventContent" required>
              <label for="eventLocation" class="form-label">장소</label>
              <input type="text" class="form-control" id="eventlocation" required>
              <label for="startTime" class="form-label">시작 시간</label>
			  <input type="time" class="form-control" id="startTime" required>
			  <label for="endTime" class="form-label">종료 시간</label>
			  <input type="time" class="form-control" id="endTime" required>
            </div>
            <input type="hidden" id="eventStart">
            <input type="hidden" id="eventEnd">
            <input type="hidden" id="eventAllDay">
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
          <button type="button" class="btn btn-primary" id="saveEventBtn">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  function formatDateToYYYYMMDDHHMMSS(dateStr) {
	    return dateStr.replace(/-/g, '') + '000000';
	  }
    document.addEventListener('DOMContentLoaded', function () {
      let calendarEl = document.getElementById('calendar');
      let clickTimer = null;

      let calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ko',
        themeSystem: 'bootstrap5',
        height: 700, 
        dayMaxEventRows: true,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        events: 'http://localhost:8082/muscat/cal/listSchedule',
        buttonText: {
          today: '오늘',
          month: '월간',
          week: '주간',
          day: '일간',
          list: '목록'
        },
        selectable: true,
        editable: true,
        dateClick: function(info) {
            if (clickTimer) {
              clearTimeout(clickTimer);
              clickTimer = null;

              // 더블 클릭 시 상세 등록 페이지로 이동
              const selectedDate = info.dateStr;
              window.location.href = 'calDetail.do?date=' + selectedDate;
            } else {
              clickTimer = setTimeout(function () {
                clickTimer = null;

                //단일 클릭 시 모달 열기
                $('#eventTitle').focus();
                $('#eventContent').focus();
                $('#eventLocation').focus();
                $('#eventTitle').val('');
                $('#eventContent').val('');
                $('#eventLocation').val('');
                $('#eventStart').val(info.dateStr);
                $('#eventEnd').val('');
                $('#eventAllDay').val(true);

                const modal = new bootstrap.Modal(document.getElementById('eventModal'));
                modal.show();

              }, 200);
            }
          }
      });

      calendar.render();

      // 저장 버튼
      document.getElementById('saveEventBtn').addEventListener('click', function () {
    	  const title = $('#eventTitle').val();
    	  const content = $('#eventContent').val();
    	  const location = $('#eventlocation').val();
    	  const date = $('#eventStart').val();         // yyyy-MM-dd
    	  const startTime = $('#startTime').val();     // HH:mm
    	  const endTime = $('#endTime').val();         // HH:mm

    	  if (title && date && startTime && endTime) {
    	    const formatDateTime = (date, time) => {
    	      return date.replace(/-/g, '') + time.replace(':', '') + '00';  // yyyyMMddHHmmss
    	    };

    	    const formattedStart = formatDateTime(date, startTime);
    	    const formattedEnd = formatDateTime(date, endTime);

    	    $.ajax({
    	      type: 'POST',
    	      url: 'http://localhost:8082/muscat/cal/insertSchedule.json',
    	      contentType: 'application/json',
    	      data: JSON.stringify({
    	        schdulId: Date.now().toString(),
    	        schdulNm: title,
    	        schdulPlace: location,
    	        schdulBgnde: formattedStart,
    	        schdulEndde: formattedEnd,
    	        frstRegisterId: 'admin',
    	        schdulCn: content,
    	        schdulChargerId: 'admin',
    	        leaderId: 'admin',
    	        schdulDeptId: '',
    	        schdulKindCode: '',
    	        schdulIpcrCode: '',
    	        atchFileId: '',
    	        reptitSeCode: ''
    	      }),
    	      success: function () {
    	        calendar.refetchEvents(); // 이벤트 새로고침
    	        const modal = bootstrap.Modal.getInstance(document.getElementById('eventModal'));
    	        modal.hide();
    	        Swal.fire({
    	          icon: 'success',
    	          title: '저장 완료',
    	          text: '일정이 성공적으로 등록되었습니다!',
    	          confirmButtonText: '확인'
    	        });
    	      },
    	      error: function () {
    	        Swal.fire('에러', '일정 저장 중 오류가 발생했습니다.', 'error');
    	      }
    	    });
    	  } else {
    	    Swal.fire('입력 오류', '모든 입력 항목을 확인해 주세요.', 'warning');
    	  }
    	});
    });
  </script>
</main>
</html>
