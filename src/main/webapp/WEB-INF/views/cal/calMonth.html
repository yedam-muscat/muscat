<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>캘린더</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<link
	href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css"
	rel="stylesheet" />
<script
	src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/ko.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>

/* 모달 헤더 스타일 */
* {
	font-style: normal !important;
}

.modal-header {
	background-color: #0d6efd;
	color: white;
	border-bottom: 1px solid #dee2e6;
}

.modal-title {
	font-weight: 600;
	font-size: 1.25rem;
	font-style: normal;
}

.btn-close {
	filter: brightness(0) invert(1); /* 흰색 닫기 버튼 */
}

/* 모달 바디 스타일 */
.modal-body label {
	font-weight: 500;
	margin-top: 0.5rem;
}

.modal-body input.form-control {
	border-radius: 0.375rem;
	padding: 0.5rem 0.75rem;
	font-size: 0.95rem;
}

/* 모달 푸터 스타일 */
.modal-footer {
	border-top: 1px solid #dee2e6;
	padding-top: 0.75rem;
}

.modal-content {
	border-radius: 12px;
	box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
}

/* 버튼 스타일 조정 */
.modal-footer .btn-primary {
	background-color: #0d6efd;
	border: none;
}

.modal-footer .btn-primary:hover {
	background-color: #0b5ed7;
}

.modal-footer .btn-secondary {
	background-color: #6c757d;
	border: none;
}

.modal-footer .btn-secondary:hover {
	background-color: #5c636a;
}
</style>
</head>

<main layout:fragment="content">
	<div class="calendar-sidebar">
		<div class="p-1 border-end"
			style="background-color: #f3fdee; width: 220px; height: 700px; float: left;">
			<button class="btn btn-success w-100 mt-2"
				onclick="location.href='calDetail.do'">일정등록</button>

			<h6
				class="my-calendar-header border-top mt-2 d-flex justify-content-between align-items-center">
				<strong>내 캘린더</strong>
				<button class="btn btn-sm btn-outline-secondary py-0 px-2"
					id="addMyCalendar">+</button>
			</h6>
			<div id="myCalendarList"></div>

			<h6
				class="shared-calendar-header border-top mt-2 d-flex justify-content-between align-items-center">
				<strong>공유 캘린더</strong>
				<button class="btn btn-sm btn-outline-secondary py-0 px-2"
					id="addSharedCalendar">+</button>
			</h6>
			<div id="sharedCalendarList"></div>
		</div>
	</div>
	<div class="container-fluid" style="padding-right: 50px">
		<div id="calendar" style="margin-left: 220px;"></div>
	</div>

	<!-- 모달창 -->
	<div class="modal fade" id="eventModal" tabindex="-1"
		aria-labelledby="eventModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="eventModalLabel">이벤트 등록</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="닫기"></button>
				</div>
				<div class="modal-body">
					<form id="eventForm">
						<div class="mb-3">
							<label for="eventTitle" class="form-label">제목</label> <input
								type="text" class="form-control" id="eventTitle" required>
							<label for="calendarSelect" class="form-label">캘린더 선택</label> <select
								id="calendarSelect" class="form-select mb-2" required>
								<option value="">캘린더 선택</option>
							</select> <label for="eventContent" class="form-label">내용</label> <input
								type="text" class="form-control" id="eventContent" required>
							<label for="eventlocation" class="form-label">장소</label> <input
								type="text" class="form-control" id="eventlocation" required>
							<label for="startTime" class="form-label">시작 시간</label> <input
								type="time" class="form-control" id="startTime" required>
							<label for="endTime" class="form-label">종료 시간</label> <input
								type="time" class="form-control" id="endTime" required>
						</div>
						<input type="hidden" id="eventStart"> <input type="hidden"
							id="eventEnd"> <input type="hidden" id="eventAllDay">
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">닫기</button>
					<button type="button" class="btn btn-primary" id="saveEventBtn">저장</button>
				</div>
			</div>
		</div>
	</div>

	<!-- 캘린더 등록 -->
	<div class="modal fade" id="calendarModal" tabindex="-1"
		aria-labelledby="calendarModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content p-3">
				<div class="d-flex justify-content-between align-items-center mb-2">
					<h5 class="modal-title">캘린더 등록</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="닫기"></button>
				</div>
				<div>
					<label class="form-label">이름</label> <input type="text"
						id="calendarName" class="form-control mb-2"> <label
						class="form-label">색상</label> <input type="color"
						id="calendarColor" class="form-control form-control-color mb-3"
						value="#1e90ff">
					<div class="mt-4 d-flex justify-content-end">
						<button class="btn btn-secondary me-2" data-bs-dismiss="modal">취소</button>
						<button class="btn btn-success" id="saveCalendarBtn">등록</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 공유 캘린더 등록 모달 -->
	<div class="modal fade" id="calendarModalShared" tabindex="-1"
		aria-labelledby="calendarModalSharedLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content p-3">
				<div class="d-flex justify-content-between align-items-center mb-2">
					<h5 class="modal-title">공유 캘린더 등록</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="닫기"></button>
				</div>
				<div>
					<label class="form-label">캘린더 이름</label> <input type="text"
						id="calendarSharedName" class="form-control mb-2"> <label
						class="form-label">캘린더 색상</label> <input type="color"
						id="calendarSharedColor"
						class="form-control form-control-color mb-3" value="#1e90ff">

					<label class="form-label">공유 대상 선택</label>
					<div class="border p-2" style="height: 300px; overflow-y: auto;"
						id="tree"></div>

					<div class="mt-4 d-flex justify-content-end">
						<button class="btn btn-secondary me-2" data-bs-dismiss="modal">취소</button>
						<button class="btn btn-success" id="saveSharedCalendarBtn">등록</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 일정 상세 보기 모달 -->
	<div class="modal fade" id="eventDetailModal" tabindex="-1"
		aria-labelledby="eventDetailModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content p-3">
				<div class="modal-header">
					<h5 class="modal-title" id="eventDetailModalLabel">일정 상세 정보</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="닫기"></button>
				</div>
				<div class="modal-body">
					<input type="hidden" id="detailScheduleId">
					<p>
						<strong>제목:</strong> <span id="detailTitle"></span>
					</p>
					<p>
						<strong>내용:</strong> <span id="detailContent"></span>
					</p>
					<p>
						<strong>장소:</strong> <span id="detailPlace"></span>
					</p>
					<p>
						<strong>시작:</strong> <span id="detailStart"></span>
					</p>
					<p>
						<strong>종료:</strong> <span id="detailEnd"></span>
					</p>
				</div>
				<div class="modal-footer">
					<button class="btn btn-danger" id="deleteEventBtn">삭제</button>
					<button class="btn btn-primary" id="editEventBtn">수정</button>
					<button class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
				</div>
			</div>
		</div>
	</div>
	<script>
	document.addEventListener('DOMContentLoaded', function () {
		
		  let clickTimer = null;
		  let isAll = false;
		  const calendarModal = new bootstrap.Modal(document.getElementById('calendarModal'));
		  const eventModal = new bootstrap.Modal(document.getElementById('eventModal'));

		  let calendarColors = {};
		  
		  
	  // 캘린더 목록 불러오기 함수
	 function loadCalendars(callback) {
      $.ajax({
        url: 'http://localhost:8082/muscat/cal/listCalendar',
        method: 'GET',
        success: function (response) {
          const calendars = Array.isArray(response.result) ? response.result : response;

          calendarColors = {}; // 초기화

          $('#myCalendarList').empty();
          $('#sharedCalendarList').empty();
          $('#calendarSelect').empty().append('<option value="">캘린더 선택</option>');

          if (Array.isArray(calendars)) {
            calendars.forEach(cal => {
              const calId = (cal.CAL_ID || '').trim();
              const color = (cal.COLOR || '#1e90ff').trim();
              calendarColors[calId] = color;

              const calName = (cal.CAL_NAME || '').trim();
              const ownerId = (cal.OWNER_ID || '').trim();

              const html = `
                <div>
                  <input type="checkbox" class="calendar-toggle" data-calendar-id="${calId}" checked>
                  <span style="color: ${color};">●</span> ${calName}
                </div>`;

              if (ownerId === 'admin') {
                $('#myCalendarList').append(html);
              } else {
                $('#sharedCalendarList').append(html);
              }

              $('#calendarSelect').append(`<option value="${calId}">${calName}</option>`);
              
              if (callback) callback();
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: '불러오기 실패',
              text: '캘린더 목록을 불러오지 못했습니다.'
            });
          }
        },
        error: function () {
          Swal.fire({
            icon: 'error',
            title: '불러오기 실패',
            text: '서버에서 캘린더 목록을 불러오지 못했습니다.'
          });
        }
      });
    }

	  loadCalendars();
	  
	  function initTree() {
		  let originalGroupData = [];

		  $('#tree').jstree('destroy'); // 트리 초기화

		  $.getJSON('/muscat/group/userData.do', function(data) {
		    originalGroupData = data;
		  });

		  $('#tree')
		    .jstree({
		      'core': {
		        'data': {
		          'url': '/muscat/group/userData.do',
		          'dataType': 'json'
		        },
		        'themes': { 'responsive': false }
		      },
		      'types': {
		        'default': { 'icon': 'bi bi-folder' },
		        'user': { 'icon': 'bi bi-person' }
		      },
		      'plugins': ['types', 'checkbox'] 
		    })
		    .on('loaded.jstree', function () {
		      $('#tree').jstree(true).open_all();
		    });
		}
	  
	  const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
	      initialView: 'dayGridMonth',
	      locale: 'ko',
	      themeSystem: 'bootstrap5',
	      height: 700,
	      fixedWeekCount: true,
	      dayMaxEventRows: true,
	      headerToolbar: {
	        left: 'prev,next today',
	        center: 'title',
	        right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
	      },
	      events: function(fetchInfo, successCallback, failureCallback) {
	    	  const checkedCalendars = $('.calendar-toggle:checked')
	    	    .map(function () {
	    	      return $(this).data('calendar-id');
	    	    }).get();
	    	  if (checkedCalendars.length === 0) {
	    	    successCallback([]);
	    	    return;
	    	  }

	        $.ajax({
	          url: 'http://localhost:8082/muscat/cal/listSchedule',
	          type: 'GET',
	          dataType: 'json',
	          success: function(response) {
	            const list = response.result || response || [];

	            // 디버그용: 서버에서 받은 이벤트 로그 찍기
	            list.forEach(e => console.log('서버 이벤트 데이터:', e));

	            const events = list
	            .filter(e => checkedCalendars.includes((e.calId || '').trim())) //필터링
	            .map(e => ({
	              id: e.schdul_id,
	              title: e.title || e.schdul_cn || '제목 없음',
	              start: e.start_dt,
	              end: e.end_dt,
	              backgroundColor: calendarColors[e.calId] ||  e.color || '#3788d8',  // 캘린더 색상 사용
	              borderColor: calendarColors[e.calId] ||  e.color || '#3788d8',
	              extendedProps: {
	                place: e.schdul_place,
	                content: e.schdul_cn
	              }
	            }));
	            successCallback(events);
	          },
	          error: failureCallback
	        });
	      },
	      eventDidMount: function(info) {
	        const dotEl = info.el.querySelector('.fc-daygrid-event-dot');
	        if (dotEl && info.event.backgroundColor) {
	          dotEl.style.borderColor = info.event.backgroundColor;
	          dotEl.style.backgroundColor = info.event.backgroundColor;
	        }
	      },
	      selectable: true,
	      editable: true,
	      dateClick: function(info) {
	        if (clickTimer === null) {
	          clickTimer = setTimeout(() => {
	            clickTimer = null;
	            $('#eventTitle').val('').focus();
	            $('#eventContent').val('');
	            $('#eventlocation').val('');
	            $('#eventStart').val(info.dateStr);
	            $('#startTime').val('');
	            $('#endTime').val('');
	            eventModal.show();
	          }, 200);
	        } else {
	          clearTimeout(clickTimer);
	          clickTimer = null;
	          const start = new Date(info.date);
	          const end = new Date(start.getTime() + 60 * 60 * 1000);
	          const toLocal = dt => dt.toISOString().slice(0, 16);
	          window.location.href = `calDetail.do?start=${toLocal(start)}&end=${toLocal(end)}`;
	        }
	      },
	      eventClick: function(info) {
	    	  const event = info.event;
	    	  console.log('클릭한 이벤트 ID:', event.id);
	    	  $('#detailScheduleId').val(event.id);
	    	  $('#detailTitle').text(event.title);
	    	  $('#detailContent').text(event.extendedProps.content || '');
	    	  $('#detailPlace').text(event.extendedProps.place || '');

	    	  const start = new Date(event.start);
	    	  const end = new Date(event.end);
	    	  const formatTime = dt => dt.toLocaleString('ko-KR', { hour12: false });

	    	  $('#detailStart').text(formatTime(start));
	    	  $('#detailEnd').text(formatTime(end));

	    	  const eventDetailModal = new bootstrap.Modal(document.getElementById('eventDetailModal'));
	    	  eventDetailModal.show();
	    	}
	    });

	    calendar.render();
	    
	    $(document).on('change', '.calendar-toggle', function () {
	    	  calendar.refetchEvents();
	    	});

	  // 이벤트 저장 버튼 클릭
	  $('#saveEventBtn').on('click', function () {
		const newScheduleId = 'sch_' + Date.now().toString().slice(-6);   
		  
	    const title = $('#eventTitle').val().trim();
	    const content = $('#eventContent').val().trim();
	    const location = $('#eventlocation').val().trim();
	    const startDate = $('#eventStart').val();
	    const startTime = $('#startTime').val();
	    const endTime = $('#endTime').val();
	    const calendarId = $('#calendarSelect').val();

	    if (!title || !startDate || !startTime || !endTime || !calendarId) {
	      Swal.fire({
	        icon: 'warning',
	        title: '입력 누락',
	        text: '모든 항목을 입력해 주세요.'
	      });
	      return;
	    }

	    function convertToDBFormat(dateTime) {
	      return dateTime.replace(/[-:T]/g, '') + '00';
	    }

	    const start = `${startDate}T${startTime}`;
	    const end = `${startDate}T${endTime}`;

	    const data = {
	      schdulId: newScheduleId, 
	      schdulNm: title,
	      schdulCn: content,
	      schdulPlace: location,
	      schdulBgnde: convertToDBFormat(start),
	      schdulEndde: convertToDBFormat(end),
	      calId: calendarId,
	      frstRegisterId: 'admin',
	      leaderId: 'admin',
	      schdulChargerId: 'admin'
	    };

	    $.ajax({
	      type: 'POST',
	      url: 'http://localhost:8082/muscat/cal/insertSchedule',
	      contentType: 'application/json',
	      data: JSON.stringify(data),
	      success: function () {
	        eventModal.hide();
	        Swal.fire({
	          icon: 'success',
	          title: '일정 등록 성공',
	          text: '일정이 등록되었습니다.'
	        }).then(() => {
	          calendar.refetchEvents();
	        });
	      },
	      error: function () {
	        Swal.fire({
	          icon: 'error',
	          title: '등록 실패',
	          text: '일정 등록 중 오류가 발생했습니다.'
	        });
	      }
	    });
	  });

	  // 내 캘린더 추가 버튼 클릭
	  $('#addMyCalendar').on('click', function () {
	    isAll = false;
	    $('#calendarName').val('');
	    $('#calendarColor').val('#1e90ff');
	    calendarModal.show();
	  });

	  // 공유 캘린더 추가 버튼 클릭
	  $('#addSharedCalendar').on('click', function () {
  		$('#calendarSharedName').val('');
  		$('#calendarSharedColor').val('#1e90ff');
 		$('#calendarModalShared').modal('show');
  		initTree();  // 조직도 초기화
	  });

	  // 캘린더 저장 버튼 클릭
	  $('#saveCalendarBtn').on('click', function () {
	    const name = $('#calendarName').val().trim();
	    const color = $('#calendarColor').val();

	    if (!name) {
	      Swal.fire({
	        icon: 'warning',
	        title: '입력 오류',
	        text: '캘린더 이름을 입력하세요.'
	      });
	      return;
	    }

	    const newId = 'cal_' + Date.now().toString().slice(-6);  

	    $.ajax({
	      type: 'POST',
	      url: 'http://localhost:8082/muscat/cal/insertCalendar',
	      contentType: 'application/json',
	      data: JSON.stringify({
	        calId: newId,
	        calName: name,
	        color: color,
	        ownerId: 'admin'
	      }),
	      success: function () {
	        const html = `
	          <div>
	            <input type="checkbox" class="calendar-toggle" data-calendar-id="${newId}" checked>
	            <span style="color: ${color};">●</span> ${name}
	          </div>`;

	        if (isAll) {
	          $('#addSharedCalendar').closest('h6').nextUntil('h6').last().after(html);
	        } else {
	          $('#addMyCalendar').closest('h6').nextUntil('h6').last().after(html);
	        }

	        calendarModal.hide();

	        Swal.fire({
	          icon: 'success',
	          title: '등록 완료',
	          text: '캘린더가 성공적으로 등록되었습니다!'
	        }).then(() => {
	          location.reload();
	        });
	      },
	      error: function () {
	        Swal.fire({
	          icon: 'error',
	          title: '저장 실패',
	          text: '캘린더 저장에 실패했습니다.'
	        });
	      }
	    });
	  });
	  //공유캘린더
	  $('#saveSharedCalendarBtn').on('click', function () {
		  const name = $('#calendarSharedName').val().trim();
		  const color = $('#calendarSharedColor').val();
		  const selectedUsers = $('#tree').jstree(true).get_checked(true)
		    .filter(node => node.original.type === 'user')
		    .map(node => node.original.mber_id);

		  if (!name || selectedUsers.length === 0) {
		    Swal.fire({
		      icon: 'warning',
		      title: '입력 오류',
		      text: '캘린더 이름과 공유 대상을 모두 입력하세요.'
		    });
		    return;
		  }

		  const newId = 'cal_' + Date.now().toString().slice(-6);

		  const payload = {
		    calId: newId,
		    calName: name,
		    color: color,
		    ownerId: 'admin',
		    sharedWith: selectedUsers  
		  };

		  $.ajax({
		    type: 'POST',
		    url: 'http://localhost:8082/muscat/cal/insertSharedCalendar', 
		    contentType: 'application/json',
		    data: JSON.stringify(payload),
		    success: function () {
		      $('#calendarModalShared').modal('hide');
		      Swal.fire({
		        icon: 'success',
		        title: '공유 캘린더 등록 완료',
		        text: '공유 캘린더가 성공적으로 등록되었습니다.'
		      }).then(() => location.reload());
		    },
		    error: function () {
		      Swal.fire({
		        icon: 'error',
		        title: '등록 실패',
		        text: '공유 캘린더 등록 중 오류가 발생했습니다.'
		      });
		    }
		  });
		});
	  //삭제
	  $('#deleteEventBtn').on('click', function () {
		  const scheduleId = $('#detailScheduleId').val();

		  Swal.fire({
		    title: '삭제하시겠습니까?',
		    text: '이 일정을 삭제합니다.',
		    icon: 'warning',
		    showCancelButton: true,
		    confirmButtonText: '삭제',
		    cancelButtonText: '취소'
		  }).then((result) => {
		    if (result.isConfirmed) {
		    	$.ajax({
		    		  url: 'http://localhost:8082/muscat/cal/deleteSchedule?schdulId=' + scheduleId,
		    		  type: 'DELETE',
		    		  success: function () {
		    		    Swal.fire('삭제 완료', '일정이 삭제되었습니다.', 'success');
		    		    calendar.refetchEvents();
		    		    $('#eventDetailModal').modal('hide');
		    		  },
		    		  error: function () {
		    		    Swal.fire('삭제 실패', '일정 삭제 중 오류가 발생했습니다.', 'error');
		    		  }
		    		});
		    }
		  });
		});

		// 수정 버튼 클릭 시 calDetail.do 페이지로 이동
	  $('#editEventBtn').on('click', function () {
		  const scheduleId = $('#detailScheduleId').val();
		  window.location.href = 'calDetail.do?edit=true&schdulId=' + scheduleId;
		});
	});
	</script>
</main>
</html>
