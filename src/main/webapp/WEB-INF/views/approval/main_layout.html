
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자결재 시스템</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap 5 Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* 전체 화면을 채우도록 스타일 추가 */
        body, html {
            height: 100%;
            overflow: hidden; /* 스크롤바가 중복으로 생기는 것을 방지 */
        }
        .main-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .main-row {
            flex-grow: 1;
            overflow-y: auto; /* 컨텐츠가 많아지면 스크롤바 생성 */
        }
        .sidebar {
            height: 100%;
            overflow-y: auto;
            border-right: 1px solid #dee2e6;
        }
        .content-area {
            height: 100%;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 헤더 -->
    <header class="p-3 mb-3 border-bottom bg-light">
        <div class="container-fluid">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="/" class="d-flex align-items-center mb-2 mb-lg-0 text-dark text-decoration-none">
                    <h4>그룹웨어</h4>
                </a>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <div class="container-fluid main-row">
        <div class="row h-100">
            <!-- 좌측 사이드바: 문서 양식 목록 -->
            <nav class="col-md-4 col-lg-3 d-md-block bg-light sidebar p-3">
                <h5>문서 양식</h5>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="양식 검색...">
                    <button class="btn btn-outline-secondary" type="button"><i class="bi bi-search"></i></button>
                </div>

                <div class="list-group" id="form-template-list">
                    <a href="#" class="list-group-item list-group-item-action" data-form-id="leave_request" data-form-title="휴가 신청서">
                        휴가 신청서
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" data-form-id="expense_report" data-form-title="지출 결의서">
                        지출 결의서
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" data-form-id="work_report" data-form-title="업무 보고서">
                        업무 보고서
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" data-form-id="purchase_request" data-form-title="구매 요청서">
                        구매 요청서
                    </a>
                </div>
            </nav>

            <!-- 우측 컨텐츠: 문서 작성 영역 -->
            <main class="col-md-8 ms-sm-auto col-lg-9 px-md-4 content-area">
                <div id="form-display-area" class="pt-3">
                    <!-- 초기 안내 메시지 -->
                    <div id="form-placeholder" class="text-center text-muted mt-5">
                        <h3><i class="bi bi-file-earmark-text"></i></h3>
                        <p>좌측에서 작성할 문서 양식을 선택하세요.</p>
                    </div>

                    <!-- 양식 선택 시 표시될 영역 (초기에는 숨김) -->
                    <div id="form-content" style="display: none;">
                        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                            <h1 class="h2" id="form-title"></h1>
                        </div>
                        
                        <!-- 여기에 SurveyJS 또는 다른 폼 렌더러가 내용을 채웁니다. -->
                        <div id="form-renderer-container" class="bg-white p-4 rounded shadow-sm">
                            <p>선택된 양식의 내용이 여기에 동적으로 표시됩니다.</p>
                            <p>예: 휴가 신청서의 경우 날짜 선택, 사유 입력 필드 등이 나타납니다.</p>
                        </div>

                        <div class="mt-4 text-end">
                            <button class="btn btn-secondary">임시저장</button>
                            <button class="btn btn-primary">결재요청</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 간단한 상호작용을 위한 스크립트 -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const formList = document.getElementById('form-template-list');
        const placeholder = document.getElementById('form-placeholder');
        const formContent = document.getElementById('form-content');
        const formTitle = document.getElementById('form-title');
        const formRendererContainer = document.getElementById('form-renderer-container');

        formList.addEventListener('click', function(e) {
            e.preventDefault();
            const target = e.target;

            if (target && target.classList.contains('list-group-item')) {
                // 모든 아이템에서 'active' 클래스 제거
                formList.querySelectorAll('.list-group-item').forEach(item => {
                    item.classList.remove('active');
                });

                // 클릭된 아이템에 'active' 클래스 추가
                target.classList.add('active');

                const formId = target.getAttribute('data-form-id');
                const title = target.getAttribute('data-form-title');

                // 플레이스홀더 숨기고, 컨텐츠 영역 표시
                placeholder.style.display = 'none';
                formContent.style.display = 'block';

                // 제목 업데이트
                formTitle.textContent = title;

                // TODO: 여기에 실제 폼 렌더링 로직을 추가합니다.
                // 예: fetch(`/api/forms/${formId}`)
                //     .then(response => response.json())
                //     .then(schema => {
                //         // SurveyJS 렌더러를 사용하여 schema를 formRendererContainer에 렌더링
                //     });
                formRendererContainer.innerHTML = `<p><strong>${title} (${formId})</strong> 양식을 렌더링할 영역입니다.</p>`;
            }
        });
    });
</script>

</body>
</html>
