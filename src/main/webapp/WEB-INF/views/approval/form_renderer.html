
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${formName}">양식</title>
    <link rel="stylesheet" href="https://unpkg.com/formiojs@latest/dist/formio.full.min.css">
    <script src="https://unpkg.com/formiojs@latest/dist/formio.full.min.js"></script>
</head>
<body>
    <h1 th:text="${formName}">양식 제목</h1>
    <div id="form-renderer"></div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        // 1. Thymeleaf 모델에서 JSON 스키마 데이터를 가져옵니다.
        const formSchema = JSON.parse(/*[[${formSchema}]]*/ '{}');

        // 2. 폼 렌더러 라이브러리를 사용해 동적으로 폼을 생성합니다.
        Formio.createForm(document.getElementById('form-renderer'), formSchema).then(function(form) {
            // 폼 제출 시 이벤트 처리
            form.on('submit', function(submission) {
                console.log("제출된 데이터:");
                console.log(submission.data);

                // 실제 애플리케이션에서는 이 submission.data를 서버로 전송하여
                // 결재 문서 테이블에 저장해야 합니다.
                // 예: fetch('/api/approval-documents', { method: 'POST', body: JSON.stringify(submission.data), ... });
                alert('결재 문서 데이터가 콘솔에 출력되었습니다.');
            });
        });
        /*]]>*/
    </script>
</body>
</html>
