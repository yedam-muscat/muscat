<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
<meta charset="UTF-8">
<title>게시글 등록</title>

<!-- jQuery / UI / CKEditor / SweetAlert2 -->
<link rel="stylesheet"
	href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
<script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- CKEditor 경고창 제거용 CSS -->
<style>
.cke_top .cke_notification, .cke_notification_warning,
	.cke_notification_message {
	display: none !important;
}
</style>
</head>
<body>
	<main layout:fragment="content">
		<h2>📝 게시글 등록</h2>

		<form id="articleForm" action="articleInsert.do"
			enctype="multipart/form-data" method="post"
			style="max-width: 700px; margin-left: 40px;">
			<input type="hidden" name="bbsId" id="bbsId"
				th:value="${boardMasterVO.bbsId}">

			<div class="mb-3">
				<label for="nttSj">제목 *</label> <input type="text"
					class="form-control" id="nttSj" name="nttSj" required>
			</div>

			<div class="mb-3 form-check">
				<input type="checkbox" class="form-check-input" id="sjBoldAt"
					name="sjBoldAt" value="Y"> <label class="form-check-label"
					for="sjBoldAt">제목 굵게</label>
			</div>

			<div class="mb-3">
				<label for="nttCn">내용 *</label>
				<textarea class="form-control" id="nttCn" name="nttCn" rows="10"
					required></textarea>
			</div>

			<div class="mb-3 form-check">
				<input type="checkbox" class="form-check-input" id="noticeAt"
					name="noticeAt" value="Y"> <label class="form-check-label"
					for="noticeAt">공지글</label>
			</div>

			<div class="mb-3 form-check">
				<input type="checkbox" class="form-check-input" id="secretAt"
					name="secretAt" value="Y"> <label class="form-check-label"
					for="secretAt">비밀글</label>
			</div>

			<div class="mb-3 form-check">
				<input type="checkbox" class="form-check-input" id="anonymousAt"
					name="anonymousAt" value="Y"> <label
					class="form-check-label" for="anonymousAt">익명글</label>
			</div>

			<div class="mb-3">
				<label for="ntceBgnde">게시기간</label>
				<div class="d-flex">
					<input type="text" class="form-control me-2" id="ntceBgnde"
						name="ntceBgnde" readonly> <span class="mt-2">~</span> <input
						type="text" class="form-control ms-2" id="ntceEndde"
						name="ntceEndde" readonly>
				</div>
			</div>

			<div class="mb-3">
				<label for="file">첨부파일</label> <input type="file"
					class="form-control" name="file" id="file" multiple>
			</div>

			<button type="submit" class="btn btn-primary">등록</button>
			<a href="#" id="cancelBtn" class="btn btn-secondary">목록</a>
		</form>


		<script>
  $(function () {
    // ✅ 달력 초기화
    $("#ntceBgnde, #ntceEndde").datepicker({ dateFormat: 'yy-mm-dd' });

    const bbsId = new URLSearchParams(location.search).get("bbsId");
    $("#bbsId").val(bbsId);
    
    // CKEditor 설정
    CKEDITOR.replace("nttCn");

    // 목록 버튼
    $("#cancelBtn").on("click", function (e) {
      e.preventDefault();
      location.href = `/muscat/board/articleList.do?bbsId=${bbsId}`;
    });

    // 등록 처리
    $("#articleForm").on("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(this);

      if (CKEDITOR.instances.nttCn) {
        formData.set("nttCn", CKEDITOR.instances.nttCn.getData());
      } else {
        Swal.fire("에디터 오류", "CKEditor가 정상 로딩되지 않았습니다.", "error");
        return;
      }

      formData.set("bbsId", bbsId);

      try {
        const res = await fetch("/muscat/board/articleInsert.do", {
          method: "POST",
          body: formData
        });

        const result = await res.json();

        if (result.resultCode === "SUCCESS") {
          Swal.fire("등록 완료", result.resultMessage, "success").then(() => {
            location.href = `/muscat/board/articleList.do?bbsId=${bbsId}`;
          });
        } else {
          Swal.fire("등록 실패", result.resultMessage || "오류 발생", "error");
        }
      } catch (err) {
        console.error(err);
        Swal.fire("서버 오류", "게시글 등록 중 문제가 발생했습니다.", "error");
      }
    });
  });
</script>
	</main>
</body>
</html>
