<!-- /WEB-INF/views/board/articleRegist.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시글 등록</title>

  <!-- jQuery / jQuery-UI / CKEditor / SweetAlert2 -->
  <link rel="stylesheet"
        href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
  <script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- CKEditor “업데이트 알림” 숨김 -->
  <style>.cke_top .cke_notification,
         .cke_notification_warning,
         .cke_notification_message{display:none!important}</style>
</head>

<body>
<main layout:fragment="content" class="container mt-4">

  <h2>📝 게시글 등록</h2>

  <!-- boardMasterVO.* 는 컨트롤러에서 주입 -->
  <form id="articleForm" enctype="multipart/form-data" style="max-width:700px;">
    <input type="hidden" id="bbsId" name="bbsId"
           th:value="${boardMasterVO.bbsId}">

    <!-- ─── 제목 + ‘굵게’ 체크 ─── -->
    <div class="mb-3">
      <label for="nttSj" class="form-label">제목 <span class="text-danger">*</span></label>
      <input type="text" id="nttSj" name="nttSj" class="form-control" required>

      <!-- ⬇︎ 제목 아래 바로 배치 -->
      <div class="form-check mt-2">
        <input class="form-check-input" type="checkbox" id="sjBoldAt"
               name="sjBoldAt" value="Y">
        <label class="form-check-label" for="sjBoldAt">제목 굵게</label>
      </div>
    </div>

    <!-- ─── 내용 ─── -->
    <div class="mb-3">
      <label for="nttCn" class="form-label">내용 <span class="text-danger">*</span></label>
      <textarea id="nttCn" name="nttCn" class="form-control" rows="10" required></textarea>
    </div>

    <!-- ─── 체크박스 3종 (공지·비밀·익명) ─── -->
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="noticeAt"
             name="noticeAt" value="Y">
      <label class="form-check-label" for="noticeAt">공지글</label>
    </div>

    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="secretAt"
             name="secretAt" value="Y">
      <label class="form-check-label" for="secretAt">비밀글</label>
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="anonymousAt"
             name="anonymousAt" value="Y">
      <label class="form-check-label" for="anonymousAt">익명글</label>
    </div>

    <!-- ─── 게시기간 ─── -->
    <div class="mb-3">
      <label class="form-label">게시기간</label>
      <div class="d-flex">
        <input type="text" id="ntceBgnde" name="ntceBgnde"
               class="form-control me-2" placeholder="시작일" readonly>
        <span class="mt-2">~</span>
        <input type="text" id="ntceEndde" name="ntceEndde"
               class="form-control ms-2" placeholder="종료일" readonly>
      </div>
    </div>

    <!-- ─── 첨부파일 (게시판에서 허용 시) ─── -->
    <div class="mb-3" id="fileWrap">
      <label for="files" class="form-label">첨부파일</label>
      <input type="file" id="files" name="file" class="form-control" multiple>
    </div>

    <button type="submit" class="btn btn-primary">등록</button>
    <a href="#" id="cancelBtn" class="btn btn-secondary">목록</a>
  </form>

  <!-- ========== Script ========== -->
  <script>
  $(function(){

    /* 달력 */
    $("#ntceBgnde,#ntceEndde").datepicker({dateFormat:"yy-mm-dd"});

    /* CKEditor */
    CKEDITOR.replace("nttCn",{filebrowserImageUploadUrl:"/muscat/ckUploadImage"});

    const bbsId=$("#bbsId").val();
    const atchOk=/*[[${boardMasterVO.fileAtchPosblAt}]]*/"Y";
    if(atchOk!=="Y") $("#fileWrap").hide();

    /* 목록 버튼 */
    $("#cancelBtn").click(e=>{
      e.preventDefault();
      location.href=`/muscat/board/articleList.do?bbsId=${bbsId}`;
    });

    /* 체크박스 규칙 */
    $("#secretAt").change(function(){
      if(this.checked){
        $("#noticeAt,#anonymousAt").prop({checked:false,disabled:true});
      }else{
        $("#noticeAt,#anonymousAt").prop("disabled",false);
      }
    });
    $("#anonymousAt").change(function(){
      if(this.checked){
        $("#noticeAt").prop({checked:false,disabled:true});
      }else if(!$("#secretAt").is(":checked")){
        $("#noticeAt").prop("disabled",false);
      }
    });

    /* 등록 */
    $("#articleForm").submit(async function(e){
      e.preventDefault();
      CKEDITOR.instances.nttCn.updateElement();

      const fd=new FormData(this);

      // 게시기간 순서 체크
      const bg=fd.get("ntceBgnde")?.replaceAll("-","");
      const ed=fd.get("ntceEndde")?.replaceAll("-","");
      if(bg&&ed&&bg>ed){
        return Swal.fire("경고","게시기간 시작일이 종료일보다 늦습니다.","warning");
      }

      // 비밀글 규칙
      if(fd.get("secretAt")==="Y"&&(fd.get("noticeAt")==="Y"||fd.get("anonymousAt")==="Y")){
        return Swal.fire("경고","비밀글은 익명/공지로 등록할 수 없습니다.","warning");
      }
      if(fd.get("anonymousAt")==="Y"&&fd.get("noticeAt")==="Y"){
        return Swal.fire("경고","익명글은 공지로 등록할 수 없습니다.","warning");
      }

      try{
        const res=await fetch("/muscat/board/articleInsert.do",{method:"POST",body:fd});
        const json=await res.json();
        if(json.resultCode==="SUCCESS"){
          await Swal.fire("등록 완료",json.resultMessage,"success");
          location.href=`/muscat/board/articleList.do?bbsId=${bbsId}`;
        }else{
          Swal.fire("실패",json.resultMessage||"등록 실패","error");
        }
      }catch(err){
        console.error(err);
        Swal.fire("서버 오류","게시글 등록 중 문제가 발생했습니다.","error");
      }
    });
  });
  </script>
</main>
</body>
</html>
