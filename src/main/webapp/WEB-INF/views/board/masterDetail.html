<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
  <meta charset="UTF-8">
  <title>게시판 목록</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.min.css">
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>
</head>

<main layout:fragment="content">
  <h2>게시판 상세조회</h2>

  <!-- 상세 테이블 -->
  <table class="table table-bordered">
    <tbody>
      <tr>
        <th>게시판명</th>
        <td id="bbsNm"></td>
        <th>게시판 유형</th>
        <td id="bbsTyCodeNm"></td>
      </tr>
      <tr>
        <th>등록자</th>
        <td id="frstRegisterNm"></td>
        <th>등록일</th>
        <td id="frstRegisterPnttm"></td>
      </tr>
      <tr>
        <th>사용 여부</th>
        <td id="useAt"></td>
        <th>답장 가능</th>
        <td id="replyPosblAt"></td>
      </tr>
      <tr>
        <th>파일첨부 가능</th>
        <td id="fileAtchPosblAt"></td>
        <th>첨부가능파일수</th>
        <td id="atchPosblFileNumber"></td>
      </tr>
      <tr>
        <th>게시판 소개</th>
        <td colspan="3" id="bbsIntrcn"></td>
      </tr>
      <tr>
        <th>추가 선택사항</th>
        <td colspan="3" id="option"></td>
      </tr>
    </tbody>
  </table>

  <!-- 버튼 -->
  <div class="mt-3">
    <a class="btn btn-primary" id="editBtn">수정</a>
    <button class="btn btn-danger" id="deleteBtn">삭제</button>
    <a class="btn btn-secondary" href="/muscat/board/masterList.do">목록</a>
  </div>

  <!-- 자바스크립트 -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const bbsId = urlParams.get("bbsId");

    if (!bbsId) {
      Swal.fire("오류", "게시판 ID가 없습니다.", "error");
    }

    // 상세조회 Ajax
    fetch(`/muscat/api/board/masterDetail?bbsId=${bbsId}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("bbsNm").textContent = data.bbsNm;
        document.getElementById("bbsTyCodeNm").textContent = data.bbsTyCodeNm;
        document.getElementById("frstRegisterNm").textContent = data.frstRegisterNm;
        document.getElementById("frstRegisterPnttm").textContent = data.frstRegisterPnttm;
        document.getElementById("useAt").textContent = data.useAt;
        document.getElementById("replyPosblAt").textContent = data.replyPosblAt;
        document.getElementById("fileAtchPosblAt").textContent = data.fileAtchPosblAt;
        document.getElementById("atchPosblFileNumber").textContent = data.atchPosblFileNumber;
        document.getElementById("bbsIntrcn").innerHTML = data.bbsIntrcn?.replace(/\n/g, "<br>");
        
        document.getElementById("option").textContent =
          data.option === "comment" ? "댓글 기능"
          : data.option === "stsfdg" ? "만족도 조사"
          : "미선택";
        
        document.getElementById("editBtn").href = `/muscat/board/masterEdit.do?bbsId=${bbsId}`;
      })
      .catch(err => {
        Swal.fire("오류", "상세정보를 불러오지 못했습니다.", "error");
      });

    // 삭제 요청
    document.getElementById("deleteBtn").addEventListener("click", function () {
      Swal.fire({
        title: "삭제하시겠습니까?",
        text: "삭제 후 복구할 수 없습니다.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "삭제",
        cancelButtonText: "취소"
      }).then((result) => {
        if (result.isConfirmed) {
          fetch('/muscat/board/masterDelete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bbsId })
          })
          .then(res => res.json())
          .then(result => {
            if (result.resultCode === "SUCCESS") {
              Swal.fire("삭제 완료", result.resultMessage, "success").then(() => {
                window.location.href = "/muscat/board/masterList.do";
              });
            } else {
              Swal.fire("실패", result.resultMessage || "삭제 실패", "error");
            }
          })
          .catch(() => Swal.fire("오류", "삭제 중 오류가 발생했습니다.", "error"));
        }
      });
    });
  </script>
</main>
</html>
