<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시판 상세조회</title>

  <!-- DataTables CSS · SweetAlert2 -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>
</head>

<main layout:fragment="content">
  <h2>🔎 게시판 상세조회</h2>

  <table class="table table-bordered">
    <tbody>
      <tr>
        <th>게시판명</th>
        <td id="bbsNm"></td>
        <th>게시판 유형</th>
        <td id="bbsTyCodeNm"></td>
      </tr>
      <tr>
        <th>등록자</th>
        <td id="frstRegisterNm"></td>
        <th>등록일</th>
        <td id="frstRegisterPnttm"></td>
      </tr>
      <tr>
        <th>사용 여부</th>
        <td id="useAt"></td>
        <th>답장 가능</th>
        <td id="replyPosblAt"></td>
      </tr>
      <tr>
        <th>파일첨부 가능</th>
        <td id="fileAtchPosblAt"></td>
        <th>첨부가능파일수</th>
        <td id="atchPosblFileNumber"></td>
      </tr>

      <!-- 카테고리 / 구분 -->
      <tr>
        <th>게시판 카테고리</th>
        <td id="categoryMain"></td>
        <th>게시판 구분</th>
        <td id="categoryScope"></td>
      </tr>

      <!-- 부서게시판일 때만 표시 -->
      <tr id="deptRow" style="display:none;">
        <th>부서</th>
        <td id="deptFullNm" colspan="3"></td>
      </tr>

      <tr>
        <th>게시판 소개</th>
        <td colspan="3" id="bbsIntrcn"></td>
      </tr>

      <!-- ★ 추가 선택사항(댓글 기능만 사용) -->
      <tr>
        <th>추가 선택사항</th>
        <td colspan="3" id="optionTxt"></td>
      </tr>

      <tr>
        <th>게시판 주소</th>
        <td colspan="3">
          <a id="bbsUrl"
             class="text-primary text-decoration-underline"
             href="#"></a>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="mt-3">
    <a class="btn btn-primary" id="editBtn">수정</a>
    <button class="btn btn-danger" id="deleteBtn">삭제</button>
    <a class="btn btn-secondary" href="/muscat/board/masterList.do">목록</a>
  </div>

  <script>
    /* ===== 파라미터 체크 ===== */
    const urlParams = new URLSearchParams(location.search);
    const bbsId = urlParams.get("bbsId");
    if (!bbsId) {
      Swal.fire("오류", "게시판 ID가 없습니다.", "error");
      throw new Error("bbsId missing");
    }

    /* ===== 상세 조회 ===== */
    fetch(`/muscat/board/masterDetail?bbsId=${encodeURIComponent(bbsId)}`)
      .then(res => res.json())
      .then(data => {
        /* ─ 기본 정보 ─ */
        document.getElementById("bbsNm").textContent             = data.bbsNm            || "-";
        document.getElementById("bbsTyCodeNm").textContent       = data.bbsTyCodeNm      || "-";
        document.getElementById("frstRegisterNm").textContent    = data.frstRegisterNm   || "-";
        document.getElementById("frstRegisterPnttm").textContent = data.frstRegisterPnttm|| "-";
        document.getElementById("useAt").textContent             = data.useAt === "Y" ? "예" : "아니오";
        document.getElementById("replyPosblAt").textContent      = data.replyPosblAt === "Y" ? "예" : "아니오";
        document.getElementById("fileAtchPosblAt").textContent   = data.fileAtchPosblAt === "Y" ? "예" : "아니오";
        document.getElementById("atchPosblFileNumber").textContent = data.atchPosblFileNumber || "-";

        /* ─ 카테고리/구분 ─ */
        document.getElementById("categoryMain").textContent  = data.categoryMainNm  || "-";
        document.getElementById("categoryScope").textContent = data.categoryScopeNm || "-";

        /* ─ 부서 표시 ─ */
        if (data.categoryScope === "BT101") {
          document.getElementById("deptRow").style.display = "";
          document.getElementById("deptFullNm").textContent =
            data.deptFullNm || data.deptNm || "-";
        }

        /* ─ 소개 ─ */
        document.getElementById("bbsIntrcn").innerHTML =
          (data.bbsIntrcn || "").replace(/\n/g,"<br>");

        /* ★ 추가 선택사항 (댓글 기능만) */
        const optTxt = (data.option === "comment") ? "댓글 기능" : "미사용";
        document.getElementById("optionTxt").textContent = optTxt;

        /* ─ 게시판 주소 ─ */
        const articleUrl = `/muscat/board/articleList.do?bbsId=${bbsId}`;
        const link = document.getElementById("bbsUrl");
        link.textContent = articleUrl;
        link.href = articleUrl;

        /* 수정 버튼 링크 */
        document.getElementById("editBtn").href =
          `/muscat/board/masterUpdt.do?bbsId=${bbsId}`;
      })
      .catch(() => Swal.fire("오류", "상세정보를 불러오지 못했습니다.", "error"));

    /* ===== 삭제 ===== */
    document.getElementById("deleteBtn").addEventListener("click", () => {
      Swal.fire({
        title: "삭제하시겠습니까?",
        text:  "삭제 후 복구할 수 없습니다.",
        icon:  "warning",
        showCancelButton: true,
        confirmButtonText: "삭제",
        cancelButtonText:  "취소"
      }).then(result => {
        if (!result.isConfirmed) return;
        fetch("/muscat/board/masterDelete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ bbsId })
        })
        .then(res => res.json())
        .then(ret => {
          if (ret.resultCode === "SUCCESS") {
            Swal.fire("삭제 완료", ret.resultMessage, "success")
                .then(() => location.href = "/muscat/board/masterList.do");
          } else {
            Swal.fire("실패", ret.resultMessage || "삭제 실패", "error");
          }
        })
        .catch(() => Swal.fire("오류", "삭제 중 오류가 발생했습니다.", "error"));
      });
    });
  </script>
</main>
</html>
