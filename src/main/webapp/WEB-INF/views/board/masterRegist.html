<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시판 등록</title>

  <!-- DataTables · SweetAlert2 ------------------------------------------------>
  <link rel="stylesheet"
        href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.min.css">
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<main layout:fragment="content">
  <h2>📝 게시판 등록</h2>

  <form id="bbsForm" style="max-width:700px;margin-left:40px;">
    <!-- ───────────── 게시판 기본정보 ───────────── -->
    <div class="mb-3">
      <label for="bbsNm" class="form-label">게시판명 <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="bbsNm" name="bbsNm" required>
    </div>

    <div class="mb-3">
      <label for="bbsIntrcn" class="form-label">게시판 소개 <span class="text-danger">*</span></label>
      <textarea class="form-control" id="bbsIntrcn" name="bbsIntrcn" rows="3" required></textarea>
    </div>

    <!-- (예시) 게시판 유형은 고정값 BBST01 -->
    <input type="hidden" id="bbsTyCode" name="bbsTyCode" value="BBST01">

    <!-- ───────────── 카테고리 / 구분 ───────────── -->
    <div class="mb-3">
      <label for="categoryMain" class="form-label">게시판 카테고리</label>
      <select id="categoryMain" name="categoryMain" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="categoryScope" class="form-label">게시판 구분</label>
      <select id="categoryScope" name="categoryScope" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <!-- ✚ 부서 게시판(BT101) 일 때만 노출 -->
    <div id="deptWrap" class="mb-3" style="display:none">
      <label for="deptCode" class="form-label fw-bold">부서선택 <span class="text-danger">*</span></label>
      <select id="deptCode" name="deptCode" class="form-select">
        <option value="" hidden>부서를 선택하세요</option>
        <!-- deptList 는 Controller 에서 내려주는 모델 -->
        <th:block th:each="d : ${deptList}">
          <option th:value="${d.code}" th:text="${d.codeNm}"></option>
        </th:block>
      </select>
    </div>

    <!-- ───────────── 기타 옵션 ───────────── -->
    <div class="mb-3">
      <label class="form-label">답장 가능 여부</label>
      <select id="replyPosblAt" name="replyPosblAt" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option>
        <option value="N">아니오</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">파일 첨부 가능 여부</label>
      <select id="fileAtchPosblAt" name="fileAtchPosblAt" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option>
        <option value="N">아니오</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">첨부 가능 파일 수</label>
      <select id="atchPosblFileNumber" name="atchPosblFileNumber" class="form-select" required>
        <option value="0">없음</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">사용 여부</label>
      <select id="useAt" name="useAt" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option>
        <option value="N">아니오</option>
      </select>
    </div>

    <!-- ───────────── 버튼 ───────────── -->
    <div class="mt-4">
      <button type="submit" class="btn btn-primary">등록</button>
      <a href="/muscat/board/masterList.do" class="btn btn-secondary">목록</a>
    </div>
  </form>

  <!-- ───────────── SCRIPT ───────────── -->
  <script>
  /* ▶ 부서 게시판 코드값 (COM105 테이블) */
  const SCOPE_DEPT = 'BT101';   // 실제 코드값에 맞춰 변경

  /* 공통상세코드 비동기 로딩 ---------------------------------------------- */
  async function loadCommonCodes(codeId, target) {
    try {
      const res  = await fetch(`/muscat/board/commonCodes?groupCode=${codeId}`);
      const list = await res.json();
      const sel  = document.getElementById(target);

      list.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.code;
        opt.textContent = c.codeNm;
        sel.appendChild(opt);
      });
    } catch (err) {
      console.error(`[${codeId}] 코드 로딩 실패`, err);
    }
  }

  /* 부서선택 표시/숨김 ------------------------------------------------------- */
  function toggleDept(scopeVal) {
    const wrap = document.getElementById('deptWrap');
    const dept = document.getElementById('deptCode');

    if (scopeVal === SCOPE_DEPT) {
      wrap.style.display = '';
      dept.setAttribute('required', 'required');
    } else {
      wrap.style.display = 'none';
      dept.removeAttribute('required');
      dept.value = '';
    }
  }

  /* 초기화 ----------------------------------------------------------------- */
  document.addEventListener('DOMContentLoaded', () => {
    // 카테고리 · 구분 코드 렌더링
    loadCommonCodes('COM104', 'categoryMain');  // 게시판 카테고리
    loadCommonCodes('COM105', 'categoryScope'); // 게시판 구분

    // 구분 변경 시 부서 토글
    const scopeSel = document.getElementById('categoryScope');
    scopeSel.addEventListener('change', e => toggleDept(e.target.value));

    // (수정화면 대비) 최초 값 검사
    toggleDept(scopeSel.value);
  });

  /* 저장 ------------------------------------------------------------------- */
  document.getElementById('bbsForm').addEventListener('submit', async e => {
    e.preventDefault();

    const obj = Object.fromEntries(new FormData(e.target).entries());

    try {
      const res  = await fetch('/muscat/board/masterInsert', {
        method : 'POST',
        headers: { 'Content-Type':'application/json' },
        body   : JSON.stringify(obj)
      });
      const json = await res.json();

      if (res.ok && json.resultCode === 'SUCCESS') {
        Swal.fire('등록 완료', '게시판이 등록되었습니다.', 'success')
            .then(()=>location.href='/muscat/board/masterList.do');
      } else {
        Swal.fire('실패', json.resultMessage || '등록 실패', 'error');
      }
    } catch(err) {
      console.error(err);
      Swal.fire('오류', '서버 요청 실패', 'error');
    }
  });
  </script>
</main>
</html>
