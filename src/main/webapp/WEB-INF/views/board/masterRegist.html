<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
  <meta charset="UTF-8">
  <title>게시판 등록</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>
</head>

<main layout:fragment="content">
  <h2>📝 게시판 등록</h2>

  <form id="bbsForm">
    <div class="mb-3">
      <label for="bbsNm" class="form-label">게시판명 <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="bbsNm" name="bbsNm" required />
    </div>

    <div class="mb-3">
      <label for="bbsIntrcn" class="form-label">게시판 소개 <span class="text-danger">*</span></label>
      <textarea class="form-control" id="bbsIntrcn" name="bbsIntrcn" rows="3" required></textarea>
    </div>

    <input type="hidden" id="bbsTyCode" name="bbsTyCode" value="BBST01" />

    <!-- ✅ 게시판 카테고리 -->
    <div class="mb-3">
      <label for="categoryMain" class="form-label">게시판 카테고리</label>
      <select id="categoryMain" name="categoryMain" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <!-- ✅ 게시판 구분 -->
    <div class="mb-3">
      <label for="categoryScope" class="form-label">게시판 구분</label>
      <select id="categoryScope" name="categoryScope" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="replyPosblAt" class="form-label">답장 가능 여부</label>
      <select class="form-select" id="replyPosblAt" name="replyPosblAt" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option>
        <option value="N">아니오</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="fileAtchPosblAt" class="form-label">파일 첨부 가능 여부</label>
      <select class="form-select" id="fileAtchPosblAt" name="fileAtchPosblAt" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option>
        <option value="N">아니오</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="atchPosblFileNumber" class="form-label">첨부 가능 파일 수</label>
      <select class="form-select" id="atchPosblFileNumber" name="atchPosblFileNumber" required>
        <option value="0">없음</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="useAt" class="form-label">사용 여부</label>
      <select class="form-select" id="useAt" name="useAt" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option>
        <option value="N">아니오</option>
      </select>
    </div>

    <div>
      <button type="submit" class="btn btn-primary">등록</button>
      <a href="/muscat/board/masterList.do" class="btn btn-secondary">목록</a>
    </div>
  </form>

  <script>
    // 공통코드 불러오기 함수
    async function loadCommonCodes(groupCode, targetId) {
      try {
        const res = await fetch(`/muscat/board/commonCodes?groupCode=${groupCode}`);
        const data = await res.json();
        const select = document.getElementById(targetId);
        data.forEach(code => {
          const option = document.createElement('option');
          option.value = code.code;
          option.textContent = code.codeNm;
          select.appendChild(option);
        });
      } catch (err) {
        console.error(`${targetId} 코드 로딩 실패`, err);
      }
    }

    // DOM 로딩 시 공통코드 초기화
    document.addEventListener("DOMContentLoaded", () => {
      loadCommonCodes('COM104', 'categoryMain');   // 게시판 카테고리
      loadCommonCodes('COM105', 'categoryScope');  // 게시판 구분
    });

    // 게시판 유형 변경 시 특정 옵션 제어
    document.getElementById("bbsTyCode").addEventListener("change", function () {
      const type = this.value;
      const reply = document.getElementById("replyPosblAt");
      const fileAtch = document.getElementById("fileAtchPosblAt");
      const fileNum = document.getElementById("atchPosblFileNumber");

      if (type === "BBST03") {
        reply.value = "N";
        fileAtch.value = "N";
        fileNum.value = "0";
        reply.disabled = true;
        fileAtch.disabled = true;
        fileNum.disabled = true;
      } else {
        reply.disabled = false;
        fileAtch.disabled = false;
        fileNum.disabled = false;
      }
    });

    // 폼 제출 이벤트
    document.getElementById("bbsForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      const obj = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('/muscat/board/masterInsert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(obj)
        });

        const result = await res.json();

        if (res.ok && result.resultCode === 'SUCCESS') {
          Swal.fire("성공", "게시판이 등록되었습니다.", "success").then(() => {
            location.href = "/muscat/board/masterList.do";
          });
        } else {
          Swal.fire("실패", result.resultMessage || "등록 실패", "error");
        }
      } catch (err) {
        Swal.fire("오류", "서버 요청 실패", "error");
      }
    });
  </script>
</main>
</html>
