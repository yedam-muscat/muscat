<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시판 등록</title>

  <!-- DataTables · SweetAlert2 -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.min.css">
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<main layout:fragment="content">
  <h2>📝 게시판 등록</h2>

  <form id="bbsForm" style="max-width:700px;margin-left:40px;">
    <!-- ───────────── 기본정보 ───────────── -->
    <div class="mb-3">
      <label class="form-label">게시판명 <span class="text-danger">*</span></label>
      <input type="text" class="form-control" name="bbsNm" required>
    </div>

    <div class="mb-3">
      <label class="form-label">게시판 소개 <span class="text-danger">*</span></label>
      <textarea class="form-control" name="bbsIntrcn" rows="3" required></textarea>
    </div>

    <input type="hidden" name="bbsTyCode" value="BBST01">
    <input type="hidden" id="deptId"   name="deptId"><!-- 최종 부서코드 -->

    <!-- ───────────── 카테고리 / 구분 ───────────── -->
    <div class="mb-3">
      <label class="form-label">게시판 카테고리</label>
      <select id="categoryMain" name="categoryMain" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">게시판 구분</label>
      <select id="categoryScope" name="categoryScope" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <!-- ───────────── 부서 선택 (부서게시판일 때만) ───────────── -->
    <div id="deptWrap" class="mb-3" style="display:none">
      <label class="form-label fw-bold">부서선택 <span class="text-danger">*</span></label>

      <div class="d-flex gap-2">
        <!-- 상위 부서 -->
        <select id="parentDept" class="form-select">
          <option value="">-- 상위 부서 --</option>
          <option th:each="p : ${parent_dept_result}"
                  th:value="${p.id}" th:text="${p.text}"></option>
        </select>

        <!-- 하위 부서 -->
        <select id="childDept" class="form-select">
          <option value="">-- 하위 부서 --</option>
        </select>
      </div>
    </div>

    <!-- ───────────── 기타 옵션 (생략 없이 유지) ───────────── -->
    <div class="mb-3">
      <label class="form-label">답장 가능 여부</label>
      <select name="replyPosblAt" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option><option value="N">아니오</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">파일 첨부 가능 여부</label>
      <select id="fileAtchPosblAt" name="fileAtchPosblAt" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option><option value="N">아니오</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">첨부 가능 파일 수</label>
      <select name="atchPosblFileNumber" class="form-select" required>
        <option value="0">없음</option><option value="1">1</option>
        <option value="2">2</option><option value="3">3</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">사용 여부</label>
      <select name="useAt" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option><option value="N">아니오</option>
      </select>
    </div>

    <!-- ───────────── 버튼 ───────────── -->
    <div class="mt-4">
      <button type="submit" class="btn btn-primary">등록</button>
      <a href="/muscat/board/masterList.do" class="btn btn-secondary">목록</a>
    </div>
  </form>

  <!-- ───────────── SCRIPT ───────────── -->
  <script th:inline="javascript">
  /* ======= 상수 & 초기 데이터 ============================================ */
  const SCOPE_DEPT       = 'BT101';                         // “부서게시판” 코드
  const CHILD_DEPT_LIST  = /*[[${child_dept_result}]]*/ [];  // 하위부서 전체

  /* ======= 공통상세코드 비동기 로딩 ====================================== */
  async function loadCodes(codeId, targetId) {
    try {
      const res  = await fetch(`/muscat/board/commonCodes?groupCode=${codeId}`);
      const list = await res.json();
      const sel  = document.getElementById(targetId);
      list.forEach(c => sel.add(new Option(c.codeNm, c.code)));
    } catch (e) {
      console.error(`${codeId} 로딩 실패`, e);
    }
  }

  /* ======= 상위 → 하위 부서 동적 로딩 ==================================== */
  function bindChild(parentId) {
    const childSel = document.getElementById('childDept');
    childSel.innerHTML = '<option value="">-- 하위 부서 --</option>';

    CHILD_DEPT_LIST
      .filter(d => d.parent === parentId)
      .forEach(d => childSel.add(new Option(d.text, d.id)));

    /* 하위 옵션이 있으면 필수, 없으면 비필수 */
    childSel.required = CHILD_DEPT_LIST.some(d => d.parent === parentId);
  }

  /* ======= 부서선택 영역 토글 =========================================== */
  function toggleDept(scopeVal) {
    const wrap = document.getElementById('deptWrap');
    const pSel = document.getElementById('parentDept');
    const cSel = document.getElementById('childDept');

    if (scopeVal === SCOPE_DEPT) {            // 부서게시판
      wrap.style.display = '';
      pSel.required = true;
    } else {                                  // 그 외 게시판
      wrap.style.display = 'none';
      pSel.required = false;
      cSel.required = false;
      pSel.value = ''; cSel.value = '';
    }
  }

  /* ======= 초기화 ======================================================== */
  document.addEventListener('DOMContentLoaded', () => {
    loadCodes('COM104', 'categoryMain');   // 카테고리
    loadCodes('COM105', 'categoryScope');  // 구분

    const scopeSel = document.getElementById('categoryScope');
    scopeSel.addEventListener('change', e => toggleDept(e.target.value));

    document.getElementById('parentDept')
            .addEventListener('change', e => bindChild(e.target.value));

    /* 최초 로드 시 기본 구분 값에 따라 토글 */
    toggleDept(scopeSel.value);
  });

  /* ======= 저장 ========================================================== */
  document.getElementById('bbsForm').addEventListener('submit', async e => {
    e.preventDefault();

    /* deptId : 하위부서가 있으면 하위, 없으면 상위 */
    const p = document.getElementById('parentDept').value;
    const c = document.getElementById('childDept').value;
    document.getElementById('deptId').value = c || p;

    const payload = Object.fromEntries(new FormData(e.target).entries());

    try {
      const res  = await fetch('/muscat/board/masterInsert', {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify(payload)
      });
      const json = await res.json();
      if (res.ok && json.resultCode === 'SUCCESS') {
        await Swal.fire('성공', '게시판이 등록되었습니다.', 'success');
        location.href = '/muscat/board/masterList.do';
      } else {
        Swal.fire('실패', json.resultMessage || '등록 실패', 'error');
      }
    } catch (err) {
      console.error(err);
      Swal.fire('오류', '서버 통신 실패', 'error');
    }
  });
  </script>
</main>
</html>
