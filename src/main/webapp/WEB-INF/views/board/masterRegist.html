<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시판 등록</title>

  <!-- DataTables · SweetAlert2 -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.min.css">
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<main layout:fragment="content">
  <h2>📝 게시판 등록</h2>

  <form id="bbsForm" style="max-width:700px; margin-left:40px;">
    <!-- ─────────── 기본정보 ─────────── -->
    <div class="mb-3">
      <label class="form-label">게시판명 <span class="text-danger">*</span></label>
      <input type="text" class="form-control" name="bbsNm" required>
    </div>

    <div class="mb-3">
      <label class="form-label">게시판 소개 <span class="text-danger">*</span></label>
      <textarea class="form-control" name="bbsIntrcn" rows="3" required></textarea>
    </div>

    <input type="hidden" name="bbsTyCode" value="BBST01">
    <input type="hidden" id="deptId"   name="deptId"><!-- 최종 부서코드 -->

    <!-- ─────────── 카테고리 / 구분 ─────────── -->
    <div class="mb-3">
      <label class="form-label">게시판 카테고리 <span class="text-danger">*</span></label>
      <select id="categoryMain" name="categoryMain" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">게시판 구분 <span class="text-danger">*</span></label>
      <select id="categoryScope" name="categoryScope" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <!-- ─────────── 부서 선택 (부서게시판) ─────────── -->
    <div id="deptWrap" class="mb-3" style="display:none">
      <label class="form-label fw-bold">부서 선택 <span class="text-danger">*</span></label>
      <select id="deptSelect" class="form-select">
        <option value="">-- 부서 선택 --</option>
        <option th:each="d : ${dept_result}"
                th:value="${d.id}"
                th:text="${d.text}"></option>
      </select>
    </div>

    <!-- ─────────── ★ 댓글 기능 사용 여부 ─────────── -->
    <div class="mb-3">
      <label class="form-label">댓글 기능 <span class="text-danger">*</span></label>
      <select id="commentOption" name="option" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
        <option value="comment">사용</option>
        <option value="na">미사용</option><!-- ‘na’ 는 기존 로직과 호환 -->
      </select>
    </div>

    <!-- ─────────── 파일/첨부 옵션 ─────────── -->
    <div class="mb-3">
      <label class="form-label">답장 가능 여부 <span class="text-danger">*</span></label>
      <select name="replyPosblAt" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option><option value="N">아니오</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">파일 첨부 가능 여부 <span class="text-danger">*</span></label>
      <select id="fileAtchPosblAt" name="fileAtchPosblAt" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option><option value="N">아니오</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">첨부 가능 파일 수 <span class="text-danger">*</span></label>
      <select id="atchPosblFileNumber" name="atchPosblFileNumber"
              class="form-select" required>
        <option value="0">없음</option><option value="1">1</option>
        <option value="2">2</option><option value="3">3</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">사용 여부 <span class="text-danger">*</span></label>
      <select name="useAt" class="form-select" required>
        <option value="Y" selected>예</option><option value="N">아니오</option>
      </select>
    </div>

    <!-- ─────────── 버튼 ─────────── -->
    <div class="mt-4">
      <button type="submit" class="btn btn-primary">등록</button>
      <a href="/muscat/board/masterList.do" class="btn btn-secondary">목록</a>
    </div>
  </form>

  <!-- ─────────── SCRIPT ─────────── -->
  <script th:inline="javascript">
  const SCOPE_DEPT = 'BT101';       // 부서게시판
  const CHILD_DEPT_LIST = /*[[${child_dept_result}]]*/ [];

  /* 공통코드 로딩 */
  async function loadCodes(codeId, targetId){
    const res  = await fetch(`/muscat/board/commonCodes?groupCode=${codeId}`);
    const list = await res.json();
    const sel  = document.getElementById(targetId);
    list.forEach(c=>sel.add(new Option(c.codeNm,c.code)));
  }

  /* 부서 영역 토글 */
  function toggleDept(scopeVal){
    const wrap=document.getElementById('deptWrap');
    const sel =document.getElementById('deptSelect');
    if(scopeVal===SCOPE_DEPT){ wrap.style.display=''; sel.required=true; }
    else{ wrap.style.display='none'; sel.required=false; sel.value=''; }
  }

  document.addEventListener('DOMContentLoaded',()=>{
    loadCodes('COM104','categoryMain');
    loadCodes('COM105','categoryScope');
    document.getElementById('categoryScope')
            .addEventListener('change',e=>toggleDept(e.target.value));
    toggleDept(document.getElementById('categoryScope').value);
  });

  /* 파일첨부 숫자 활성/비활성 */
  document.getElementById('fileAtchPosblAt').addEventListener('change',e=>{
    document.getElementById('atchPosblFileNumber').disabled=(e.target.value==='N');
  });

  /* 저장 */
  document.getElementById('bbsForm').addEventListener('submit',async e=>{
    e.preventDefault();
    document.getElementById('deptId').value =
        document.getElementById('deptSelect').value;

    const payload=Object.fromEntries(new FormData(e.target).entries());

    /* ‘미사용’ 선택 시 option 값을 빈 문자열로 보내도 되지만
       기존 서비스 로직(빈값→'na')에 맞춰 na 로 전송하도록 처리 */
    if(payload.option==='na') payload.option='na';

    try{
      const res=await fetch('/muscat/board/masterInsert',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      const json=await res.json();
      if(res.ok&&json.resultCode==='SUCCESS'){
        await Swal.fire('성공','게시판이 등록되었습니다.','success');
        location.href='/muscat/board/masterList.do';
      }else{
        Swal.fire('실패',json.resultMessage||'등록 실패','error');
      }
    }catch(err){
      console.error(err);
      Swal.fire('오류','서버 통신 실패','error');
    }
  });
  </script>
</main>
</html>
