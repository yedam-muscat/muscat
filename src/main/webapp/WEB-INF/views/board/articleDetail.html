<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시글 상세조회</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    th { width: 120px; background-color: #f8f8f8; }
    #nttCn { min-height: 300px; white-space: pre-wrap; }
    .reply-btn { font-size: 0.8rem; margin-left: 8px; }
  </style>
</head>

<main layout:fragment="content" class="container mt-4">
  <h2>🔎 게시글 상세조회</h2>

  <!-- 게시글 정보 -->
  <table class="table table-bordered">
    <tbody>
      <tr><th>제목</th><td id="nttSj" colspan="5"></td></tr>
      <tr>
        <th>등록자</th><td id="frstRegisterNm"></td>
        <th>등록일</th><td id="frstRegisterPnttm"></td>
        <th>조회수</th><td id="inqireCo"></td>
      </tr>
      <tr><th>내용</th><td colspan="5"><div id="nttCn"></div></td></tr>
      <tr><th>게시기간</th><td id="ntceBgnde" colspan="5"></td></tr>
      <tr><th>첨부파일</th><td id="atchFileArea" colspan="5"></td></tr>
    </tbody>
  </table>

  <!-- 상단 버튼 -->
  <div class="text-end mb-4">
    <button class="btn btn-primary" onclick="goEdit()">수정</button>
    <button class="btn btn-danger" onclick="goDelete()">삭제</button>
    <button class="btn btn-warning" onclick="goReply()">답글</button>
    <button class="btn btn-secondary" onclick="goBack()">목록</button>
    <button class="btn btn-info">스크랩</button>
  </div>

  <!-- 댓글 영역 -->
  <h4>💬 댓글 <span id="replyCount">0</span></h4>
  <div id="replyList" class="border p-3 mb-3">댓글이 없습니다.</div>

  <!-- 페이징 -->
  <nav><ul id="pagination" class="pagination justify-content-center"></ul></nav>

  <!-- 댓글 작성 -->
  <div class="mb-3">
    <label for="replyContent">댓글내용 *</label>
    <textarea id="replyContent" rows="3" class="form-control"></textarea>
  </div>
  <div class="text-end">
    <button class="btn btn-primary" onclick="submitReply()">댓글등록</button>
  </div>

  <!-- 스크립트 -->
  <script th:inline="javascript">
    const downloadBaseUrl = /*[[@{/cmm/fms/FileDown.do}]]*/ '';
  </script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const bbsId = urlParams.get("bbsId");
    const nttId = urlParams.get("nttId");
    const pageSize = 5;
    let currentPage = 1;
    let totalPages = 1;

    if (!bbsId || !nttId) Swal.fire("오류", "필수 파라미터 누락", "error");

    // 게시글 정보 조회
    fetch(`/muscat/board/articleDetail?bbsId=${bbsId}&nttId=${nttId}`)
      .then(res => res.json())
      .then(res => {
        const data = res.article;
        document.getElementById("nttSj").textContent = data.nttSj;
        document.getElementById("frstRegisterNm").textContent = data.frstRegisterNm;
        document.getElementById("frstRegisterPnttm").textContent = data.frstRegisterPnttm;
        document.getElementById("inqireCo").textContent = data.inqireCo;
        document.getElementById("nttCn").innerHTML = data.nttCn?.replace(/\n/g, "<br>");
        document.getElementById("ntceBgnde").textContent = `${data.ntceBgnde} ~ ${data.ntceEndde}`;

        if (res.fileList && res.fileList.length > 0) {
          renderFileList(res.fileList);
        } else {
          document.getElementById("atchFileArea").textContent = '첨부 파일이 없습니다';
        }
      });

    function renderFileList(fileList) {
      const cell = document.getElementById('atchFileArea');
      cell.innerHTML = '';
      const ul = document.createElement('ul');

      fileList.forEach(f => {
        const li = document.createElement('li');
        const a  = document.createElement('a');
        a.href = '#';
        a.textContent = `${f.orignlFileNm} [${(f.fileMg).toLocaleString()} byte]`;
        a.dataset.atchFileId = f.atchFileId;
        a.dataset.fileSn = f.fileSn;
        a.addEventListener('click', function (e) {
          e.preventDefault();
          fn_egov_downFile(this.dataset.atchFileId, this.dataset.fileSn);
        });
        li.appendChild(a);
        ul.appendChild(li);
      });

      cell.appendChild(ul);
    }

    function fn_egov_downFile(id, sn) {
      const url = `${downloadBaseUrl}?atchFileId=${id}&fileSn=${sn}`;
      window.open(url, '_blank');
    }

    // 댓글 목록 조회
    function loadReplies(page = 1) {
      fetch(`/muscat/board/replyList?bbsId=${bbsId}&nttId=${nttId}&pageIndex=${page}&pageSize=${pageSize}`)
        .then(res => res.json())
        .then(res => {
          const comments = res.comments || [];
          const totalCount = res.totalCount || 0;
          currentPage = page;
          totalPages = Math.ceil(totalCount / pageSize);

          document.getElementById("replyCount").textContent = totalCount;
          const replyListEl = document.getElementById("replyList");

          if (comments.length === 0) {
            replyListEl.innerHTML = "댓글이 없습니다.";
          } else {
            replyListEl.innerHTML = comments.map(reply => `
              <div class="border-bottom mb-2 pb-2">
                <strong>${reply.wrterNm}</strong> <span class="text-muted small">(${reply.frstRegisterPnttm})</span>
                <p>${reply.commentCn}</p>
                <div class="text-end">
                  <button class="btn btn-sm btn-outline-secondary reply-btn" onclick="editReply('${reply.commentNo}', \`${reply.commentCn?.replace(/`/g, '\\`')}\`)">수정</button>
                  <button class="btn btn-sm btn-outline-danger reply-btn" onclick="deleteReply('${reply.commentNo}')">삭제</button>
                </div>
              </div>
            `).join("");
          }

          renderPagination();
        });
    }

    function renderPagination() {
      const paginationEl = document.getElementById("pagination");
      paginationEl.innerHTML = "";
      const maxButtons = 5;
      let start = Math.max(1, currentPage - Math.floor(maxButtons / 2));
      let end = Math.min(totalPages, start + maxButtons - 1);
      if (end - start < maxButtons - 1) {
        start = Math.max(1, end - maxButtons + 1);
      }

      function createPageItem(label, page, isActive = false, isDisabled = false) {
        const li = document.createElement("li");
        li.className = `page-item ${isActive ? "active" : ""} ${isDisabled ? "disabled" : ""}`;
        const a = document.createElement("a");
        a.className = "page-link";
        a.href = "#";
        a.innerHTML = label;
        a.addEventListener("click", e => {
          e.preventDefault();
          if (!isDisabled && page !== currentPage) loadReplies(page);
        });
        li.appendChild(a);
        return li;
      }

      paginationEl.appendChild(createPageItem('«', currentPage - 1, false, currentPage === 1));
      for (let i = start; i <= end; i++) {
        paginationEl.appendChild(createPageItem(i, i, i === currentPage));
      }
      paginationEl.appendChild(createPageItem('»', currentPage + 1, false, currentPage === totalPages));
    }

    function submitReply() {
      const commentCn = document.getElementById("replyContent").value.trim();
      if (!commentCn) return Swal.fire("입력 오류", "댓글 내용을 입력해주세요.", "warning");

      fetch(`/muscat/board/replyInsert`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ bbsId, nttId, commentCn })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          Swal.fire("등록 완료", res.message, "success");
          document.getElementById("replyContent").value = "";
          loadReplies(1);
        } else {
          Swal.fire("등록 실패", res.message, "error");
        }
      });
    }

    function editReply(commentNo, commentCn) {
      Swal.fire({
        title: "댓글 수정",
        input: "textarea",
        inputValue: commentCn,
        showCancelButton: true,
        confirmButtonText: "수정",
        cancelButtonText: "취소"
      }).then(result => {
        if (result.isConfirmed) {
          fetch(`/muscat/board/replyUpdate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ commentNo, commentCn: result.value })
          })
          .then(res => res.json())
          .then(res => {
            if (res.status === "success") {
              Swal.fire("수정 완료", res.message, "success");
              loadReplies(currentPage);
            } else {
              Swal.fire("수정 실패", res.message, "error");
            }
          });
        }
      });
    }

    function deleteReply(commentNo) {
      Swal.fire({
        title: "댓글 삭제",
        text: "정말 삭제하시겠습니까?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "삭제",
        cancelButtonText: "취소"
      }).then(result => {
        if (result.isConfirmed) {
          fetch(`/muscat/board/replyDelete`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ commentNo })
          })
          .then(res => res.json())
          .then(res => {
            if (res.status === "success") {
              Swal.fire("삭제 완료", res.message, "success");
              loadReplies(1);
            } else {
              Swal.fire("삭제 실패", res.message, "error");
            }
          });
        }
      });
    }

    function goEdit() {
      location.href = `/muscat/board/articleUpdt.do?bbsId=${bbsId}&nttId=${nttId}`;
    }
    function goDelete() {
      Swal.fire({
        title: "정말 삭제하시겠습니까?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "삭제",
        cancelButtonText: "취소"
      }).then(result => {
        if (result.isConfirmed) {
          fetch(`/muscat/board/articleDelete`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ bbsId, nttId })
          })
          .then(res => res.json())
          .then(res => {
            if (res.resultCode === "SUCCESS") {
              Swal.fire("삭제 완료", res.resultMessage, "success").then(goBack);
            } else {
              Swal.fire("삭제 실패", res.resultMessage, "error");
            }
          });
        }
      });
    }
    function goReply() {
      location.href = `/muscat/board/articleReply.do?bbsId=${bbsId}&nttId=${nttId}`;
    }
    function goBack() {
      location.href = `/muscat/board/articleList.do?bbsId=${bbsId}`;
    }

    document.addEventListener("DOMContentLoaded", () => loadReplies(1));
  </script>
</main>
</html>
