<!-- /WEB-INF/views/board/articleDetail.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시글 상세조회</title>

  <!-- SweetAlert2 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    th{width:120px;background:#f8f8f8}
    #nttCn{min-height:300px;max-height:500px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
    .reply-btn{font-size:.8rem;margin-left:8px}
  </style>
</head>

<main layout:fragment="content">
  <h2>🔎 게시글 상세조회</h2>

  <!-- ========== 게시글 정보 ========== -->
  <table class="table table-bordered">
    <tbody>
      <tr><th>제목</th><td id="nttSj" colspan="5"></td></tr>
      <tr>
        <th>등록자</th><td id="frstRegisterNm"></td>
        <th>등록일</th><td id="frstRegisterPnttm"></td>
        <th>조회수</th><td id="inqireCo"></td>
      </tr>
      <tr><th>내용</th><td colspan="5"><div id="nttCn"></div></td></tr>
      <tr><th>게시기간</th><td id="ntceBgnde" colspan="5"></td></tr>
      <tr><th>첨부파일</th><td id="atchFileArea" colspan="5"></td></tr>
    </tbody>
  </table>

  <!-- ========== 상단 버튼 ========== -->
  <div class="text-end mb-4">
    <button id="btnEdit"   class="btn btn-primary"   onclick="goEdit()">수정</button>
    <button id="btnDelete" class="btn btn-danger"    onclick="goDelete()">삭제</button>
    <button id="btnReply"  class="btn btn-warning"   onclick="goReply()">답글</button>
    <button class="btn btn-secondary" onclick="goBack()">목록</button>
  </div>

  <!-- 🔐 로그인 ID (없을 수도 있음) -->
  <input type="hidden" id="loginUserId"
         th:value="${#authentication?.principal?.uniqId
                    ?: #authentication?.principal?.id
                    ?: #authentication?.principal?.username
                    ?: ''}" />

  <!-- ========== 댓글 영역 ========== -->
  <h4>💬 댓글 <span id="replyCount">0</span></h4>
  <div id="replyList" class="border p-3 mb-3">댓글이 없습니다.</div>

  <!-- 페이징 -->
  <nav><ul id="pagination" class="pagination justify-content-center"></ul></nav>

  <!-- 댓글 작성 -->
  <div class="mb-3">
    <label for="replyContent">댓글내용 *</label>
    <textarea id="replyContent" rows="3" class="form-control"></textarea>
  </div>
  <div class="text-end">
    <button class="btn btn-primary" onclick="submitReply()">댓글등록</button>
  </div>

  <!-- ========== SCRIPT ========== -->
  <script th:inline="javascript">
    const downloadBaseUrl = /*[[@{/cmm/fms/FileDown.do}]]*/ '';
  </script>
  <script>
    /* ── 상수 & 전역 ───────────────────────── */
    const qs           = new URLSearchParams(location.search);
    const bbsId        = qs.get('bbsId');
    const nttId        = qs.get('nttId');
    let   loginUserId  = document.getElementById('loginUserId').value || '';
    const pageSize     = 5;
    let   currentPage  = 1, totalPages = 1;

    /* 안전 검증 */
    if(!bbsId||!nttId){Swal.fire('오류','필수 파라미터 누락','error');throw new Error('missing params')}

    /* ── 게시글 상세 ───────────────────────── */
    let ARTICLE = {};          /* ★ 전역 보관 – 버튼 제어용 */

    fetch(`/muscat/board/articleDetail?bbsId=${bbsId}&nttId=${nttId}`)
      .then(r=>r.json()).then(res=>{
        const d = ARTICLE = res.article || {};
        /* 등록자 – 익명 처리 ★ */
        const writerNm = d.anonymousAt==='Y' ? 'anonymous' : (d.frstRegisterNm||'');

        document.getElementById('nttSj').textContent          = d.nttSj;
        document.getElementById('frstRegisterNm').textContent = writerNm;
        document.getElementById('frstRegisterPnttm').textContent = d.frstRegisterPnttm;
        document.getElementById('inqireCo').textContent       = d.inqireCo;
        document.getElementById('nttCn').innerHTML            =(d.nttCn||'').replace(/\n/g,'<br>');
        document.getElementById('ntceBgnde').textContent      = `${d.ntceBgnde} ~ ${d.ntceEndde}`;

        /* 첨부파일 */
        if(res.fileList?.length) renderFiles(res.fileList);
        else document.getElementById('atchFileArea').textContent='첨부 파일이 없습니다';

        /* ★ 버튼 노출 제어 */
        const isMine   = loginUserId && loginUserId===d.frstRegisterId;
        const anonymous= d.anonymousAt==='Y';
        document.getElementById('btnEdit' ).style.display = anonymous || !isMine ? 'none':'' ;
        document.getElementById('btnDelete').style.display = anonymous || !isMine ? 'none':'' ;
        /* 답글 허용여부(boardMasterVO.replyPosblAt=='Y')를 백엔드에서 내려주면 체크 */
        if(d.replyPosblAt==='N') document.getElementById('btnReply').style.display='none';
      });

    function renderFiles(list){
      const cell=document.getElementById('atchFileArea'); cell.innerHTML='';
      const ul=document.createElement('ul');
      list.forEach(f=>{
        const a=document.createElement('a'); a.href='#';
        a.textContent=`${f.orignlFileNm} [${(+f.fileMg).toLocaleString()} byte]`;
        a.onclick=e=>{
          e.preventDefault();
          window.open(`${downloadBaseUrl}?atchFileId=${f.atchFileId}&fileSn=${f.fileSn}`,'_blank');
        };
        const li=document.createElement('li'); li.appendChild(a); ul.appendChild(li);
      });
      cell.appendChild(ul);
    }

    /* ── 댓글 목록 ─────────────────────────── */
    function loadReplies(page=1){
      fetch(`/muscat/board/replyList?bbsId=${bbsId}&nttId=${nttId}&pageIndex=${page}&pageSize=${pageSize}`)
        .then(r=>r.json()).then(res=>{
          if(!loginUserId) loginUserId = res.currentUserId || '';

          const list  = res.comments   || [];
          const total = res.totalCount || 0;
          currentPage = page;
          totalPages  = Math.ceil(total/pageSize);
          document.getElementById('replyCount').textContent = total;

          const wrap=document.getElementById('replyList');
          if(!list.length){
            wrap.innerHTML='댓글이 없습니다.'; renderPagination(); return;
          }

          wrap.innerHTML=list.map(c=>{
            /* 익명 댓글 처리 ★ */
            const writerNm = c.anonymousAt==='Y' ? 'anonymous' : (c.wrterNm||'');
            const writerId = c.wrterId     || c.frstRegisterId || '';
            const myReply  = writerId && writerId===loginUserId;
            return `
              <div class="border-bottom mb-2 pb-2">
                <strong>${writerNm}</strong>
                <span class="text-muted small">(${c.frstRegisterPnttm})</span>
                <p>${c.commentCn}</p>
                ${myReply?`
                  <div class="text-end">
                    <button class="btn btn-sm btn-outline-secondary reply-btn"
                            onclick="editReply('${c.commentNo}', \`${c.commentCn.replace(/`/g,'\\`')}\`)">수정</button>
                    <button class="btn btn-sm btn-outline-danger reply-btn"
                            onclick="deleteReply('${c.commentNo}')">삭제</button>
                  </div>`:''}
              </div>`;
          }).join('');
          renderPagination();
        });
    }

    /* ── 댓글 페이징 ────────────────────────── */
    function renderPagination(){
      const el=document.getElementById('pagination'); el.innerHTML='';
      if(totalPages<=1) return;
      const max=5;
      let s=Math.max(1,currentPage-Math.floor(max/2)),
          e=Math.min(totalPages,s+max-1);
      if(e-s<max-1) s=Math.max(1,e-max+1);

      const mk=(lbl,p,act,dis)=>{
        const li=document.createElement('li');
        li.className=`page-item ${act?'active':''} ${dis?'disabled':''}`;
        const a=document.createElement('a'); a.className='page-link'; a.href='#'; a.innerHTML=lbl;
        a.onclick=e=>{
          e.preventDefault();
          if(!dis&&p!==currentPage) loadReplies(p);
        };
        li.appendChild(a); return li;
      };
      el.appendChild(mk('«',currentPage-1,false,currentPage===1));
      for(let i=s;i<=e;i++) el.appendChild(mk(i,i,i===currentPage,false));
      el.appendChild(mk('»',currentPage+1,false,currentPage===totalPages));
    }

    /* ── 댓글 등록/수정/삭제 ────────────────── */
    function submitReply(){
      const cn=document.getElementById('replyContent').value.trim();
      if(!cn) return Swal.fire('입력 오류','댓글 내용을 입력해주세요.','warning');
      fetch('/muscat/board/replyInsert',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({bbsId,nttId,commentCn:cn})
      })
      .then(r=>r.json()).then(res=>{
        if(res.status==='success'){
          Swal.fire('등록 완료',res.message,'success');
          document.getElementById('replyContent').value='';
          loadReplies(1);
        }else Swal.fire('등록 실패',res.message,'error');
      });
    }

    function editReply(commentNo,originCn){
      Swal.fire({
        title:'댓글 수정',input:'textarea',inputValue:originCn,
        showCancelButton:true,confirmButtonText:'수정',cancelButtonText:'취소'
      }).then(({isConfirmed,value})=>{
        if(!isConfirmed) return;
        const cn=value.trim();
        if(!cn) return Swal.fire('입력 오류','내용을 입력하세요.','info');
        fetch('/muscat/board/replyUpdate',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({commentNo,commentCn:cn})
        })
        .then(r=>r.json()).then(res=>{
          if(res.status==='success'){
            Swal.fire('수정 완료',res.message,'success');
            loadReplies(currentPage);
          }else Swal.fire('수정 실패',res.message,'error');
        });
      });
    }

    function deleteReply(commentNo){
      Swal.fire({
        title:'댓글 삭제',text:'정말 삭제하시겠습니까?',icon:'warning',
        showCancelButton:true,confirmButtonText:'삭제',cancelButtonText:'취소'
      }).then(({isConfirmed})=>{
        if(!isConfirmed) return;
        fetch('/muscat/board/replyDelete',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({commentNo})
        })
        .then(r=>r.json()).then(res=>{
          if(res.status==='success'){
            Swal.fire('삭제 완료',res.message,'success');
            loadReplies(1);
          }else Swal.fire('삭제 실패',res.message,'error');
        });
      });
    }

    /* ── 상단 버튼 ──────────────────────────── */
    function goEdit (){location.href=`/muscat/board/articleUpdt.do?bbsId=${bbsId}&nttId=${nttId}`;}
    function goReply(){location.href=`/muscat/board/articleReply.do?bbsId=${bbsId}&nttId=${nttId}`;}
    function goBack (){location.href=`/muscat/board/articleList.do?bbsId=${bbsId}`;}

    function goDelete(){
      Swal.fire({
        title:'정말 삭제하시겠습니까?',icon:'warning',
        showCancelButton:true,confirmButtonText:'삭제',cancelButtonText:'취소'
      }).then(({isConfirmed})=>{
        if(!isConfirmed) return;
        fetch('/muscat/board/articleDelete',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({bbsId,nttId})
        })
        .then(r=>r.json()).then(res=>{
          if(res.resultCode==='SUCCESS'){
            Swal.fire('삭제 완료',res.resultMessage,'success')
              .then(()=>goBack());
          }else{
            Swal.fire('삭제 실패',res.resultMessage,'error');
          }
        });
      });
    }

    /* ── 최초 실행 ───────────────────────────── */
    document.addEventListener('DOMContentLoaded',()=>loadReplies(1));
  </script>
</main>
</html>
