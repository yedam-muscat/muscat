<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시판 수정</title>

  <!-- DataTables · SweetAlert2 -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<main layout:fragment="content">
  <h2>🛠 게시판 수정</h2>

  <form id="editForm" style="max-width:700px; margin-left:40px;">
    <input type="hidden" id="bbsId"        name="bbsId">
    <input type="hidden" id="replyPosblAt" name="replyPosblAt">
    <input type="hidden" id="bbsTyCode"    name="bbsTyCode" value="BBST01">

    <!-- ★ 부서코드 저장용 -->
    <input type="hidden" id="deptId" name="deptId">

    <!-- ───────── 기본정보 ───────── -->
    <div class="mb-3">
      <label class="form-label" for="bbsNm">게시판명</label>
      <input type="text" class="form-control" id="bbsNm" name="bbsNm" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="bbsIntrcn">게시판 소개</label>
      <textarea class="form-control" id="bbsIntrcn" name="bbsIntrcn"
                rows="3" required></textarea>
    </div>

    <!-- ───────── 카테고리 / 구분 ───────── -->
    <div class="mb-3">
      <label class="form-label" for="categoryMain">게시판 카테고리</label>
      <select class="form-select" id="categoryMain"
              name="categoryMain" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label" for="categoryScope">게시판 구분</label>
      <select class="form-select" id="categoryScope"
              name="categoryScope" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <!-- ───────── 부서 선택 (부서게시판일 때만) ───────── -->
    <div id="deptWrap" class="mb-3" style="display:none"><!-- ★ -->
      <label class="form-label fw-bold">부서 선택 <span class="text-danger">*</span></label>
      <select id="deptSelect" class="form-select"><!-- ★ 단일 셀렉트 -->
        <option value="">-- 부서 선택 --</option>
        <!-- controller 에서 주입된 dept_result(List<GroupVO>) -->
        <option th:each="d : ${dept_result}"
                th:value="${d.id}"
                th:text="${d.text}"></option>
      </select>
    </div>

    <!-- ───────── 파일 / 옵션 등 ───────── -->
    <div class="mb-3">
      <label class="form-label" for="fileAtchPosblAt">파일첨부 가능</label>
      <select class="form-select" id="fileAtchPosblAt"
              name="fileAtchPosblAt" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option>
        <option value="N">아니오</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label" for="atchPosblFileNumber">첨부 가능 파일 수</label>
      <select class="form-select" id="atchPosblFileNumber"
              name="atchPosblFileNumber" required>
        <option value="0">없음</option>
        <option value="1">1개</option>
        <option value="2">2개</option>
        <option value="3">3개</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label" for="option">추가 선택사항</label>
      <select class="form-select" id="option" name="option" disabled>
        <option value="">-- 선택 안 함 --</option>
        <option value="comment">댓글</option>
        <option value="stsfdg">만족도조사</option>
      </select>
      <div class="form-text text-muted">※ 옵션은 최초 설정만 가능</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="useAt">사용여부</label>
      <select class="form-select" id="useAt" name="useAt" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option>
        <option value="N">아니오</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">수정</button>
    <a href="/muscat/board/masterList.do" class="btn btn-secondary">목록</a>
  </form>

  <!-- ───────── SCRIPT ───────── -->
  <script>
    /* ===== 상수 ===== */
    const SCOPE_DEPT = 'BT101';     // “부서게시판” 구분 코드
    const bbsId = new URLSearchParams(location.search).get("bbsId");

    /* ===== 공통코드 AJAX 로딩 ===== */
    async function loadCommonCodes(groupCode, targetId, selected = '') {
      const res  = await fetch(`/muscat/board/commonCodes?groupCode=${groupCode}`);
      const list = await res.json();
      const sel  = document.getElementById(targetId);
      list.forEach(({ code, codeNm }) => {
        const opt = new Option(codeNm, code, false, code === selected);
        sel.add(opt);
      });
    }

    /* ===== 부서 영역 토글 ===== */
    function toggleDept(scopeVal) {                 // ★
      const wrap  = document.getElementById('deptWrap');
      const dSel  = document.getElementById('deptSelect');

      if (scopeVal === SCOPE_DEPT) {
        wrap.style.display = '';
        dSel.required      = true;
      } else {
        wrap.style.display = 'none';
        dSel.required      = false;
        dSel.value         = '';
      }
    }

    /* ===== 첨부파일 수 활성/비활성 ===== */
    function applyFileRules() {
      const fileSel = document.getElementById('fileAtchPosblAt');
      document.getElementById('atchPosblFileNumber').disabled =
        (fileSel.value === 'N');
    }

    /* ===== 상세정보 로딩 후 폼 채우기 ===== */
    async function loadDetail() {
      if (!bbsId) { Swal.fire("오류","bbsId 파라미터가 없습니다.","error"); return; }

      const data = await (await fetch(`/muscat/board/masterDetail?bbsId=${bbsId}`)).json();

      // 기본 필드 채우기
      ['bbsId','bbsNm','bbsIntrcn','bbsTyCode',
       'replyPosblAt','fileAtchPosblAt','atchPosblFileNumber',
       'option','useAt','deptId'].forEach(k=>{
         if(data[k]!==undefined) document.getElementById(k).value = data[k];
      });

      // 카테고리/구분 공통코드 동적 로딩
      await loadCommonCodes('COM104','categoryMain',  data.categoryMain);
      await loadCommonCodes('COM105','categoryScope', data.categoryScope);

      // 부서 select 값 세팅
      if (data.deptId) document.getElementById('deptSelect').value = data.deptId; // ★

      // 옵션이 이미 존재하면 수정불가
      if (data.option) document.getElementById('option').disabled = true;

      // 첨부파일 select 활성화 규칙
      applyFileRules();

      // 부서 영역 토글
      toggleDept(data.categoryScope);
    }

    /* ===== 이벤트 바인딩 ===== */
    document.getElementById('categoryScope')
            .addEventListener('change', e => toggleDept(e.target.value));  // ★

    document.getElementById('fileAtchPosblAt')
            .addEventListener('change', applyFileRules);

    /* ===== 저장 ===== */
    document.getElementById('editForm').addEventListener('submit', async e=>{
      e.preventDefault();

      // ★ 부서 hidden 값 주입
      document.getElementById('deptId').value =
        document.getElementById('deptSelect').value;

      const payload = Object.fromEntries(new FormData(e.target).entries());

      try{
        const res = await fetch('/muscat/board/masterUpdt',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(payload)
        });
        const json = await res.json();
        if(json.resultCode==='SUCCESS'){
          await Swal.fire('수정 완료',json.resultMessage,'success');
          location.href='/muscat/board/masterList.do';
        }else{
          Swal.fire('실패',json.resultMessage||'수정 실패','error');
        }
      }catch(err){
        Swal.fire('오류','서버 오류 발생','error');
      }
    });

    window.addEventListener('DOMContentLoaded', loadDetail);
  </script>
</main>
</html>
