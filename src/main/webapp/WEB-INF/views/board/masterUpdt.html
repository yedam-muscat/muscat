<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시판 수정</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<main layout:fragment="content" class="container mt-4">
  <h2>🛠 게시판 수정</h2>

  <form id="editForm">
    <input type="hidden" id="bbsId" name="bbsId">
    <input type="hidden" id="replyPosblAt" name="replyPosblAt">
    <input type="hidden" id="bbsTyCode" name="bbsTyCode" value="BBST01">

    <div class="mb-3">
      <label for="bbsNm" class="form-label">게시판명</label>
      <input type="text" id="bbsNm" name="bbsNm" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="bbsIntrcn" class="form-label">게시판 소개</label>
      <textarea id="bbsIntrcn" name="bbsIntrcn" class="form-control" rows="3" required></textarea>
    </div>

    <div class="mb-3">
      <label for="categoryMain" class="form-label">게시판 카테고리</label>
      <select id="categoryMain" name="categoryMain" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="categoryScope" class="form-label">게시판 구분</label>
      <select id="categoryScope" name="categoryScope" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="fileAtchPosblAt" class="form-label">파일첨부 가능</label>
      <select id="fileAtchPosblAt" name="fileAtchPosblAt" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option>
        <option value="N">아니오</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="atchPosblFileNumber" class="form-label">첨부 가능 파일 수</label>
      <select id="atchPosblFileNumber" name="atchPosblFileNumber" class="form-select" required>
        <option value="0">없음</option>
        <option value="1">1개</option>
        <option value="2">2개</option>
        <option value="3">3개</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="option" class="form-label">추가 선택사항</label>
      <select id="option" name="option" class="form-select" disabled>
        <option value="">-- 선택 안 함 --</option>
        <option value="comment">댓글</option>
        <option value="stsfdg">만족도조사</option>
      </select>
      <div class="form-text text-muted">※ 옵션은 최초 설정만 가능</div>
    </div>

    <div class="mb-3">
      <label for="useAt" class="form-label">사용여부</label>
      <select id="useAt" name="useAt" class="form-select" required>
        <option value="">-- 선택하세요 --</option>
        <option value="Y">예</option>
        <option value="N">아니오</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">수정</button>
    <a href="/muscat/board/masterList.do" class="btn btn-secondary">목록</a>
  </form>

  <script>
    const bbsId = new URLSearchParams(location.search).get("bbsId");

    async function loadCommonCodes(groupCode, selectId, selected = "") {
      try {
        const res = await fetch(`/muscat/board/commonCodes?groupCode=${groupCode}`);
        const codes = await res.json();
        const select = document.getElementById(selectId);
        codes.forEach(({ code, codeNm }) => {
          const opt = document.createElement("option");
          opt.value = code;
          opt.textContent = codeNm;
          if (code === selected) opt.selected = true;
          select.appendChild(opt);
        });
      } catch (e) {
        console.error(`${groupCode} 공통코드 로딩 실패`, e);
      }
    }

    function applyRules() {
      const type = document.getElementById("bbsTyCode").value;
      const reply = document.getElementById("replyPosblAt");
      const file = document.getElementById("fileAtchPosblAt");
      const cnt = document.getElementById("atchPosblFileNumber");

      if (type === "BBST03") {
        reply.value = "N";
        file.value = "N";
        cnt.value = "0";
        file.disabled = true;
        cnt.disabled = true;
      } else {
        file.disabled = false;
        cnt.disabled = (file.value === "N");
      }
    }

    document.getElementById("fileAtchPosblAt")
      .addEventListener("change", () => {
        document.getElementById("atchPosblFileNumber").disabled =
          (document.getElementById("fileAtchPosblAt").value === "N");
      });

    async function loadDetail() {
      try {
        if (!bbsId) {
          await Swal.fire("오류", "bbsId 파라미터가 없습니다.", "error");
          return;
        }

        const detail = await (await fetch(`/muscat/board/masterDetail?bbsId=${bbsId}`)).json();

        [
          "bbsId", "bbsNm", "bbsIntrcn", "bbsTyCode",
          "replyPosblAt", "fileAtchPosblAt", "atchPosblFileNumber",
          "option", "useAt"
        ].forEach(k => detail[k] !== undefined && (document.getElementById(k).value = detail[k]));

        await loadCommonCodes("COM104", "categoryMain", detail.categoryMain);
        await loadCommonCodes("COM105", "categoryScope", detail.categoryScope);

        if (detail.option) document.getElementById("option").disabled = true;

        applyRules();
      } catch (err) {
        console.error("상세 조회 실패", err);
        Swal.fire("오류", "게시판 정보를 불러오지 못했습니다.", "error");
      }
    }

    document.getElementById("editForm").addEventListener("submit", async evt => {
      evt.preventDefault();
      const obj = Object.fromEntries(new FormData(evt.target).entries());

      try {
        const res = await fetch("/muscat/board/masterUpdt", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(obj)
        });
        const result = await res.json();

        if (result.resultCode === "SUCCESS") {
          await Swal.fire("수정 완료", result.resultMessage, "success");
          location.href = "/muscat/board/masterList.do";
        } else {
          Swal.fire("실패", result.resultMessage || "수정 실패", "error");
        }
      } catch (err) {
        Swal.fire("오류", "서버 오류 발생", "error");
      }
    });

    window.addEventListener("DOMContentLoaded", loadDetail);
  </script>
</main>
</html>
