<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시판 목록</title>

  <!-- DataTables 스타일 및 JS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>
</head>

<main layout:fragment="content" class="container mt-4">
  <h2>📋 게시판 목록</h2>

  <!-- 상단 버튼 -->
  <div class="mb-3">
    <a href="/muscat/board/masterRegist.do" class="btn btn-primary">+ 게시판 등록</a>
  </div>

  <!-- 게시판 목록 테이블 -->
  <table id="boardTable" class="display table table-bordered w-100">
    <thead>
      <tr>
        <th>번호</th>
        <th>게시판명</th>
        <th>작성자</th>
        <th>작성일</th>
        <th>사용여부</th>
      </tr>
    </thead>
    <tbody>
      <!-- 비동기 데이터 로딩 -->
    </tbody>
  </table>

  <script>
    //HTML 문서가 모두 로드된 후 실행
    document.addEventListener('DOMContentLoaded', () => {
      // fetch API를 사용하여 서버로부터 게시판 목록 데이터를 JSON 형식으로 가져옴
      fetch('/muscat/board/masterList')
        .then(response => response.json()) // 서버 응답을 JSON으로 파싱
        .then(data => {
          const tbody = document.querySelector('#boardTable tbody'); // <tbody> 태그 선택
          tbody.innerHTML = ''; // 기존 테이블 내용 초기화 (중복 삽입 방지)
			
          // 서버에서 받은 게시판 목록(resultList)을 반복하며 행(tr)을 동적으로 생성
          data.resultList.forEach((row, index) => {
            const tr = document.createElement('tr'); // 새로운 행 생성
         // 행의 HTML 내용을 문자열로 구성하여 tr에 주입
            tr.innerHTML = `
              <td>${index + 1}</td>
              <td><a href="/muscat/board/masterDetail.do?bbsId=${row.bbsId}">${row.bbsNm}</a></td>
              <td>${row.frstRegisterNm || ''}</td>
              <td>${row.frstRegisterPnttm ? row.frstRegisterPnttm.slice(0, 10) : ''}</td>
              <td>${row.useAt === 'Y' ? '사용' : '미사용'}</td>
            `;
            // 완성된 행을 테이블 본문에 추가
            tbody.appendChild(tr);
          });
			
          // DataTable 플러그인 적용 → 테이블에 정렬, 검색, 페이지네이션 기능 추가
          new DataTable('#boardTable', {
            language: {
              // 한국어 설정 파일 로드
              url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/ko.json'
            }
          });
        })
        .catch(error => {
           // 서버 응답이 실패했거나 네트워크 오류가 발생했을 때 콘솔에 출력 + 알림 표시
          console.error('데이터 로딩 실패:', error);
          alert('목록을 불러오는 중 오류가 발생했습니다.');
        });
    });
  </script>
</main>
</html>
