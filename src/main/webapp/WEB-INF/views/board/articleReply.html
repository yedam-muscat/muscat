<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>답글 작성</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    th {
      width: 120px;
      background-color: #f8f8f8;
    }
    #nttCn {
      min-height: 200px;
      white-space: pre-wrap;
    }
  </style>
</head>

<main layout:fragment="content">
  <div class="container mt-4">
    <h2>✏️ 답글 작성</h2>

    <!-- 원본 게시글 정보 -->
    <div class="card mb-4">
      <div class="card-header">📄 원본 게시글</div>
      <div class="card-body">
        <div><strong>제목:</strong> <span th:text="${origin.nttSj}">제목</span></div>
        <div><strong>작성자:</strong> <span th:text="${origin.ntcrNm}">작성자</span></div>
        <div><strong>내용:</strong></div>
        <div class="border p-3 mt-2" th:text="${origin.nttCn}">내용</div>
      </div>
    </div>

    <!-- 답글 입력 폼 -->
    <form id="replyForm">
      <input type="hidden" id="bbsId" th:value="${boardMasterVO.bbsId}">
      <input type="hidden" id="parnts" th:value="${origin.nttId}">

      <table class="table table-bordered">
        <tr>
          <th>제목</th>
          <td><input type="text" id="nttSj" class="form-control" required></td>
        </tr>
        <tr>
          <th>내용</th>
          <td><textarea id="nttCn" class="form-control" rows="8" required></textarea></td>
        </tr>
        <tr>
          <th>익명</th>
          <td>
            <input type="checkbox" id="anonymousAt" value="Y"> 익명으로 작성
          </td>
        </tr>
      </table>

      <div class="text-end">
        <button type="submit" class="btn btn-primary">등록</button>
        <a th:href="@{/board/articleList.do(bbsId=${boardMasterVO.bbsId})}" class="btn btn-secondary">취소</a>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('replyForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const bbsId = document.getElementById('bbsId').value;
      const parnts = document.getElementById('parnts').value;
      const nttSj = document.getElementById('nttSj').value.trim();
      const nttCn = document.getElementById('nttCn').value.trim();
      const anonymousAt = document.getElementById('anonymousAt').checked ? 'Y' : 'N';

      if (!nttSj || !nttCn) {
        Swal.fire('입력 오류', '제목과 내용을 입력해주세요.', 'warning');
        return;
      }

      try {
        const res = await axios.post('/articleReply', {
          bbsId,
          parnts,
          nttSj,
          nttCn,
          anonymousAt
        });

        if (res.data.success) {
          Swal.fire('등록 완료', '답글이 등록되었습니다.', 'success')
            .then(() => {
              location.href = `/board/articleList.do?bbsId=${bbsId}`;
            });
        } else {
          Swal.fire('오류', res.data.message || '등록 실패', 'error');
        }

      } catch (err) {
        Swal.fire('에러', '서버 요청 중 오류 발생', 'error');
      }
    });
  </script>
</main>
</html>
