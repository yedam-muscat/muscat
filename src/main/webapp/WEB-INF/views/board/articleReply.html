<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
  <meta charset="UTF-8">
  <title>게시글 답글 작성</title>

  <!-- jQuery / jQuery-UI / CKEditor / SweetAlert2 (등록 화면과 동일) -->
  <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
  <script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- CKEditor 경고창 숨김 -->
  <style>
    .cke_notification{display:none!important}
  </style>
</head>

<body>
<main layout:fragment="content">
  <h2>✏ 게시글 답글 작성</h2>

  <form id="replyForm" action="articleReply" enctype="multipart/form-data" method="post">
    <!--──────── hidden ────────-->
    <input type="hidden" name="bbsId"    id="bbsId"    th:value="${boardMasterVO.bbsId}">
    <input type="hidden" name="parnts"   th:value="${origin.nttId}">
    <input type="hidden" name="sortOrdr" th:value="${origin.sortOrdr}">
    <input type="hidden" name="replyLc"  th:value="${origin.replyLc}">

    <!-- 제목 -->
    <div class="mb-3">
      <label for="nttSj">제목 <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="nttSj" name="nttSj"
             th:value="'RE: ' + ${origin.nttSj}" required>
    </div>

    <!-- 제목 굵게 
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="sjBoldAt" name="sjBoldAt" value="Y">
      <label class="form-check-label" for="sjBoldAt">제목 굵게</label>
    </div>-->

    <!-- 내용 -->
    <div class="mb-3">
      <label for="nttCn">내용 <span class="text-danger">*</span></label>
      <textarea class="form-control" id="nttCn" name="nttCn" rows="10" required></textarea>
    </div>

    <!-- 공지 / 익명 
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="noticeAt" name="noticeAt" value="Y">
      <label class="form-check-label" for="noticeAt">공지글</label>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="anonymousAt" name="anonymousAt" value="Y">
      <label class="form-check-label" for="anonymousAt">익명글</label>
    </div>-->

    <!-- 게시기간 -->
    <div class="mb-3">
      <label>게시기간</label>
      <div class="d-flex">
        <input type="text" class="form-control me-2" id="ntceBgnde" name="ntceBgnde" readonly>
        <span class="mt-2">~</span>
        <input type="text" class="form-control ms-2" id="ntceEndde" name="ntceEndde" readonly>
      </div>
    </div>

    <!-- 첨부파일 (게시판 설정에 따라) -->
    <div class="mb-3" th:if="${boardMasterVO.fileAtchPosblAt == 'Y'}">
      <label for="file_1">첨부파일</label>
      <input type="file" class="form-control" id="file_1" name="file_1" multiple>
    </div>

    <!-- 버튼 -->
    <button type="submit" class="btn btn-primary">등록</button>
    <a href="#" id="cancelBtn" class="btn btn-secondary">목록</a>
  </form>

  <!--──────── SCRIPT ────────-->
  <script>
    $(function () {
      /* datepicker */
      $("#ntceBgnde, #ntceEndde").datepicker({dateFormat:'yy-mm-dd'});

      /* CKEditor */
      CKEDITOR.replace("nttCn");

      const bbsId = new URLSearchParams(location.search).get("bbsId");
      $("#bbsId").val(bbsId);

      /* 목록 버튼 */
      $("#cancelBtn").on("click", function (e) {
        e.preventDefault();
        location.href = `/muscat/board/articleList.do?bbsId=${bbsId}`;
      });

      /* 저장 */
      $("#replyForm").on("submit", async function (e) {
        e.preventDefault();

        /* CKEditor 데이터 반영 */
        if (CKEDITOR.instances.nttCn) {
          CKEDITOR.instances.nttCn.updateElement();
        }

        /* 익명 + 공지 불가 */
        if (this.anonymousAt.checked && this.noticeAt.checked) {
          Swal.fire("알림", "익명글은 공지로 등록할 수 없습니다.", "warning");
          return;
        }

        const fd = new FormData(this);

        /* 게시기간 검증 */
        const s = fd.get("ntceBgnde").replaceAll("-", "");
        const eDate = fd.get("ntceEndde").replaceAll("-", "");
        if (s && eDate && s > eDate) {
          Swal.fire("오류", "시작일이 종료일보다 늦습니다.", "error");
          return;
        }

        /* 확인 후 전송 */
        const ok = await Swal.fire({title:"답글을 등록할까요?",icon:"question",showCancelButton:true});
        if (!ok.isConfirmed) return;

        fetch("/muscat/board/articleReply.do", {method:"POST", body:fd})
          .then(r=>r.json())
          .then(d=>{
            if (d.success) {
              Swal.fire("완료", "답글이 등록되었습니다.", "success")
                  .then(()=>location.href=`/muscat/board/articleList.do?bbsId=${bbsId}`);
            } else {
              Swal.fire("오류", d.message||"등록 실패", "error");
            }
          })
          .catch(()=>Swal.fire("오류","서버 통신 실패","error"));
      });
    });
  </script>
</main>
</body>
</html>
