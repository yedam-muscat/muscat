<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시글 목록</title>

  <!-- Bootstrap 아이콘 (🔊 📎 🔒 …) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- 기본 링크/셀 스타일 -->
  <style>
    a            { color:inherit; text-decoration:none }
    a:hover      { text-decoration:underline }
    td.title-cell{ white-space:nowrap }

    /* 댓글 수 뱃지 */
    .cmt-badge{
      display:inline-flex; align-items:center; gap:.25rem;
      font-size:.75rem; background:#f1f3f5; color:#0d6efd;
      border-radius:.5rem; padding:.05rem .45rem
    }
    /* 첨부/공지 아이콘 */
    .attach-icon{ font-size:1rem; color:#6c757d }
    .notice-icon{ font-size:1.05rem; color:#dc3545; vertical-align:-.05em }

    /* 비밀글(타인) – 글자·커서·hover 비활성화 */
    .locked            { color:#adb5bd!important; cursor:not-allowed!important }
    .locked:hover      { text-decoration:none!important }
    .locked-row:hover  { background:inherit!important }
  </style>
</head>

<main layout:fragment="content">
  <h2 id="boardTitle" class="fw-bold mb-3">📄 게시글 목록</h2>

  <!-- ===== 검색 + 새글 ===== -->
  <div class="d-flex align-items-center gap-2 mb-3">
    <select id="searchCnd" class="form-select form-select-sm" style="width:130px">
      <option value="0">제목</option><option value="1">내용</option><option value="2">작성자</option>
    </select>
    <input id="searchWrd" type="text" class="form-control form-control-sm" style="max-width:260px"
           placeholder="검색어를 입력하세요">
    <button id="btnSearch" class="btn btn-primary btn-sm">조회</button>

    <div class="flex-grow-1"></div>
    <button id="regBtn" class="btn btn-primary btn-sm">+ 새글쓰기</button>
  </div>

  <!-- ===== 목록 ===== -->
  <table class="table table-bordered align-middle">
    <thead class="table-light text-center">
      <tr>
        <th style="width:80px">번호</th>
        <th>제목</th>
        <th style="width:55px">첨부</th>
        <th style="width:120px">작성자</th>
        <th style="width:120px">작성일</th>
        <th style="width:90px">조회수</th>
      </tr>
    </thead>
    <tbody id="articleBody"></tbody>
  </table>

  <nav><ul id="pagination" class="pagination justify-content-center"></ul></nav>

<script>
/* ───────── 전역 설정 ───────── */
const pageSize = 10;
let bbsId='', currentPage=1, gSearchCnd='0', gSearchWrd='';

/* ▷ 서버가 내려준 로그인 사용자 고유 ID (없으면 '') */
const loginUserId = /*[[${loginUserId}]]*/ '';

/* ───────── 글 목록 조회 ───────── */
function loadArticleList(page=1){
  currentPage = page;
  const qs = new URLSearchParams({
    bbsId, pageIndex:page, pageSize,
    searchCnd:gSearchCnd, searchWrd:gSearchWrd
  });
  fetch('/muscat/board/articleList?' + qs)
    .then(r=>r.json())
    .then(d=>{
      const body = document.getElementById('articleBody');
      body.innerHTML = '';

      const list  = d.resultList || [];
      const total = +d.resultCnt || 0;
      const totalPages = Math.ceil(total / pageSize);

      if (d.boardInfo?.bbsNm)
        document.getElementById('boardTitle').textContent = '📄 ' + d.boardInfo.bbsNm + ' 게시글 목록';

      if (!list.length){
        body.innerHTML = '<tr><td colspan="6" class="text-center">게시글이 없습니다.</td></tr>';
      } else {
        list.forEach((row, idx)=>{
          const isNotice = row.noticeAt === 'Y';
          const isBold   = row.sjBoldAt === 'Y';
          const isSecret = row.secretAt === 'Y';
          const isMine   = row.frstRegisterId === loginUserId;

          /* ── 제목 링크 / 잠금 ── */
          let titleTag;
          if (isSecret && !isMine){          // 비밀글 + 타인
            titleTag = `<span class="title-link locked" title="비밀글입니다.">${row.nttSj}</span>`;
          }else{
            titleTag = `<a class="title-link${isBold?' fw-bold':''}"
                           href="/muscat/board/articleDetail.do?bbsId=${bbsId}&nttId=${row.nttId}">
                           ${row.nttSj}</a>`;
          }

          /* ── 아이콘/뱃지 구성 ── */
          const noticeIcon = isNotice ? '<i class="bi bi-megaphone-fill notice-icon me-1"></i>' : '';
          const lockIcon   = isSecret ? '<i class="bi bi-lock-fill text-danger me-1"></i>'     : '';
          const attachIcon = row.atchFileId ? '<i class="bi bi-paperclip attach-icon"></i>'    : '';
          const cmtBadge   = row.commentCnt>0 ? ` <span class="cmt-badge">💬 ${row.commentCnt}</span>` : '';

          /* ── 행 레코드 ── */
          const tr = document.createElement('tr');
          if (isSecret && !isMine) tr.classList.add('locked-row');   // hover X
          tr.classList.add('text-center');

          tr.innerHTML = `
            <td>${total - ((page-1)*pageSize) - idx}</td>
            <td class="text-start title-cell">
              ${noticeIcon}${lockIcon}${titleTag}${cmtBadge}
            </td>
            <td>${attachIcon}</td>
            <td>${row.frstRegisterNm||''}</td>
            <td>${(row.frstRegisterPnttm||'').slice(0,10)}</td>
            <td>${(row.inqireCo||0).toLocaleString()}</td>`;
          body.appendChild(tr);
        });
      }
      renderPagination(totalPages);
    })
    .catch(()=>alert('목록 로딩 중 오류가 발생했습니다.'));
}

/* ───────── 페이지네이션 ───────── */
function renderPagination(total){
  const pag = document.getElementById('pagination');
  pag.innerHTML = '';
  const add = (lbl,p,dis,act)=>{
    const li = document.createElement('li');
    li.className = `page-item ${act?'active':''} ${dis?'disabled':''}`;
    li.innerHTML = `<a class="page-link" href="#">${lbl}</a>`;
    li.querySelector('a').onclick = e=>{
      e.preventDefault();
      if(!dis && !act) loadArticleList(p);
    };
    pag.appendChild(li);
  };
  add('«', currentPage-1, currentPage===1);
  const max = 5;
  let s = Math.max(1, currentPage-Math.floor(max/2));
  let e = Math.min(total, s+max-1);
  if(e-s < max-1) s = Math.max(1, e-max+1);
  for(let i=s;i<=e;i++) add(i,i,false,currentPage===i);
  add('»', currentPage+1, currentPage===total || total===0);
}

/* ───────── 검색 & 새글쓰기 ───────── */
$('#btnSearch').click(()=>{
  gSearchCnd = $('#searchCnd').val();
  gSearchWrd = $('#searchWrd').val().trim();
  loadArticleList(1);
});
$('#searchWrd').keyup(e=>{ if(e.key==='Enter') $('#btnSearch').click(); });
$('#regBtn').click(()=>location.href=`/muscat/board/articleRegist.do?bbsId=${bbsId}`);

/* ───────── 초기화 ───────── */
document.addEventListener('DOMContentLoaded',()=>{
  const qs = new URLSearchParams(location.search);
  bbsId       = qs.get('bbsId') || '';
  gSearchCnd  = qs.get('searchCnd') || '0';
  gSearchWrd  = qs.get('searchWrd') || '';
  $('#searchCnd').val(gSearchCnd); $('#searchWrd').val(gSearchWrd);

  if(!bbsId){ alert('bbsId 파라미터가 없습니다.'); return; }
  loadArticleList();
});
</script>
</main>
</html>
