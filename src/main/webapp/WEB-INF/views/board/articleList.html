<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>게시글 목록</title>

  <!-- Bootstrap & jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 🔧 링크 스타일 제거 -->
  <style>
    a {
      text-decoration: none;
      color: inherit;
    }
    a:hover {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>

<main layout:fragment="content" class="container mt-4">
  <!-- 게시판 이름 동적 표시 -->
  <h2 id="boardTitle">📄 게시글 목록</h2>

  <!-- 상단 버튼 -->
  <div class="mb-3">
    <a id="regBtn" class="btn btn-primary">+ 새글쓰기</a>
  </div>

  <!-- 게시글 목록 테이블 -->
  <table class="table table-bordered">
    <thead class="table-light">
      <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성자</th>
        <th>작성일</th>
        <th>조회수</th>
      </tr>
    </thead>
    <tbody id="articleBody">
      <!-- 비동기 데이터 렌더링 -->
    </tbody>
  </table>

  <!-- 페이징 영역 -->
  <nav>
    <ul class="pagination justify-content-center" id="pagination"></ul>
  </nav>

  <script>
    const pageSize = 10;
    let currentPage = 1;
    let bbsId = '';

    // 게시글 목록 로딩
    function loadArticleList(page = 1) {
      fetch(`/muscat/board/articleList?bbsId=${bbsId}&pageIndex=${page}&pageSize=${pageSize}`)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('articleBody');
          tbody.innerHTML = '';

          const resultList = data.resultList || [];
          const totalCount = parseInt(data.resultCnt || 0);
          const totalPages = Math.ceil(totalCount / pageSize);

          if (data.boardName) {
            document.getElementById('boardTitle').innerText = `📄 ${data.boardName} 게시글 목록`;
          }

          if (resultList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">게시글이 없습니다.</td></tr>';
          } else {
            resultList.forEach((row, idx) => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>${totalCount - ((page - 1) * pageSize) - idx}</td>
                <td><a href="/muscat/board/articleDetail.do?nttId=${row.nttId}&bbsId=${bbsId}">${row.nttSj}</a></td>
                <td>${row.frstRegisterNm || ''}</td>
                <td>${row.frstRegisterPnttm?.slice(0, 10) || ''}</td>
                <td>${(row.inqireCo || 0).toLocaleString()}</td>
              `;
              tbody.appendChild(tr);
            });
          }

          renderPagination(page, totalPages);
        })
        .catch(err => {
          console.error('게시글 목록 로딩 실패:', err);
          alert('게시글 목록을 불러오는 중 오류가 발생했습니다.');
        });
    }

    // 페이징 UI 렌더링
    function renderPagination(currentPage, totalPages) {
      const paginationEl = document.getElementById('pagination');
      paginationEl.innerHTML = '';

      const createPageItem = (label, page, isActive = false, isDisabled = false) => {
        const li = document.createElement('li');
        li.className = `page-item ${isActive ? 'active' : ''} ${isDisabled ? 'disabled' : ''}`;
        const a = document.createElement('a');
        a.className = 'page-link';
        a.href = '#';
        a.textContent = label;
        a.addEventListener('click', e => {
          e.preventDefault();
          if (!isDisabled && page !== currentPage) {
            loadArticleList(page);
          }
        });
        li.appendChild(a);
        return li;
      };

      // 이전 버튼
      paginationEl.appendChild(createPageItem('«', currentPage - 1, false, currentPage === 1));

      // 번호 버튼
      const maxButtons = 5;
      let start = Math.max(1, currentPage - Math.floor(maxButtons / 2));
      let end = Math.min(totalPages, start + maxButtons - 1);
      if (end - start < maxButtons - 1) {
        start = Math.max(1, end - maxButtons + 1);
      }

      for (let i = start; i <= end; i++) {
        paginationEl.appendChild(createPageItem(i, i, i === currentPage));
      }

      // 다음 버튼
      paginationEl.appendChild(createPageItem('»', currentPage + 1, false, currentPage === totalPages));
    }

    // 초기 로딩
    document.addEventListener('DOMContentLoaded', () => {
      bbsId = new URLSearchParams(location.search).get('bbsId');
      if (!bbsId) {
        alert('게시판 ID(bbsId)가 필요합니다.');
        location.href = '/muscat/board/masterList.do';
        return;
      }

      document.querySelector('#regBtn').addEventListener('click', () => {
        location.href = `/muscat/board/articleRegist.do?bbsId=${bbsId}`;
      });

      loadArticleList();
    });
  </script>
</main>
</html>
