<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MUSCAT</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link
	href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">

<link rel="stylesheet" th:href="@{/assets/css/pages/email.css}">
<link rel="stylesheet"
	th:href="@{/assets/vendors/sweetalert2/sweetalert2.min.css}">
<link rel="stylesheet" th:href="@{/assets/css/pages/auth.css}">

<link rel="stylesheet" th:href="@{/assets/vendors/iconly/bold.css}">

<link rel="stylesheet"
	th:href="@{/assets/vendors/perfect-scrollbar/perfect-scrollbar.css}">
<link rel="stylesheet"
	th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
<link rel="stylesheet" th:href="@{/assets/css/app.css}">
<link rel="shortcut icon" th:href="@{/assets/images/favicon.ico}"
	type="image/x-icon">
<script src="https://code.jquery.com/jquery-3.7.1.js"

</head>

<body>
	<div id="auth">
		<div class="row h-100">
			<div class="col-lg-5 d-none d-lg-block">
				<div id="auth-right"></div>
			</div>
			<div class="col-lg-7 col-12">
				<div id="auth-left px-2 py-2">
					<div class="card">
						<div class="card-header text-white">
							<h5 class="mb-0">회원가입</h5>
						</div>
						<div class="card-body">

							<!-- 일반회원 아이디 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label for="mberId" class="col-form-label">아이디</label>
								</div>
								<div class="col-auto">
									<input type="text" id="mberId" class="form-control">
									<div class="valid-feedback">사용 가능한 아이디입니다.</div>
									<div class="invalid-feedback">이미 사용 중인 아이디입니다.</div>
								</div>
								<div class="col-auto">
									<button type="button"

										id="checkIdButton">아이디 중복확인</button>
								</div>
							</div>

							<!-- 일반회원 이름 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label for="mberNm" class="col-form-label">이름</label>
								</div>
								<div class="col-auto">
									<input type="text" id="mberNm" class="form-control">
								</div>
								<div class="col-auto"></div>
							</div>

							<!-- 비밀번호 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label for="password" class="col-form-label">비밀번호</label>
								</div>
								<div class="col-auto">
									<input type="password" id="password" class="form-control"
										aria-describedby="passwordHelpInline">
								</div>
								<div class="col-auto">
									<span id="passwordHelpInline" class="form-text">영문자, 숫자 포함 4~10자리</span>
								</div>
							</div>

							<!-- 비밀번호 확인 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label for="confirmPassword" class="col-form-label">비밀번호
										확인</label>
								</div>
								<div class="col-auto">
									<input type="password" id="confirmPassword"
										class="form-control">
								</div>
							</div>

							<!-- 비밀번호 힌트 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label for="passwordHint" class="col-form-label">비밀번호
										힌트</label>
								</div>
								<div class="col-auto">
									<select class="form-select" id="passwordHint">
										<option selected value="">--비밀번호 힌트 선택--</option>
										<option th:each="item : ${passwordHint_result}"
											th:value="${item.code}" th:text="${item.codeNm}"></option>
									</select>
								</div>
							</div>

							<!-- 비밀번호 정답 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label for="passwordCnsr" class="col-form-label">힌트 정답</label>
								</div>
								<div class="col-auto">
									<input type="text" id="passwordCnsr" class="form-control">
								</div>
							</div>

							<!-- 성별 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label for="sexdstnCode" class="col-form-label">성별</label>
								</div>
								<div class="col-auto">
									<select class="form-select" id="sexdstnCode">
										<option selected value="">-- 성별 구분 --</option>
										<option th:each="item : ${sexdstnCode_result}"
											th:value="${item.code}" th:text="${item.codeNm}"></option>
									</select>
								</div>
							</div>

							<!-- 전화번호 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label class="col-form-label">전화번호</label>
								</div>
								<div class="col-auto">
									<select class="form-select" id="areaNo">
										<option value="">-- 번호 선택 --</option>
										<option value="02">02 (서울)</option>
										<option value="031">031 (경기)</option>
										<option value="032">032 (인천)</option>
										<option value="033">033 (강원)</option>
										<option value="041">041 (충남)</option>
										<option value="042">042 (대전)</option>
										<option value="043">043 (충북)</option>
										<option value="044">044 (세종)</option>
										<option value="051">051 (부산)</option>
										<option value="052">052 (울산)</option>
										<option value="053">053 (대구)</option>
										<option value="054">054 (경북)</option>
										<option value="055">055 (경남)</option>
										<option value="061">061 (전남)</option>
										<option value="062">062 (광주)</option>
										<option value="063">063 (전북)</option>
										<option value="064">064 (제주)</option>
										<option value="010">010</option>
										<option value="011">011</option>
										<option value="016">016</option>
										<option value="017">017</option>
										<option value="018">018</option>
										<option value="019">019</option>
									</select>

								</div>
								<div class="col-2">
									<input type="text" class="form-control" id="middleTelno">
								</div>
								<div class="col-2">
									<input type="text" class="form-control" id="endTelno">
								</div>
							</div>

							<!-- 핸드폰번호 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label for="mobile" class="col-form-label">핸드폰</label>
								</div>
								<div class="col-auto">
									<select id="mobileStart" class="form-select">
										<option value="">-- 번호 선택 --</option>
										<option value="010">010</option>
										<option value="011">011</option>
										<option value="016">016</option>
										<option value="017">017</option>
										<option value="018">018</option>
										<option value="019">019</option>
									</select>
								</div>
								<div class="col-2">
									<input type="text" class="form-control" id="mobileCenter">
								</div>
								<div class="col-2">
									<input type="text" class="form-control" id="mobileEnd">
								</div>
							</div>

							<!-- 이메일 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label for="mberEmailAdres" class="col-form-label">이메일</label>
								</div>
								<div class="col-auto">
									<input type="email" id="mberEmailAdres" class="form-control">
								</div>
							</div>

							<!-- 우편번호 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label for="zip" class="col-form-label">우편번호</label>
								</div>
								<div class="col-2">
									<input type="text" id="zip" class="form-control" readonly>
								</div>
								<div class="col-auto">
									<button type="button"
										class="btn btn-outline-primary my-auto btn-sm" id="postNumBtn">우편번호
										찾기</button>
								</div>

							</div>

							<!-- 주소 -->
							<div class="row g-3 align-items-center mb-2">
								<div class="col-2">
									<label for="adres" class="col-form-label">주소</label>
								</div>
								<div class="col-6">
									<input type="text" id="adres" class="form-control" readonly>
								</div>
							</div>

							<!-- 상세주소 -->
							<div class="row g-3 align-items-center mb-4">
								<div class="col-2">
									<label for="detailAdres" class="col-form-label">상세주소</label>
								</div>
								<div class="col-10">
									<input type="text" id="detailAdres" class="form-control">
								</div>
							</div>

							<input type="hidden" id="mberSttus" value="A">

							<!-- 버튼 -->
							<div class="d-flex justify-content-end">
								<button class="btn btn-primary me-2" id="reqUserReg">회원가입</button>
								<button class="btn btn-outline-secondary" id="cancelUserReg">취소</button>
							</div>

						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script th:inline="javascript">
	let checkId = false;
	let availableId = false;
	
		$('document').ready(function() {
			
			$('#postNumBtn').on('click', function() {
				goAddSearch();
			});

			$('#checkIdButton').on('click', function() {
				fn_id_check();
			});
			
			$('#mberId').focus();
			
			$('#reqUserReg').on('click', function() {
				
				if (!checkId) {
					Swal.fire({
						icon : "warning",
						title : "아이디 중복확인을 해주세요"
					})
					
					return;
				}
				
				if (!availableId) {
					Swal.fire({
						icon : "error",
						title : "사용할 수 없는 아이디입니다"
					})
					
					return;
				}
				
				if (validateSignupForm()) {
					userReg();
				}
				
			})
		});
		
		function userReg() {
			let url = 'http://localhost:8082/muscat/uat/uia/userReg.do';
			$.ajax({
				type: "POST",
				url: url,
				data: {
					mberId : $('#mberId').val(),
					mberNm : $('#mberNm').val(),
					password : $('#password').val(),
					passwordCnsr : $('#passwordCnsr').val(),
					passwordHint : $('#passwordHint').val(),
					mberEmailAdres : $('#mberEmailAdres').val(),
					zip : $('#zip').val(),
					adres : $('#adres').val(),
					detailAdres : $('#detailAdres').val(),
					areaNo : $('#areaNo').val(),
					middleTelno : $('#middleTelno').val(),
					endTelno : $('#endTelno').val(),
					moblphonNo : getMoblphonNo(),
					mberSttus : $('#mberSttus').val(),
					sexdstnCode : $('#sexdstnCode').val(),
				},
				dataType: 'json',
				timeout:(1000*30),
				})
				.done(function() {
					Swal.fire({
						icon : "success",
						title : "회원 가입 요청이 완료되었습니다"
					}).then(() => {
						location.href = '/muscat/login/login.do';
					})
				  })
				  .fail(function() {
						Swal.fire({
							icon : "error",
							title : "오류가 발생했습니다"
						})
				  });
		}
		
		
		function goAddSearch() {
		    var width = 570;
		    var height = 420;
		    var left = (window.screen.width / 2) - (width / 2);
		    var top = (window.screen.height / 2) - (height / 2);
		    var url = /*[[ @{/sym/ccm/zip/EgovAdressPop.do} ]]*/ '';
		    
		    var pop = window.open(
		    		url,
		            'pop',
		            'width=' + width + ',height=' + height + ',scrollbars=yes,resizable=yes' + ',top=' + top + ',left=' + left
		        );		
		    }
		
		function jusoCallBack(zipNo,rnMgtSn,siNm,sggNm,roadFullAddr,buldMnnm,buldSlno,bdNm,detBdNmList){
			
			console.log(zipNo);
			//console.log(rnMgtSn);
			//console.log(sggNm);
			console.log(roadFullAddr);
			//console.log(buldMnnm);
			//console.log(buldSlno);
			//console.log(bdNm);
			//console.log(detBdNmList);
			
			$('#zip').val(zipNo);
			formatAddress(roadFullAddr);
			// 팝업페이지에서 주소입력한 정보를 받아서, 현 페이지에 정보를 등록합니다.
			//document.zip.zip.value = zipNo; 										/* 우편번호 */
			//document.zip.rdmnCode.value = rnMgtSn; 						/* 도로명코드 */
			//document.zip.ctprvnNm.value = siNm; 								/* 시도명 */
			//document.zip.signguNm.value = sggNm; 							/* 시군구명 */
			//document.zip.rdmn.value = roadFullAddr; 						    /* 도로명 */
			//document.zip.bdnbrMnnm.value = buldMnnm; 					/* 건물본번 */
			//document.zip.bdnbrSlno.value = buldSlno; 						/* 건물부번 */
			//document.zip.buldNm.value = bdNm; 								/* 건물명 */

			window.close();

		function formatAddress(rawAddress) {
			// 1. 괄호 안 텍스트 포함 괄호 전체 추출 (&#40;, &amp;#40;, ( 등)
			let match = rawAddress.match(/((?:&amp;#40;|&#40;|\()[^&\(\)]*(?:&amp;#41;|&#41;|\)))/);
			let parenText = match ? match[0] : ''; // 괄호 포함 텍스트

			// 2. 괄호 앞까지 잘라냄
			let main = rawAddress.split(/&amp;#40;|&#40;|\(/)[0].trim();

			// 3. 쉼표로 나눈 후 앞뒤 공백 제거
			let parts = main.split(',').map(p => p.trim());

			// 4. 괄호 포함 텍스트를 뒷부분에 붙임
			if (parts.length > 1 && parenText) {
				// 괄호 디코딩 처리
				let decoded = parenText
					.replace(/&amp;#40;|&#40;/, '(')
					.replace(/&amp;#41;|&#41;/, ')');
				parts[1] += ' ' + decoded;
			}
			console.log(parts);

			$('#adres').val(parts[0]);
			$('#detailAdres').val(parts[1]);
			
		}
		
		function isValidId(id) {
			  const idRegex = /^[a-zA-Z0-9]{4,10}$/;
			  return idRegex.test(id);
			}
		
		function fn_id_check() {
			  const idInput = $("#mberId");
			  const idValue = idInput.val().trim();

			  if (!idValue) {
			    idInput.addClass("is-invalid").removeClass("is-valid");
			    idInput.nextAll(".invalid-feedback").first().text("아이디를 입력해주세요.");
			    return;
			  }
			  
			  if (!isValidId(idValue)) {
				  idInput.addClass("is-invalid").removeClass("is-valid");
				  idInput.nextAll(".invalid-feedback").first().text("영문자, 숫자 포함 4~10자여야 합니다.");
				  idInput.focus();
				  return;
			  }
			  
			  let url = /*[[ @{/uss/umt/EgovIdDplctCnfirmAjax.do} ]]*/ '';

			  $.ajax({
			    url: url,
			    type: "POST",
			    data: {
					"checkId": idValue		
				},
				dataType:'json',
				timeout:(1000*30),
			    success: function (returnData, status) {
			    	if (status == "success") {
			    		if (returnData.usedCnt > 0 ) {
			    			checkId = false;
			    			availableId = false;
					        idInput.removeClass("is-valid").addClass("is-invalid");
					        idInput.nextAll(".invalid-feedback").first().text("이미 사용 중인 아이디입니다.");
			    		} else {
			    			checkId = true;
			    			availableId = true;
					        idInput.removeClass("is-invalid").addClass("is-valid");
					        idInput.nextAll(".valid-feedback").first().text("사용 가능한 아이디입니다.");
			    		}
			    	}
			    },
			    error: function () {
	    			checkId = false;
	    			availableId = false;
			      idInput.removeClass("is-valid").addClass("is-invalid");
			      idInput.nextAll(".invalid-feedback").first().text("확인 중 오류가 발생했습니다.");
			    }
			  });
		}
		
		function getMoblphonNo() {
			return $('#mobileStart').val() + $('#mobileCenter').val() + $('#mobileEnd').val();
		}
		
		function validateSignupForm() {
			  const id = $("#mberId").val().trim();
			  const name = $("#mberNm").val().trim();
			  const pw = $("#password").val();
			  const pwConfirm = $("#confirmPassword").val();
			  const passwordHint = $("#passwordHint").val();
			  const passwordCnsr = $("#passwordCnsr").val().trim();
			  const sexdstnCode = $("#sexdstnCode").val();
			  const areaNo = $("#areaNo").val();
			  const middleTel = $("#middleTelno").val().trim();
			  const endTel = $("#endTelno").val().trim();
			  const mobileStart = $("#mobileStart").val();
			  const mobileCenter = $("#mobileCenter").val().trim();
			  const mobileEnd = $("#mobileEnd").val().trim();
			  const email = $("#mberEmailAdres").val().trim();
			  const zip = $("#zip").val();
			  const adres = $("#adres").val();
			  const detailAdres = $("#detailAdres").val();

			  // 공백 체크
			  if (!id) return alert("아이디를 입력하세요.");
			  if (!name) return alert("이름을 입력하세요.");
			  if (!pw) return alert("비밀번호를 입력하세요.");
			  if (!pwConfirm) return alert("비밀번호 확인을 입력하세요.");
			  if (!passwordHint) return alert("비밀번호 힌트를 선택하세요.");
			  if (!passwordCnsr) return alert("힌트 정답을 입력하세요.");
			  if (!sexdstnCode) return alert("성별을 선택하세요.");
			  if (!areaNo || !middleTel || !endTel) return alert("전화번호를 모두 입력하세요.");
			  if (!mobileStart || !mobileCenter || !mobileEnd) return alert("휴대폰 번호를 모두 입력하세요.");
			  if (!email) return alert("이메일을 입력하세요.");
			  if (!zip || !adres || !detailAdres) return alert("주소를 모두 입력하세요.");

			  // 비밀번호 유효성
			  //const pwRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+=-]).{8,20}$/;
			  const pwRegex = /^(?=.*[A-Za-z])(?=.*\d).{4,10}$/;
			  if (!pwRegex.test(pw)) return alert("비밀번호는 영문자, 숫자 4~10자리여야 합니다.");
			  if (pw !== pwConfirm) return alert("비밀번호가 일치하지 않습니다.");

			  // 전화번호 숫자만
			  const phoneRegex = /^\d+$/;
			  if (!phoneRegex.test(middleTel) || !phoneRegex.test(endTel)) return alert("전화번호는 숫자만 입력하세요.");
			  if (!phoneRegex.test(mobileCenter) || !phoneRegex.test(mobileEnd)) return alert("휴대폰 번호는 숫자만 입력하세요.");

			  // 이메일 유효성
			  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
			  if (!emailRegex.test(email)) return alert("유효한 이메일 형식이 아닙니다.");

			  // 모든 조건 통과
			  return true;
			}

	</script>
