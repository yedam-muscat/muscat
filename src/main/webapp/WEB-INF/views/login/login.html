<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSCAT - Login</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link
	href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap"
	rel="stylesheet">
<link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">

<link rel="stylesheet" th:href="@{/assets/css/pages/email.css}">
<link rel="stylesheet"
	th:href="@{/assets/vendors/sweetalert2/sweetalert2.min.css}">
<link rel="stylesheet" th:href="@{/assets/css/pages/auth.css}">

<link rel="stylesheet" th:href="@{/assets/vendors/iconly/bold.css}">

<link rel="stylesheet"
	th:href="@{/assets/vendors/perfect-scrollbar/perfect-scrollbar.css}">
<link rel="stylesheet"
	th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
<link rel="stylesheet" th:href="@{/assets/css/app.css}">
<link rel="shortcut icon" th:href="@{/assets/images/favicon.png}"
	type="image/x-icon">
<script src="https://code.jquery.com/jquery-3.7.1.js"
	integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
	crossorigin="anonymous"></script>
	
<style>
#auth #auth-left .auth-logo {
    margin-bottom: 1rem;
}

#auth #auth-left .auth-logo img{
    width: 100%;
    height: auto;
}

</style>
</head>

<body>
	<div id="auth">
		<div class="row h-100">
			<div class="col-lg-5 col-12">
				<div id="auth-left">
					<div class="auth-logo">
						<img th:src="@{/assets/images/logo/muscat_logo_cropped.png}" alt="Logo">
					</div>
<!-- 					<h1 class="auth-title">MUSCAT</h1>
 -->					<h3 class="auth-title">Log in.</h3>
					<p class="auth-subtitle">Groupware for elegant work.</p>

					<div class="card">
						<form name="loginForm" th:action="@{/uat/uia/actionLogin.do}"
							method="POST">
							<div class="card-header"></div>

							<div class="card-body">
								<div class="row">
									<!-- 									<div class="form-check col-6">
										<input class="form-check-input" type="radio" name="userSe"
											id="typeGnr" value="GNR" checked> <label
											class="form-check-label" for="flexRadioDefault1">
											일반사용자 </label>
									</div>
									<div class="form-check col-6">
										<input class="form-check-input" type="radio" name="userSe"
											id="typeUsr" value="USR"> <label
											class="form-check-label" for="flexRadioDefault2"> 관리자</label>
									</div> -->
								</div>

								<input class="form-check-input" type="hidden" name="userSe"
									id="typeGnr" value="GNR">
							</div>
							<div class="form-group position-relative has-icon-left mb-4">
								<input type="text" class="form-control form-control-xl"
									name="id" id="id" placeholder="ID">
								<div class="form-control-icon">
									<i class="bi bi-person"></i>
								</div>
							</div>
							<div class="form-group position-relative has-icon-left mb-4">
								<input type="password" class="form-control form-control-xl"
									name="password" id="password" placeholder="PASSWORD">
								<div class="form-control-icon">
									<i class="bi bi-shield-lock"></i>
								</div>
							</div>

							<button type="button"
								class="btn btn-primary btn-block btn-lg shadow-lg"
								onclick="actionLogin()">로그인</button>
						</form>
					</div>
					<div class="text-center mt-5 fs-5">
						<p class="text-gray-600">
							계정이 없으신가요? <a href="#" onclick="goUserReg(); return false;"
								class="font-bold">회원가입</a>
						</p>
						<!-- <p>
							<a class="font-bold" href="#"
								onclick="goPasswordReset(); return false;">비밀번호를 잊으셨나요?</a>
						</p> -->
					</div>
				</div>
			</div>
			<div class="col-lg-7 d-none d-lg-block">
				<div id="auth-right"></div>
			</div>
		</div>
	</div>
	<script th:inline="javascript">
		let userRegUrl = /*[[ @{/uat/uia/userReg.do} ]]*/'';
		let loginMessage = /*[[ ${loginMessage} ]]*/'';
	</script>
	<script>
		$(function() {

			if (loginMessage) {
				Swal.fire({
					icon : "error",
					title : loginMessage
				})
			}

			$('#password').on('keyup', function(e) {
				if (e.key === 'Enter') {
					e.preventDefault();
					actionLogin();
				}
			});
		});

		function actionLogin() {
			if (document.loginForm.id.value == "") {
				Swal.fire({
					icon : "warning",
					title : "아이디를 입력해주세요"
				})
			} else if (document.loginForm.password.value == "") {
				Swal.fire({
					icon : "warning",
					title : "비밀번호를 입력해주세요"
				})
			} else {
				document.loginForm.submit();
			}
		}

		function goUserReg() {
			location.href = userRegUrl;
		}

		function goPasswordReset() {

		}
	</script>
	<script
		th:src="@{/assets/vendors/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
	<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>

	<script th:src="@{/assets/vendors/sweetalert2/sweetalert2.all.min.js}"></script>
</body>

</html>
