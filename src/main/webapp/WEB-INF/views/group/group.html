<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>조직도 모달</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    #employeeCard {
      position: absolute;
      display: none;
      width: 300px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 10px;
      z-index: 2000;
    }
  </style>
</head>
<body>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/charts/loader.js"></script>

<script>
  google.charts.load('current', {packages:["orgchart"]});

  $('#staticBackdrop').on('shown.bs.modal', function(){
    drawChart();
  });

  function drawChart() {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Name');
    data.addColumn('string', 'Manager');
    data.addColumn('string', 'ToolTip');

    data.addRows([
      [{v:'CEO', f:'<div onclick="showCard(event, \'CEO\', \'대표\')">CEO<div style="color:red; font-style:italic">대표</div>'}, '', '대표'],
      [{v:'부서1', f:'<div onclick="showCard(event, \'부서1\', \'부서\')">부서1</div>'}, 'CEO', '부서1'],
      [{v:'부서2', f:'<div onclick="showCard(event, \'부서2\', \'부서\')">부서2</div>'}, 'CEO', '부서2'],
      [{v:'팀1', f:'<div onclick="showCard(event, \'팀1\', \'팀\')">팀1</div>'}, '부서1', '팀1'],
      [{v:'팀2', f:'<div onclick="showCard(event, \'팀2\', \'팀\')">팀2</div>'}, '부서1', '팀2'],
      [{v:'팀3', f:'<div onclick="showCard(event, \'팀3\', \'팀\')">팀3</div>'}, '부서2', '팀3'],
      [{v:'팀4', f:'<div onclick="showCard(event, \'팀4\', \'팀\')">팀4</div>'}, '부서2', '팀4']
    ]);

    var chart = new google.visualization.OrgChart(document.getElementById('chart_div'));
    chart.draw(data, {allowHtml:true});
  }

  function showCard(event, name, detail) {
    var card = document.getElementById('employeeCard');
    document.getElementById('empName').innerText = name;
    document.getElementById('empDetail').innerText = detail;
    document.getElementById('empEmail').innerText = name.toLowerCase() + "@company.com";

    card.style.left = (event.pageX + 10) + 'px';
    card.style.top = (event.pageY + 10) + 'px';
    card.style.display = 'block';
  }

  function hideCard() {
    document.getElementById('employeeCard').style.display = 'none';
  }
</script>
</body>
</html>
