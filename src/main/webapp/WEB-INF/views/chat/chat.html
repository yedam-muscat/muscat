<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<main layout:fragment="content">
	<head>
<meta charset="UTF-8" />
<title>채팅방</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
<style>
/* 채팅방 스타일 */
#chatRoom {
	display: none;
	position: fixed;
	bottom: 20px;
	right: 20px;
	width: 300px;
	height: 400px;
	background: white;
	border: 1px solid #ccc;
	border-radius: 10px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
	z-index: 3000;
	display: flex;
	flex-direction: column;
}

#chatRoom.header {
	background: #075e54;
	color: white;
	padding: 10px;
	border-radius: 10px 10px 0 0;
	display: flex;
	justify-content: space-between;
	align-items: center;
}

#chatMessages {
	padding: 10px;
	flex-grow: 1;
	overflow-y: auto;
	background: #ece5dd;
	display: flex;
	flex-direction: column;
}

#chatInputArea {
	padding: 10px;
	border-top: 1px solid #ccc;
	display: flex;
	gap: 5px;
}

#chatInput {
	flex-grow: 1;
	padding: 5px;
}

#sendMsg {
	padding: 5px 10px;
	background: #25d366;
	border: none;
	color: white;
	cursor: pointer;
	border-radius: 4px;
}

.my-message {
	align-self: flex-end;
	background-color: #dcf8c6;
	padding: 5px 10px;
	border-radius: 10px;
	margin: 2px 0;
	max-width: 70%;
}

.other-message {
	align-self: flex-start;
	background-color: #fff;
	padding: 5px 10px;
	border-radius: 10px;
	margin: 2px 0;
	max-width: 70%;
}

#gridChatMessages {
	padding: 10px;
	flex-grow: 1;
	overflow-y: auto;
	background: #ACBCE3;
	display: flex;
	flex-direction: column;
}
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}
.message-wrapper {
  display: flex;
  flex-direction: column;
  max-width: 70%;
  margin: 10px;
}

/* 오른쪽 정렬: 내 메시지 */
.message-wrapper.mine {
  align-self: flex-end;
  text-align: right;
}

/* 왼쪽 정렬: 상대 메시지 */
.message-wrapper.others {
  align-self: flex-start;
  text-align: left;
}

.message-user {
  font-weight: bold;
  font-size: 0.85rem;
  margin-bottom: 4px;
}

.message-bubble {
  display: inline-block;
  padding: 8px 12px;
  border-radius: 8px;
  background-color: #dcf8c6; /* 내 메시지 색 */
  word-wrap: break-word;
}

.message-wrapper.others .message-bubble {
  background-color: #f1f0f0; /* 상대 메시지 색 */
}

.message-content {
  display: inline;
}

.message-time {
  font-size: 0.7rem;
  color: gray;
  margin-top: 2px;
}

.message-wrapper.mine .message-time {
  align-self: flex-end;
}

.message-wrapper.others .message-time {
  align-self: flex-start;
}

</style>
	</head>
	
	<body>
			<!-- 그리드 시작 -->
			<div id="gridContainer"
				style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; width: 100%; padding: 10px; box-sizing: border-box; height: 100vh;">

			<!--  채팅방 목록 패널 (왼쪽 열) -->
			<div id="chatListPanel"
				style="background-color: #f8f9fa; border: 1px solid #ccc; border-radius: 5px; overflow-y: auto; height: 80%;">

				<div class="d-flex justify-content-between align-items-center mb-2" style="background-color: #0d6efd; color: white; padding: 10px; position: relative;">
					<h5 style="margin:0;">채팅방 목록</h5>
					
					<button id="openModalBtn" class="btn btn-primary btn-sm" >➕</button>
				</div>
				
				 <!--  로그인 사용자 ID를 JS에서 사용할 수 있도록 숨겨 둠 -->
				<input type="hidden" id="sessionUserId" th:value="${session.loginVO.id}" />
				
				<!-- 채팅방 리스트 (JS가 동적으로 채움) -->
				<ul id="chatListPopupItems" class="list-group list-group-flush mb-0">
					<!-- JavaScript에서 li가 여기에 추가 -->
				</ul>
			</div>
			
			<!-- 채팅방 생성 모달 -->
			<div id="chatModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
			  background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center;">
			  <div style="background: white; width: 500px; border-radius: 10px; overflow: hidden;">
			    
			    <!-- 모달 헤더 -->
			    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #f5f5f5;">
			      <span style="font-weight: bold;">새 채팅 시작</span>
			      <div>
			        <button id="orgIcon">🏢</button>
			        <button id="listIcon">📃</button>
			        <button id="createChatBtn" style="margin-right: 5px;">확인</button> 
			        <button onclick="closeModal()">❌</button>
			      </div>
			    </div>
			
			    <!-- 필터 인풋 -->
			    <div style="padding: 10px 20px;">
			      <input type="text" id="searchInput" placeholder="사원 이름 검색" style="width: 100%; padding: 8px;">
			    </div>
			
			    <!-- 리스트 영역 -->
			    <div id="userList" style="max-height: 300px; overflow-y: auto; padding: 0 20px 20px;">
			      <!-- JS에서 동적으로 생성됨 -->
			    </div>
			    
			    <!-- 밤에 작업한 내 -->
			    <!-- 조직도 영역 (처음엔 숨김) -->
				<div id="orgTreeWrapper" style="max-height: 300px; overflow-y: auto; padding: 0 20px 20px; display: none;">
  				<div id="chatTree"></div>
				</div>
			    
			  </div>
			</div>

			<!-- 채팅방 -->
				<div id="gridChatRoom"
					style="display: flex; background: #fff; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.2); flex-direction: column; height: 80%;">
				
				<!-- 채팅방 제목 + 아이콘 묶음 + 버튼들 전체 -->
				<div style=" display: flex; justify-content: space-between; align-items: center; gap: 6px; position: relative; padding: 10px;">

				  <!-- 왼쪽: 제목 + 아이콘 -->
				  <div style="display: flex; align-items: center; gap: 6px;">
				    <span id="gridChatUserName">채팅방 제목</span>
				
				    <!--  아이콘 -->
				    <div style="position: relative;">
				      <i id="chatUserListIcon" class="bi bi-people" style="cursor: pointer;" title="참여자 보기"></i>
				
				      <!--  말풍선 모달 -->
				      <div id="userListPopup" style="display: none; position: absolute; top: 100%; right: 0; width: 200px;background: white; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); overflow: hidden; padding: 10px; z-index: 1000;">
				      <strong>참여자</strong>
				        <ul id="chatUserList" style="list-style: none; margin: 0; padding: 10px; max-height: 240px; overflow-y: auto;">
				          <li> (나)</li>
				        </ul>
				        <div style="border-top: 1px solid #eee; padding: 10px; text-align: center;">
				          <button id="copyRoomUrlBtn" style="background: none; border: none; font-size: 14px; color: #007bff; cursor: pointer;"></button>
				        </div>
				      </div>
				    </div>
				  </div>
				
				  <!-- 오른쪽: 첨부 아이콘, 버튼들 -->
				  <div style="display: flex; align-items: center; gap: 5px;">
				    <span class="input-group-text" style="padding: 0.375rem 0.75rem; background: transparent; border: none;">
				      <i id="gridAttachFileIcon" class="bi bi-paperclip" style="cursor: pointer;" title="파일 첨부"></i>
				    </span>
				
				    <button class="btn btn-sm btn-primary" type="button" id="gridOpenMemo">보고</button>
				
				    <button id="closeGridChat" style="background: none; border: none; color: black; font-weight: bold; cursor: pointer;">X</button>
				
				    <input type="file" id="gridFileInput" style="display: none;">
				  </div>
				</div>
				
				<div id="gridChatMessages" style="padding: 10px; flex-grow: 1; overflow-y: auto; background: #ACBCE3;">
						<!-- 채팅 메시지 표시 영역 -->
				</div>

					<div id="gridChatInputArea" style="padding: 10px; border-top: 1px solid #ccc; display: flex; gap: 5px;">
					
						<input id="gridChatInput" type="text" class="form-control"placeholder="메시지를 입력하세요..." /> 
						<input type="hidden" id="roomId" th:value="${roomId}" /> 
						<input type="hidden" id="loginUserId" th:value="${session.loginVO.id}" />
						
					<button id="gridSendMsg" class="btn btn-success" style="padding: 0.25rem 0.75rem; font-size: 0.9rem; white-space: nowrap;" disabled>전송</button>
					</div>
				</div>
			</div>

			<!-- 보고 모달 -->
			<div class="modal fade" id="fileAttachModal" tabindex="-1"aria-labelledby="fileAttachModalLabel" aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content border-primary">
						<div class="modal-header bg-primary text-white">
							<h5 class="modal-title" id="fileAttachModalLabel">메모보고 등록</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"aria-label="닫기"></button>
						</div>
						<div class="modal-body">
							<!-- 메모보고 폼 작성 부분 -->
							<div class="mb-2">
								<label class="form-label">보고일자</label> <input type="date" class="form-control">
							</div>
							<div class="mb-2">
								<label class="form-label">작성자명</label> <input type="text" class="form-control" value="홍길동" readonly>
							</div>
							<div class="mb-2">
								<label class="form-label">보고대상자</label>
								<div class="input-group">
									<input type="text" class="form-control"> <span class="input-group-text"><i class="bi bi-search"></i></span>
								</div>
							</div>
							<div class="mb-2">
								<label class="form-label">보고서제목</label> <input type="text" class="form-control">
							</div>
							<div class="mb-2">
								<label class="form-label">보고내용</label>
								<textarea class="form-control" rows="2"></textarea>
							</div>
							<div class="mb-2">
								<label class="form-label">파일첨부</label> <input type="file" class="form-control">
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
							<button type="button" class="btn btn-primary">등록</button>
						</div>
					</div>
				</div>
			</div>

			<!-- 이미지 미리보기  -->
			<div class="modal fade" id="imagePreviewModal" tabindex="-1" aria-hidden="true">
				<div class="modal-dialog modal-lg modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title">이미지 미리보기</h5>
							<button class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
						</div>
						<div class="modal-body text-center">
							<img id="previewImage" src="" style="max-width: 100%; max-height: 70vh;" />
						</div>
					</div>
				</div>
			</div>

			<script th:inline = "javascript">
			var username = /*[[${session.loginVO.id}]]*/'';
//-------------------------------------------------------tree 조직도-------------------------------------------------------		
			$(function() {
			  $('#chatTree').jstree({
			    'core': {
			      'data':{
			    	  'url': '/muscat/group/userData.do',
				        'dataType': 'json'
			      },
			    	'themes': {
			        'responsive': false,			        
			      },		
			    },
			    'types': {
			      'default': { 'icon': 'bi bi-folder' },
			      'user': { 'icon': 'bi bi-person' }
			    },
			    'plugins': ['types']
			  })
			  .on('loaded.jstree', async function (e, data) {

				    $('#chatTree').jstree(true).open_all(); 

				  })
				  .on("select_node.jstree", function (e, data) {
				    console.log("선택된 노드:", data.node.original);
				    if (data.node.type === "user") {
				      showEmployeeCard(data.node);
				    } else {
				      hideCard();
				    }
				  });
					
			});
			
			// 대화 상대 추가
			$('#openMessenger').on('click', function (e) {
			  e.stopPropagation();
			
			  const icon = $(this);
			  const popup = $('#chatListPopup');
			
			  if (popup.is(':visible')) {
			    popup.hide();
			    return;
			  }
			
			  const offset = icon.offset();
			  const height = icon.outerHeight();
			
			  popup.css({
			    top: offset.top + height + 10,
			    left: offset.left
			  }).show();
			
			  // 검색 초기화
			  $('#chatSearchInput').val('').focus();
			  $('#chatListPopupItems .chat-entry').show();
			});
			
			// 검색 필터
			$('#chatSearchInput').on('input', function () {
			  const keyword = $(this).val().trim().toLowerCase();
			  $('#chatListPopupItems .chat-entry').each(function () {
			    const name = $(this).text().trim().toLowerCase();
			    $(this).toggle(name.includes(keyword));
			  });
			});
			
//-------------------------------------------------------채팅 List-------------------------------------------------------		
			//채팅방 List불러오기
			 document.addEventListener("DOMContentLoaded", function () {
			      const sessionUserId = document.getElementById("sessionUserId").value;
			      console.log("로그인한 사용자 ID:", sessionUserId);
			
			      // fetch로 채팅방 불러오기
			      loadChatRooms(sessionUserId);
			    });
			
			    function loadChatRooms(userId) {
			      fetch('/muscat/chat/findroom.do?userId=' + userId	, {
			        method: "GET",
			      
			      })
			        .then(res => res.json())
			        .then(data => {
			          const chatList = document.getElementById("chatListPopupItems");
			          chatList.innerHTML = "";
			
			          data.result.forEach(room => {
			        	  const li = document.createElement("li");
			        	  li.className = "list-group-item chat-entry d-flex justify-content-between align-items-center";
			        	  li.setAttribute("data-room-id", room.roomId);
			        	  li.setAttribute("data-room-name", room.roomName); //  채팅방 제목 속성 추가
			        	  li.setAttribute("data-participants", JSON.stringify(room.usered || [])); // 반드시 필요!
			
			        	  const unreadCount = room.unreadCount || 0;
			
			        	  li.innerHTML = `
			        	    ${room.roomName}
			        	    <span class="badge bg-danger">${unreadCount}</span> `;
			
			        	  chatList.appendChild(li);
			        	});
			        })
			        .catch(err => console.error("채팅방 불러오기 실패:", err));
			    }
	
			//리스트에서 행 클릭 시 채팅방 open
			 document.addEventListener('DOMContentLoaded', function () {
			    const chatList = document.getElementById('chatListPopupItems');
			    const chatRoom = document.getElementById('gridChatRoom');
			    const chatUserName = document.getElementById('gridChatUserName');
			    const chatInput = document.getElementById('gridChatInput');
			    const closeBtn = document.getElementById('closeGridChat');
			    const chatUserList = document.getElementById("chatUserList");
			    const chatUserListIcon = document.getElementById("chatUserListIcon");
			    const userListPopup = document.getElementById("userListPopup");
			    const gridChatMessages = document.getElementById("gridChatMessages");
			
			    // 채팅방 초기에는 숨겨진 상태로 설정 (선택)
			    chatRoom.style.display = 'none';
			
			    // 채팅방 리스트 클릭 이벤트
			    chatList.addEventListener('click', function (event) {
			      const clickedItem = event.target.closest('.chat-entry');
			      if (!clickedItem) return;	
			      
			      const roomName = clickedItem.getAttribute("data-room-name"); //  여기서 제목 가져옴
			      const participants = JSON.parse(clickedItem.getAttribute('data-participants') || "[]");
			      const roomId = clickedItem.getAttribute("data-room-id"); // roomid를 찾는다.
			      
			      console.log("클릭된 채팅방 이름:", roomName);
			      console.log("참여자 배열:", participants);
			
			      document.getElementById("roomId").value = roomId; // input태그에 값을 넣어준다.
			      
			      openChatRoom(roomName ,participants);

 //------------------------------------------------------- 메시지 -------------------------------------------------------			      
			      
			      // 메시지 불러오기 호출
			      loadMessages(roomId);
			    });
			    
			    function loadMessages(roomId) {
			    	  fetch(`/muscat/chat/findMessage.do?roomId=${encodeURIComponent(roomId)}`)
			    	    .then(data => data.json())
			    	  .then(data => {
			    	      const messages = data.result;
			    	      gridChatMessages.innerHTML = ""; // 초기화

			    	      messages.forEach(msg => {
			    	    	  const isMine = (msg.userId === username); // 로그인한 사용자와 비교

			    	    	  const msgElement = document.createElement("div");
			    	    	  msgElement.classList.add("message-wrapper", isMine ? "mine" : "others");

			    	    	  msgElement.innerHTML = `
			    	    	    <div class="message-user">${msg.userId}</div>
			    	    	    <div class="message-bubble">
			    	    	      <span class="message-content">${escapeHtml(msg.mgContent)}</span>
			    	    	    </div>
			    	    	    <div class="message-time">${formatTime(msg.messageDate)}</div>
			    	    	  `;

			    	        gridChatMessages.appendChild(msgElement);
			    	      });

			    	      // 스크롤 맨 아래로 이동
			    	      gridChatMessages.scrollTop = gridChatMessages.scrollHeight;
			    	    })
			    	    .catch(error => {
			    	      console.error("메시지 로딩 오류:", error);
			    	    });
			    	}

			    	// 시간 포맷 함수
			    	function formatTime(dateStr) {
			    	  const date = new Date(dateStr);
			    	  return date.toLocaleTimeString("ko-KR", { hour: '2-digit', minute: '2-digit' });
			    	}

			    	// HTML 이스케이프 함수 (XSS 방지용)
			    	function escapeHtml(text) {
			    	  const div = document.createElement('div');
			    	  div.textContent = text;
			    	  return div.innerHTML;
			    	}

//------------------------------------------------------- 채팅방 참여자 List -------------------------------------------------------			    	
			    	
			 //  아이콘 클릭 → 팝업 토글
			     icon.addEventListener("click", function () {
			    popup.style.display = popup.style.display === "block" ? "none" : "block";
			  });
			
			    // 외부 클릭 시 닫기
			    document.addEventListener("click", function (e) {
			      if (!chatUserListIcon.contains(e.target) && !userListPopup.contains(e.target)) {
			        userListPopup.style.display = "none";
			      }
			    });
			
			    // 채팅방 열기 함수
			    function openChatRoom(roomName, participants =[]) {
			      chatUserName.textContent = roomName;         // 상단 사용자 이름 변경
			      chatRoom.style.display = 'flex';             // 채팅방 보이기
			      chatInput.disabled = false;
			      chatInput.focus();                           // 입력창 포커스
			      document.getElementById('gridSendMsg').disabled = false;
			      
			   // 참여자 리스트 초기화 및 표시
			      chatUserList.innerHTML = "";
			      participants.forEach(name => {
			    	  
			        const li = document.createElement("li");
			        li.textContent = name;
			        chatUserList.appendChild(li);
			      });
			      
			      // 이름 + (나) 라벨
			      const nameSpan = document.createElement("span");
			      //nameSpan.textContent = user.name;
			
/* 			      if (user.name === myUserId) {
			        const meLabel = document.createElement("span");
			        meLabel.textContent = "나";
			        meLabel.style.fontSize = "12px";
			        meLabel.style.color = "#888";
			        meLabel.style.marginLeft = "6px";
			        nameSpan.appendChild(meLabel);
			      } */
/* 			      li.appendChild(nameSpan);
			      chatUserList.appendChild(li); */
			      
			      // 참여자 팝업 기본은 닫힌 상태
			      document.getElementById("userListPopup").style.display = "none";
			    }
			    // 채팅방 닫기 버튼
			    closeBtn.addEventListener('click', function () {
			      chatRoom.style.display = 'none';
			    });
			  });
	
			// 대화 상대 선택
			$('#chatListPopup').on('click', '.chat-entry', function () {
			  const userName = $(this).data('user');
			  $('#chatUserName').text(userName);
			  $('#chatRoom').show();
			  $('#chatInput').focus();
			  $('#chatListPopup').hide();
			});
			
					
					
					
					// 상세카드 옆 채팅방 열기
						$("#openGridChat").on("click", function() {
							$("#gridChatRoom").show();
						});
						$("#closeGridChat").on("click", function() {
							  $("#gridChatRoom").hide();
							});
						// 보고 버튼 클릭 시 보고 모달 열기
						$("#gridOpenMemo").on("click", function() {
							  const modal = new bootstrap.Modal(document.getElementById('fileAttachModal'));
							  modal.show();
							});
						// 파일 아이콘 클릭 시 파일 선택
