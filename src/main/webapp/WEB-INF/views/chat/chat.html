<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<main layout:fragment="content">
	<head>
<meta charset="UTF-8" />
<title>채팅방</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
	rel="stylesheet" />
<style>
/* 채팅방 스타일 */
#chatRoom {
	display: none;
	position: fixed;
	bottom: 20px;
	right: 20px;
	width: 300px;
	height: 400px;
	background: white;
	border: 1px solid #ccc;
	border-radius: 10px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
	z-index: 3000;
	display: flex;
	flex-direction: column;
}

#chatRoom .header {
	background: #075e54;
	color: white;
	padding: 10px;
	border-radius: 10px 10px 0 0;
	display: flex;
	justify-content: space-between;
	align-items: center;
}

#chatMessages {
	padding: 10px;
	flex-grow: 1;
	overflow-y: auto;
	background: #ece5dd;
	display: flex;
	flex-direction: column;
}

#chatInputArea {
	padding: 10px;
	border-top: 1px solid #ccc;
	display: flex;
	gap: 5px;
}

#chatInput {
	flex-grow: 1;
	padding: 5px;
}

#sendMsg {
	padding: 5px 10px;
	background: #25d366;
	border: none;
	color: white;
	cursor: pointer;
	border-radius: 4px;
}

.my-message {
	align-self: flex-end;
	background-color: #dcf8c6;
	padding: 5px 10px;
	border-radius: 10px;
	margin: 2px 0;
	max-width: 70%;
}

.other-message {
	align-self: flex-start;
	background-color: #fff;
	padding: 5px 10px;
	border-radius: 10px;
	margin: 2px 0;
	max-width: 70%;
}

#gridChatMessages {
	padding: 10px;
	flex-grow: 1;
	overflow-y: auto;
	background: #ACBCE3;
	display: flex;
	flex-direction: column;
}
</style>



	</head>
	<body>
		<div id="chatContainer" style="display: flex; height: 80vh;">
			<!-- 사이드바 -->
			<div id="chatSidebar"
				style="width: 250px; min-width: 150px; max-width: 600px; background-color: #f8f9fa; border-right: 1px solid #ddd; overflow-y: auto;">
				<div class="p-3" style="background-color: #0d6efd; color: white;">
					<h5>선택할 사람</h5>
				</div>
				<div class="p-2">
					<div id="chatTree"></div>
				</div>
			</div>

			<!-- 리사이저 -->
			<div id="chatResizer"
				style="width: 5px; cursor: col-resize; background: #ddd;"></div>

			<!-- 그리드 시작 -->
			<div id="gridContainer"
				style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; width: 100%; padding: 10px; box-sizing: border-box;">

				<!--  채팅방 목록 패널 (왼쪽 열) -->
				<div id="chatListPanel"
					style="background-color: #f8f9fa; border: 1px solid #ccc; border-radius: 5px; overflow-y: auto;">

					<div
						style="background-color: #0d6efd; color: white; padding: 10px; position: relative;">
						<h5 style="margin: 0;">채팅방 목록</h5>

					</div>

	
					<!-- 채팅방 리스트 (안 읽은 메시지 수 표시 포함) -->
					<ul id="chatListPopupItems"
						class="list-group list-group-flush mb-0">
						<li
							class="list-group-item chat-entry d-flex justify-content-between align-items-center"
							data-user="아이유">아이유 <span class="badge bg-danger">3</span>
						</li>
						<li
							class="list-group-item chat-entry d-flex justify-content-between align-items-center"
							data-user="박보검">박보검 <span class="badge bg-danger">1</span>
						</li>
						<li
							class="list-group-item chat-entry d-flex justify-content-between align-items-center"
							data-user="김태리">김태리 <span class="badge bg-danger">0</span>
						</li>
					</ul>

				</div>

				<!-- 채팅방 -->
				<div id="gridChatRoom"
					style="display: flex; background: #fff; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.2); flex-direction: column; height: 100%;">

					<div class="header"
						style="background: #fff; color: black; padding: 10px; border-radius: 10px 10px 0 0; display: flex; justify-content: space-between; align-items: center;">
						<span id="gridChatUserName">채팅상대</span>
						<div style="display: flex; align-items: center; gap: 5px;">
							<span class="input-group-text"
								style="padding: 0.375rem 0.75rem; background: transparent; border: none;">
								<i id="gridAttachFileIcon" class="bi bi-paperclip"
								style="cursor: pointer;" title="파일 첨부"></i>
							</span>

							<button class="btn btn-sm btn-primary" type="button"
								id="gridOpenMemo">보고</button>


							<button id="closeGridChat"
								style="background: none; border: none; color: black; font-weight: bold; cursor: pointer;">X</button>
							<input type="file" id="gridFileInput" style="display: none;">
						</div>
					</div>

					<div id="gridChatMessages"
						style="padding: 10px; flex-grow: 1; overflow-y: auto; background: #ACBCE3;">
						<!-- 채팅 메시지 표시 영역 -->
					</div>

					<div id="gridChatInputArea"
						style="padding: 10px; border-top: 1px solid #ccc; display: flex; gap: 5px;">
						<input id="gridChatInput" type="text" class="form-control"
							placeholder="메시지를 입력하세요..." />
						<button id="gridSendMsg" class="btn btn-success"
							style="padding: 0.25rem 0.75rem; font-size: 0.9rem; white-space: nowrap;"
							disabled>전송</button>
					</div>
				</div>
			</div>

			<!-- 보고 모달 -->
			<div class="modal fade" id="fileAttachModal" tabindex="-1"
				aria-labelledby="fileAttachModalLabel" aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content border-primary">
						<div class="modal-header bg-primary text-white">
							<h5 class="modal-title" id="fileAttachModalLabel">메모보고 등록</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="닫기"></button>
						</div>
						<div class="modal-body">
							<!-- 메모보고 폼 작성 부분 -->
							<div class="mb-2">
								<label class="form-label">보고일자</label> <input type="date"
									class="form-control">
							</div>
							<div class="mb-2">
								<label class="form-label">작성자명</label> <input type="text"
									class="form-control" value="홍길동" readonly>
							</div>
							<div class="mb-2">
								<label class="form-label">보고대상자</label>
								<div class="input-group">
									<input type="text" class="form-control"> <span
										class="input-group-text"><i class="bi bi-search"></i></span>
								</div>
							</div>
							<div class="mb-2">
								<label class="form-label">보고서제목</label> <input type="text"
									class="form-control">
							</div>
							<div class="mb-2">
								<label class="form-label">보고내용</label>
								<textarea class="form-control" rows="2"></textarea>
							</div>
							<div class="mb-2">
								<label class="form-label">파일첨부</label> <input type="file"
									class="form-control">
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">취소</button>
							<button type="button" class="btn btn-primary">등록</button>
						</div>
					</div>
				</div>
			</div>

			<!-- 이미지 미리보기  -->
			<div class="modal fade" id="imagePreviewModal" tabindex="-1"
				aria-hidden="true">
				<div class="modal-dialog modal-lg modal-dialog-centered">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title">이미지 미리보기</h5>
							<button class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
						</div>
						<div class="modal-body text-center">
							<img id="previewImage" src=""
								style="max-width: 100%; max-height: 70vh;" />
						</div>
					</div>
				</div>
			</div>

			<script>
			$(function() {
			  $('#chatTree').jstree({
			    'core': {
			      'data':{
			    	  'url': '/muscat/group/userData.do',
				        'dataType': 'json'
			      },
			    	'themes': {
			        'responsive': false,			        
			      },		
			    },
			    'types': {
			      'default': { 'icon': 'bi bi-folder' },
			      'user': { 'icon': 'bi bi-person' }
			    },
			    'plugins': ['types']
			  })
			  .on('loaded.jstree', async function (e, data) {

				    $('#chatTree').jstree(true).open_all(); 

				  })
				  .on("select_node.jstree", function (e, data) {
				    console.log("선택된 노드:", data.node.original);
				    if (data.node.type === "user") {
				      showEmployeeCard(data.node);
				    } else {
				      hideCard();
				    }
				  });
					
			});
			// 대화 상대 추가
			$('#openMessenger').on('click', function (e) {
  e.stopPropagation();

  const icon = $(this);
  const popup = $('#chatListPopup');

  if (popup.is(':visible')) {
    popup.hide();
    return;
  }

  const offset = icon.offset();
  const height = icon.outerHeight();

  popup.css({
    top: offset.top + height + 10,
    left: offset.left
  }).show();

  // 검색 초기화
  $('#chatSearchInput').val('').focus();
  $('#chatListPopupItems .chat-entry').show();
});

// 검색 필터
$('#chatSearchInput').on('input', function () {
  const keyword = $(this).val().trim().toLowerCase();
  $('#chatListPopupItems .chat-entry').each(function () {
    const name = $(this).text().trim().toLowerCase();
    $(this).toggle(name.includes(keyword));
  });
});

//리스트에서 행 클릭 시 채팅방 open
 document.addEventListener('DOMContentLoaded', function () {
    const chatList = document.getElementById('chatListPopupItems');

    const chatRoom = document.getElementById('gridChatRoom');
    const chatUserName = document.getElementById('gridChatUserName');
    const chatInput = document.getElementById('gridChatInput');
    const closeBtn = document.getElementById('closeGridChat');

    // 채팅방 초기에는 숨겨진 상태로 설정 (선택)
    chatRoom.style.display = 'none';

    // 채팅방 리스트 클릭 이벤트
    chatList.addEventListener('click', function (event) {
      const clickedItem = event.target.closest('.chat-entry');
      if (!clickedItem) return;

      const userName = clickedItem.getAttribute('data-user');
      openChatRoom(userName);
    });

    // 채팅방 열기 함수
    function openChatRoom(userName) {
      chatUserName.textContent = userName;         // 상단 사용자 이름 변경
      chatRoom.style.display = 'flex';             // 채팅방 보이기
      chatInput.disabled = false;
      chatInput.focus();                           // 입력창 포커스
      document.getElementById('gridSendMsg').disabled = false;

      // TODO: 여기서 이전 채팅 메시지 불러오는 코드 추가 가능
      // loadChatHistory(userName);
    }

    // 채팅방 닫기 버튼
    closeBtn.addEventListener('click', function () {
      chatRoom.style.display = 'none';
    });
  });


// 대화 상대 선택
$('#chatListPopup').on('click', '.chat-entry', function () {
  const userName = $(this).data('user');
  $('#chatUserName').text(userName);
  $('#chatRoom').show();
  $('#chatInput').focus();
  $('#chatListPopup').hide();
});
			
					
					//채팅방 
					
					// 상세카드 옆 채팅방 열기
						$("#openGridChat").on("click", function() {
							$("#gridChatRoom").show();
						});
						$("#closeGridChat").on("click", function() {
							  $("#gridChatRoom").hide();
							});
						// 보고 버튼 클릭 시 보고 모달 열기
						$("#gridOpenMemo").on("click", function() {
							  const modal = new bootstrap.Modal(document.getElementById('fileAttachModal'));
							  modal.show();
							});
						// 파일 아이콘 클릭 시 파일 선택
						$("#gridAttachFileIcon").on("click", function() {
						  $("#gridFileInput").click();
						});
						// 오늘 여기 추가 했음.
						let attachedFiles = [];

						$('#gridFileInput').on('change', function (event) {
						  const files = event.target.files;
						  attachedFiles = [];

						  $('#gridChatInput').val('');
						  $('#gridSendMsg').prop('disabled', false);

						  for (const file of files) {
						    const reader = new FileReader();

						    reader.onload = function (e) {
						      attachedFiles.push({
						        name: file.name,
						        type: file.type,
						        size: file.size,
						        dataUrl: e.target.result
						      });
						    };

						    reader.readAsDataURL(file);
						  }

						  // 채팅 입력창에 미리보기 이름들
						  const fileNames = Array.from(files).map(f => f.name).join(', ');
						  $('#gridChatInput').val(`[첨부됨] ${fileNames}`);
						});

						
		
						// 입력값에 따라 전송 버튼 활성화
						$("#gridChatInput").on("input", function() {
						  const hasText = $(this).val().trim().length > 0;
						  $("#gridSendMsg").prop("disabled", !hasText);
						});
		
						// 전송 버튼 클릭 시 (여기엔 메시지 처리 로직 추가 가능)
					

$("#gridSendMsg").on("click", function () {
  const msg = $("#gridChatInput").val().trim();

  // 아무 내용도 없으면 리턴
  if (!msg && attachedFiles.length === 0) return;

  const chatContainer = $('<div class="chat-message my-1 d-flex justify-content-end"></div>');
  const bubble = $('<div class="message-bubble p-2 rounded" style="max-width: 70%; background-color: #DCF8C6;"></div>');

  // 첨부된 파일 처리
  if (attachedFiles.length > 0) {
    for (const file of attachedFiles) {
      const ext = file.name.split('.').pop().toLowerCase();

      if (file.type.startsWith('image/')) {
        const img = $('<img>')
          .attr('src', file.dataUrl)
          .css({ maxWidth: '150px', borderRadius: '10px', cursor: 'pointer', marginBottom: '5px' })
          .on('click', function () {
            $('#previewImage').attr('src', file.dataUrl);
            const modal = new bootstrap.Modal(document.getElementById('imagePreviewModal'));
            modal.show();
          });
        bubble.append(img);
      } else {
        const link = $('<a>')
          .attr('href', file.dataUrl)
          .attr('download', file.name)
          .text(file.name)
          .css({ display: 'block', marginTop: '5px', textDecoration: 'underline', color: '#0d6efd' });
        bubble.append($('<div><i class="bi bi-file-earmark"></i> </div>').append(link));
      }
    }
  }

  // 메시지가 있다면 추가
  if (msg) {
    bubble.append(`<div style="margin-top:5px;">${msg}</div>`);
  }

  // 조립 & 출력
  chatContainer.append(bubble);
  $('#gridChatMessages').append(chatContainer);
  $('#gridChatMessages').scrollTop($('#gridChatMessages')[0].scrollHeight);

  // 초기화
  $("#gridChatInput").val('');
  $(this).prop("disabled", true);
  $("#gridFileInput").val('');
  attachedFiles = [];
});

						// 엔터키 입력 시 전송
						$("#gridChatInput").on("keypress", function(e) {
						  if (e.which === 13 && !$("#gridSendMsg").prop("disabled")) {
						    $("#gridSendMsg").click();
						  }
						});
						
						//보고 모달 열기
						$('#attachFileIcon').on('click', function() {
							  const modal = new bootstrap.Modal(document.getElementById('fileAttachModal'));
							  modal.show();
							});
		
							$('#openMemoModal').on('click', function() {
							  const modal = new bootstrap.Modal(document.getElementById('fileAttachModal'));
							  modal.show();
							});
							
							//보고 
							$('#fileAttachModal .btn-primary').on('click', function() {
								  Swal.fire({
								    title: '보고 하시겠습니까?',
								    icon: 'question',
								    showCancelButton: true,
								    confirmButtonText: '보고',
								    cancelButtonText: '취소'
								  }).then((result) => {
								    if (result.isConfirmed) {
								      Swal.fire({
								        icon: 'success',
								        title: '보고 완료',
								        text: '보고서가 등록되었습니다.',
								        confirmButtonText: '확인'
								      }).then((result) => {
								        if (result.isConfirmed) {
								       
								          // 파일 아이콘 생성
									          const fileIconContainer = $('<div></div>').css({
									            position: 'relative',
									            display: 'inline-block',
									            margin: '5px'
									          });
									          const fileIcon = $('<i class="bi bi-file-earmark-text"></i>').css({
									              fontSize: '2rem',
									              cursor: 'pointer',
									              color: '#0d6efd'
									            }).attr('title', '보고서 보기');
		
								          // 아이콘 클릭 시 상세 모달 열기
								          fileIcon.on('click', function() {
								            const detailModal = new bootstrap.Modal(document.getElementById('reportDetailModal'));
								            detailModal.show();
								          });
		
								          fileIconContainer.append(fileIcon);
		
								       // 한 줄로 감싸서 오른쪽 끝에 붙이기
								          const messageRow = $('<div></div>').css({
								            width: '100%',
								            display: 'flex',
								            justifyContent: 'flex-end'
								          }).append(fileIconContainer);
								          
								          // 채팅방에 추가
								         $('#gridChatMessages').append(messageRow);
										 $('#gridChatMessages').scrollTop($('#gridChatMessages')[0].scrollHeight);
		
								          // 모달 닫기
								          const modal = bootstrap.Modal.getInstance(document.getElementById('fileAttachModal'));
								          modal.hide();
								        }
								      });
								    }
								  });
								});
							
							//승인 
							$('#approveReport').on('click', function () {
								  Swal.fire({
								    title: '승인하시겠습니까?',
								    icon: 'question',
								    showCancelButton: true,
								    confirmButtonText: '승인',
								    cancelButtonText: '취소'
								  }).then((result) => {
								    if (!result.isConfirmed) return;

								    const fileIconContainer = $('#gridChatMessages > div').last();

								    if (!fileIconContainer.length) return;

								    if (fileIconContainer.find('.check-badge').length > 0) {
								      Swal.fire({
								        icon: 'info',
								        title: '이미 승인된 보고입니다.',
								        text: '이 보고서는 이미 승인 처리되었습니다.',
								        confirmButtonText: '확인'
								      });
								      return;
								    }
								    
								 // 보류 배지 있으면 제거 
							        fileIconContainer.find('.hold-badge').remove();

								    // 	승인 체크 표시 추가
								    const checkBadge = $('<i class="bi bi-check-circle-fill check-badge"></i>').css({
								      position: 'absolute',
								      top: '0',
								      right: '0',
								      fontSize: '1rem',
								      color: 'green'
								    });
								    fileIconContainer.find('div').append(checkBadge);

								    Swal.fire({
								      icon: 'success',
								      title: '승인 완료',
								      text: '보고서가 승인되었습니다.',
								      confirmButtonText: '확인'
								    });

								    const modalInstance = bootstrap.Modal.getInstance(document.getElementById('reportDetailModal'));
								    if (modalInstance) modalInstance.hide();
								  });
								});
							//보류 시 
							$('#holdReport').on('click', function () {
								  Swal.fire({
								    title: '보류하시겠습니까?',
								    icon: 'warning',	
								    showCancelButton: true,
								    confirmButtonText: '보류',
								    cancelButtonText: '취소'
								  }).then((result) => {
								    if (!result.isConfirmed) return;

								    const opinionText = result.value;
								    const fileIconContainer = $('#gridChatMessages > div').last();

								    if (fileIconContainer.length) {
								      // 이미 보류 아이콘이 있는지 체크
								      if (fileIconContainer.find('.hold-badge').length > 0) {
								        Swal.fire({
								          icon: 'info',
								          title: '이미 보류된 보고입니다.',
								          text: '이 보고서는 이미 보류 처리되었습니다.',
								          confirmButtonText: '확인'
								        });
								        return;
								      }
								      
								   


								      // 보류 아이콘 추가
								      const holdBadge = $('<i class="bi bi-exclamation-circle-fill hold-badge"></i>').css({
								        position: 'absolute',
								        top: '0',
								        right: '0',
								        fontSize: '1rem',
								        color: 'orange'
								      });

								      fileIconContainer.find('div').append(holdBadge);
								      fileIconContainer.data('holdOpinion', opinionText);
								    }

								    Swal.fire({
								      icon: 'success',
