<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<main layout:fragment="content">
<head>
  <meta charset="UTF-8" />
  <title>채팅방</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  
  <style>
    /* 채팅방 스타일 */
    #chatRoom {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 300px;
      height: 400px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      z-index: 3000;
      display: flex;
      flex-direction: column;
    }
    #chatRoom .header {
      background: #075e54;
      color: white;
      padding: 10px;
      border-radius: 10px 10px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #chatMessages {
      padding: 10px;
      flex-grow: 1;
      overflow-y: auto;
      background: #ece5dd;
      display: flex;
      flex-direction: column;
    }
    #chatInputArea {
      padding: 10px;
      border-top: 1px solid #ccc;
      display: flex;
      gap: 5px;
    }
    #chatInput {
      flex-grow: 1;
      padding: 5px;
    }
    #sendMsg {
      padding: 5px 10px;
      background: #25d366;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 4px;
    }
    .my-message {
  align-self: flex-end;
  background-color: #dcf8c6;
  padding: 5px 10px;
  border-radius: 10px;
  margin: 2px 0;
  max-width: 70%;
}

.other-message {
  align-self: flex-start;
  background-color: #fff;
  padding: 5px 10px;
  border-radius: 10px;
  margin: 2px 0;
  max-width: 70%;
}
#gridChatMessages {
  padding: 10px;
  flex-grow: 1;
  overflow-y: auto;
  background: #ACBCE3;
  display: flex;
  flex-direction: column;
}

  </style>

</head>
<body>
		<div id="chatContainer" style="display: flex; height: 80vh;">
			<!-- 사이드바 -->
			<div id="chatSidebar"
				style="width: 250px; min-width: 150px; max-width: 600px; background-color: #f8f9fa; border-right: 1px solid #ddd; overflow-y: auto;">
				<div class="p-3" style="background-color: #0d6efd; color: white;">
					<h5>채팅방 목록</h5>
				</div>
				<div class="p-2">
					<div id="chatTree"></div>
				</div>
			</div>

			<!-- 리사이저 -->
			<div id="chatResizer"
				style="width: 5px; cursor: col-resize; background: #ddd;"></div>

			<!-- 그리드 시작 -->
			<div id="gridContainer"
				style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; width: 100%; padding: 10px; box-sizing: border-box;">

					<!-- 🔹 채팅방 목록 패널 (왼쪽 열) -->
					<div id="chatListPanel"
						style="background-color: #f8f9fa; border: 1px solid #ccc; border-radius: 5px; overflow-y: auto;">
	
						<div
							style="background-color: #0d6efd; color: white; padding: 10px; position: relative;">
							<h5 style="margin: 0;">채팅방 목록</h5>
	
							<!-- 메신저 아이콘 -->
							<i id="openMessenger" class="bi bi-chat-dots"
								style="position: absolute; top: 10px; right: 10px; font-size: 1.5rem; cursor: pointer;"
								title="새 채팅 시작"></i>
						</div>
	
						<!-- 대화 상대 추가 목록 -->
						<div id="chatListPopup" class="card shadow"
							style="display: none; position: absolute; top: 60px; right: 10px; min-width: 150px; z-index: 1000;">
							<div class="p-2 border-bottom">
								<input type="text" id="chatSearchInput"
									class="form-control form-control-sm" placeholder="이름 검색">
							</div>
							<ul class="list-group list-group-flush mb-0">
								<li class="list-group-item chat-entry" data-user="아이유">아이유</li>
								<li class="list-group-item chat-entry" data-user="박보검">박보검</li>
								<li class="list-group-item chat-entry" data-user="김태리">김태리</li>
							</ul>
						</div>
	
						<!-- 실제 채팅방 리스트 -->
						<ul id="chatListPopupItems" class="list-group list-group-flush mb-0">
							<li class="list-group-item chat-entry" data-user="아이유">아이유</li>
							<li class="list-group-item chat-entry" data-user="박보검">박보검</li>
							<li class="list-group-item chat-entry" data-user="김태리">김태리</li>
						</ul>
					</div>

				<!-- 채팅방 -->
				<div id="gridChatRoom"
					style="display: flex; background: #fff; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.2); flex-direction: column; height: 100%;">

					<div class="header"
						style="background: #fff; color: black; padding: 10px; border-radius: 10px 10px 0 0; display: flex; justify-content: space-between; align-items: center;">
						<span id="gridChatUserName">채팅상대</span>
						<div style="display: flex; align-items: center; gap: 5px;">
							<span class="input-group-text"
								style="padding: 0.375rem 0.75rem; background: transparent; border: none;">
								<i id="gridAttachFileIcon" class="bi bi-paperclip"
								style="cursor: pointer;" title="파일 첨부"></i>
							</span>

							<button class="btn btn-sm btn-primary" type="button"
								id="gridOpenMemo">보고</button>


							<button id="closeGridChat"
								style="background: none; border: none; color: black; font-weight: bold; cursor: pointer;">X</button>
							<input type="file" id="gridFileInput" style="display: none;">
						</div>
					</div>

					<div id="gridChatMessages"
						style="padding: 10px; flex-grow: 1; overflow-y: auto; background: #ACBCE3;">
						<!-- 채팅 메시지 표시 영역 -->
					</div>

					<div id="gridChatInputArea"
						style="padding: 10px; border-top: 1px solid #ccc; display: flex; gap: 5px;">
						<input id="gridChatInput" type="text" class="form-control"
							placeholder="메시지를 입력하세요..." />
						<button id="gridSendMsg" class="btn btn-success"
							style="padding: 0.25rem 0.75rem; font-size: 0.9rem; white-space: nowrap;"
							disabled>전송</button>
					</div>
				</div>
			</div>

			<!-- 보고 모달 -->
			<div class="modal fade" id="fileAttachModal" tabindex="-1"
				aria-labelledby="fileAttachModalLabel" aria-hidden="true">
				<div class="modal-dialog modal-dialog-centered">
					<div class="modal-content border-primary">
						<div class="modal-header bg-primary text-white">
							<h5 class="modal-title" id="fileAttachModalLabel">메모보고 등록</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="닫기"></button>
						</div>
						<div class="modal-body">
							<!-- 메모보고 폼 작성 부분 -->
							<div class="mb-2">
								<label class="form-label">보고일자</label> <input type="date"
									class="form-control">
							</div>
							<div class="mb-2">
								<label class="form-label">작성자명</label> <input type="text"
									class="form-control" value="홍길동" readonly>
							</div>
							<div class="mb-2">
								<label class="form-label">보고대상자</label>
								<div class="input-group">
									<input type="text" class="form-control"> <span
										class="input-group-text"><i class="bi bi-search"></i></span>
								</div>
							</div>
							<div class="mb-2">
								<label class="form-label">보고서제목</label> <input type="text"
									class="form-control">
							</div>
							<div class="mb-2">
								<label class="form-label">보고내용</label>
								<textarea class="form-control" rows="2"></textarea>
							</div>
							<div class="mb-2">
								<label class="form-label">파일첨부</label> <input type="file"
									class="form-control">
							</div>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">취소</button>
							<button type="button" class="btn btn-primary">등록</button>
						</div>
					</div>
				</div>
			</div>

			<script>
			$(function() {
			  $('#chatTree').jstree({
			    'core': {
			      'data':[
			    	  { "id": "CEO", "parent": "#", "text": "CEO", "type": "default" },
		
			    	  { "id": "기술본부", "parent": "CEO", "text": "기술본부", "type": "default" },
			    	  { "id": "개발1팀", "parent": "기술본부", "text": "개발1팀", "type": "default" },
			    	  { "id": "개발2팀", "parent": "기술본부", "text": "개발2팀", "type": "default" },
		
			    	  { "id": "영업본부", "parent": "CEO", "text": "영업본부", "type": "default" },
			    	  { "id": "국내영업팀", "parent": "영업본부", "text": "국내영업팀", "type": "default" },
			    	  { "id": "해외영업팀", "parent": "영업본부", "text": "해외영업팀", "type": "default" },
		
			    	  { "id": "디자인본부", "parent": "CEO", "text": "디자인본부", "type": "default" },
			    	  { "id": "UIUX팀", "parent": "디자인본부", "text": "UI/UX팀", "type": "default" },
			    	  { "id": "콘텐츠팀", "parent": "디자인본부", "text": "콘텐츠팀", "type": "default" },
		
			    	  // 개발1팀
			    	  { "id": "개발1_1", "parent": "개발1팀", "text": "아이유", "type": "user", "data": { "name": "아이유", "company": "스타컴퍼니", "dept": "개발1팀", "title": "대리",  "group": "개발본부", "email": "iu@example.com",  "role": "프론트엔드 개발자",  "memo": "React 전문가" } },
			    	  { "id": "개발1_2", "parent": "개발1팀", "text": "박보검", "type": "user", "data": { "company": "스타컴퍼니", "dept": "개발1팀","title": "사원", "group": "개발본부", "email": "bogum@example.com", "role": "백엔드 개발자", "memo": "Node.js 담당"	 } },
			    	  { "id": "개발1_3", "parent": "개발1팀", "text": "김태리", "type": "user", "data": { "title": "과장", "role": "모바일 앱 개발" } },
			    	  { "id": "개발1_4", "parent": "개발1팀", "text": "정해인", "type": "user", "data": { "title": "주임", "role": "API 개발" } },
			    	  { "id": "개발1_5", "parent": "개발1팀", "text": "수지", "type": "user", "data": { "title": "대리", "role": "데이터베이스 관리" } },
		
			    	  // 개발2팀
			    	  { "id": "개발2_1", "parent": "개발2팀", "text": "송중기", "type": "user", "data": { "title": "대리", "role": "서버 관리" } },
			    	  { "id": "개발2_2", "parent": "개발2팀", "text": "한지민", "type": "user", "data": { "title": "과장", "role": "보안 엔지니어" } },
			    	  { "id": "개발2_3", "parent": "개발2팀", "text": "이종석", "type": "user", "data": { "title": "주임", "role": "DevOps" } },
			    	  { "id": "개발2_4", "parent": "개발2팀", "text": "박신혜", "type": "user", "data": { "title": "대리", "role": "AI 개발" } },
			    	  { "id": "개발2_5", "parent": "개발2팀", "text": "조인성", "type": "user", "data": { "title": "사원", "role": "테스트 엔지니어" } },
		
			    	  // 국내영업팀
			    	  { "id": "국내영업_1", "parent": "국내영업팀", "text": "김수현", "type": "user", "data": { "title": "사원", "role": "국내 B2B 영업" } },
			    	  { "id": "국내영업_2", "parent": "국내영업팀", "text": "윤아", "type": "user", "data": { "title": "주임", "role": "국내 B2C 영업" } },
			    	  { "id": "국내영업_3", "parent": "국내영업팀", "text": "강동원", "type": "user", "data": { "title": "대리", "role": "영업 기획" } },
			    	  { "id": "국내영업_4", "parent": "국내영업팀", "text": "전지현", "type": "user", "data": { "title": "과장", "role": "대형 고객 관리" } },
			    	  { "id": "국내영업_5", "parent": "국내영업팀", "text": "지민", "type": "user", "data": { "title": "사원", "role": "영업 지원" } },
		
			    	  // UI/UX팀
			    	  { "id": "UIUX_1", "parent": "UIUX팀", "text": "제니", "type": "user", "data": { "title": "대리", "role": "UX 설계" } },
			    	  { "id": "UIUX_2", "parent": "UIUX팀", "text": "차은우", "type": "user", "data": { "title": "주임", "role": "UI 디자인" } },
			    	  { "id": "UIUX_3", "parent": "UIUX팀", "text": "혜리", "type": "user", "data": { "title": "사원", "role": "프로토타입 제작" } },
			    	  { "id": "UIUX_4", "parent": "UIUX팀", "text": "박서준", "type": "user", "data": { "title": "과장", "role": "사용자 조사" } },
			    	  { "id": "UIUX_5", "parent": "UIUX팀", "text": "슬기", "type": "user", "data": { "title": "대리", "role": "비주얼 디자인" } }
			    	],
			    	'themes': {
			        'responsive': false,
			        'variant': 'small',
			        'stripes': true
			      },
			      'check_callback': true
			    },
			    'types': {
			      'default': { 'icon': 'bi bi-folder' },
			      'user': { 'icon': 'bi bi-person' }
			    },
			    plugins: ['types', 'state']
			  }).on("after_open.jstree", adjustSidebarWidth)
			    .on("ready.jstree", adjustSidebarWidth)
			    .on("select_node.jstree", function (e, data) {
  
			    	
					});
					
					});
			// 대화 상대 추가
			$('#openMessenger').on('click', function (e) {
  e.stopPropagation();

  const icon = $(this);
  const popup = $('#chatListPopup');

  if (popup.is(':visible')) {
    popup.hide();
    return;
  }

  const offset = icon.offset();
  const height = icon.outerHeight();

  popup.css({
    top: offset.top + height + 10,
    left: offset.left
  }).show();

  // 검색 초기화
  $('#chatSearchInput').val('').focus();
  $('#chatListPopupItems .chat-entry').show();
});

// 검색 필터
$('#chatSearchInput').on('input', function () {
  const keyword = $(this).val().trim().toLowerCase();
  $('#chatListPopupItems .chat-entry').each(function () {
    const name = $(this).text().trim().toLowerCase();
    $(this).toggle(name.includes(keyword));
  });
});

// 대화 상대 선택
$('#chatListPopup').on('click', '.chat-entry', function () {
  const userName = $(this).data('user');
  $('#chatUserName').text(userName);
  $('#chatRoom').show();
  $('#chatInput').focus();
  $('#chatListPopup').hide();
});
			
					
					//채팅방 
					
					// 상세카드 옆 채팅방 열기
						$("#openGridChat").on("click", function() {
							$("#gridChatRoom").show();
						});
						$("#closeGridChat").on("click", function() {
							  $("#gridChatRoom").hide();
							});
						// 보고 버튼 클릭 시 보고 모달 열기
						$("#gridOpenMemo").on("click", function() {
							  const modal = new bootstrap.Modal(document.getElementById('fileAttachModal'));
							  modal.show();
							});
						// 파일 아이콘 클릭 시 파일 선택
						$("#gridAttachFileIcon").on("click", function() {
						  $("#gridFileInput").click();
						});
		
						// 입력값에 따라 전송 버튼 활성화
						$("#gridChatInput").on("input", function() {
						  const hasText = $(this).val().trim().length > 0;
						  $("#gridSendMsg").prop("disabled", !hasText);
						});
		
						// 전송 버튼 클릭 시 (여기엔 메시지 처리 로직 추가 가능)
						$("#gridSendMsg").on("click", function() {
						  const msg = $("#gridChatInput").val().trim();
						  if (msg) {
						    appendChatMessage(loginUser, msg);  // 반드시 appendChatMessage를 호출
						    $("#gridChatInput").val('');
						    $(this).prop("disabled", true);
						  }
						});
						// 엔터키 입력 시 전송
						$("#gridChatInput").on("keypress", function(e) {
						  if (e.which === 13 && !$("#gridSendMsg").prop("disabled")) {
						    $("#gridSendMsg").click();
						  }
						});
						
						//보고 모달 열기
						$('#attachFileIcon').on('click', function() {
							  const modal = new bootstrap.Modal(document.getElementById('fileAttachModal'));
							  modal.show();
							});
		
							$('#openMemoModal').on('click', function() {
							  const modal = new bootstrap.Modal(document.getElementById('fileAttachModal'));
							  modal.show();
							});
							
							//보고 
							$('#fileAttachModal .btn-primary').on('click', function() {
								  Swal.fire({
								    title: '보고 하시겠습니까?',
								    icon: 'question',
								    showCancelButton: true,
								    confirmButtonText: '보고',
								    cancelButtonText: '취소'
								  }).then((result) => {
								    if (result.isConfirmed) {
								      Swal.fire({
								        icon: 'success',
								        title: '보고 완료',
								        text: '보고서가 등록되었습니다.',
								        confirmButtonText: '확인'
								      }).then((result) => {
								        if (result.isConfirmed) {
								       
								          // 파일 아이콘 생성
									          const fileIconContainer = $('<div></div>').css({
									            position: 'relative',
									            display: 'inline-block',
									            margin: '5px'
									          });
									          const fileIcon = $('<i class="bi bi-file-earmark-text"></i>').css({
									              fontSize: '2rem',
									              cursor: 'pointer',
									              color: '#0d6efd'
									            }).attr('title', '보고서 보기');
		
								          // 아이콘 클릭 시 상세 모달 열기
								          fileIcon.on('click', function() {
								            const detailModal = new bootstrap.Modal(document.getElementById('reportDetailModal'));
								            detailModal.show();
								          });
		
								          fileIconContainer.append(fileIcon);
		
								       // 한 줄로 감싸서 오른쪽 끝에 붙이기
								          const messageRow = $('<div></div>').css({
								            width: '100%',
								            display: 'flex',
								            justifyContent: 'flex-end'
								          }).append(fileIconContainer);
								          
								          // 채팅방에 추가
								         $('#gridChatMessages').append(messageRow);
										 $('#gridChatMessages').scrollTop($('#gridChatMessages')[0].scrollHeight);
		
								          // 모달 닫기
								          const modal = bootstrap.Modal.getInstance(document.getElementById('fileAttachModal'));
								          modal.hide();
								        }
								      });
								    }
								  });
								});
							
							// 승인 시
							$('#approveReport').on('click', function() {
								  Swal.fire({
								    title: '승인하시겠습니까?',
								    icon: 'question',
								    showCancelButton: true,
								    confirmButtonText: '승인',
								    cancelButtonText: '취소'
								  }).then((result) => {
								    if (result.isConfirmed) {
								      const fileIconContainer = $('#gridChatMessages > div').last();

			  <script>
	//chat 팝업창을 여러개 띄우기 위함	
	var webSocket = null;
	$(document).ready(function() {
		var url = 'ws://' + window.location.host + '/muscat/usersServerEndpoint';
		webSocket = connection(url);
		var connectionType;
		
		webSocket.onopen = function(){ processOpen(); };
		webSocket.onmessage = function(message) { processMessage(message); };
		webSocket.onerror = function(message) { processError(message); };
		
	});
	//var webSocket = new WebSocket('ws://' + window.location.host + '/egov-messenger/usersServerEndpoint');
	
	
	function connection(url) {
		var webSocket = null;
		if ('WebSocket' in window) {
			webSocket = new WebSocket(url);
		} else if ('MozWebSocket' in window) {
			webSocket = new MozWebSocket(url);
		} else {
			Console.log('Error: WebSocket is not supported by this browser.');
            return null;
		}
		return webSocket;
	}
	
	function processOpen() {
		connectionType = "firstConnection";
		username = "${loginVO.name}";
		webSocket.send(JSON.stringify({ "connectionType" : connectionType, "username" : username }));
	}
		
	//server에서 메시지가 넘어왔을때
	function processMessage(message) {
		var jsonData = JSON.parse(message.data);
		
		if (jsonData.allUsers != null) {
			//다른 사용자 접속 시,
			displayUsers(jsonData.allUsers);
		} 
		
		if (jsonData.disconnectedUser != null) {
			//다른 사용자가 접속을 끊을 때,
			$("#"+jsonData.disconnectedUser).remove();
		}
		
		//다른 사용자와 대화하고자 시도할 때, 채팅창을 팝업
		if (jsonData.enterChatId != null) {
			//var roomId = jsonData.enterChatId;
				var roomId = "12";
			$("#roomId").val(roomId);
			$("#username").val(jsonData.username);
			openPopup(roomId);
		}
	}
	
	function openPopup(roomId) {
		var popOptions = "width= 500, height= 700, resizable=yes, status= no, scrollbar= yes"; 
		var targetTitle = random(roomId); //두명의 사용자가 다른 팝업으로 뜨기 위해서 targetTitle을 랜덤으로 만들어준다.
		console.log(targetTitle)
		popupPost("<c:url value='/cop/msg/websocketMessengePopup.do'/>", targetTitle, popOptions);
	}
	
	function popupPost(url, target, option) {
		window.open("", target, option);
		
		var form = $("form[name=usersForm]");
		form.attr("target", target);
		form.attr("action", url);
		form.attr("method", "post");
		form.submit();
	}
	
	
	function displayUsers(userList) {
		var username;
		$("#users tr:not(:first)").remove();
		for (var i=0; i<userList.length; i++) {
			if("${loginVO.name}"==userList[i]) {
				username = userList[i]+"(me!)";
			} else{
				username = userList[i];
			}
			$.newTr = $("<tr id="+userList[i]+" onclick='trClick(this)'><td>"+username+"</td></tr>");
			//append
			$("#users").last().append($.newTr);
			
		}
	}
	
	//다른 사용자 선택 시, 선택한 사용자 값을 서버에 전달
	function trClick(selectedTr) {
		if (selectedTr.id != null) {
				connectionType = "chatConnection";
				webSocket.send(JSON.stringify({ "connectionType" : connectionType, "connectingUser" : selectedTr.id }));
			}
	}
	
	function random(roomId) {
		
			let rUid = "12";
		/* <%
			Random rnd = new Random();
			for(int i=0; i<8; i++) {
				rnd.setSeed(System.currentTimeMillis());
				rUid += (char)((rnd.nextDouble()*26)+97);//KISA 보안약점 조치 (2018-10-29, 윤창원)
			}
		%> */
		return roomId+"."+rUid;
	}
	
	function processError(message) {
		/* messagesTextArea.value += "error...\n"; */
	}

	window.onbeforeunload = function() {
		webSocket.close();
	};
</script>
