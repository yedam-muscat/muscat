<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">


<main layout:fragment="content">CHAT_MAIN</main>
<head>
  <meta charset="UTF-8" />
  <title>조직도 + 채팅방 예제</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    /* 채팅방 스타일 */
    #chatRoom {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 300px;
      height: 400px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      z-index: 3000;
      display: flex;
      flex-direction: column;
    }
    #chatRoom .header {
      background: #075e54;
      color: white;
      padding: 10px;
      border-radius: 10px 10px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #chatMessages {
      padding: 10px;
      flex-grow: 1;
      overflow-y: auto;
      background: #ece5dd;
      display: flex;
      flex-direction: column;
    }
    #chatInputArea {
      padding: 10px;
      border-top: 1px solid #ccc;
      display: flex;
      gap: 5px;
    }
    #chatInput {
      flex-grow: 1;
      padding: 5px;
    }
    #sendMsg {
      padding: 5px 10px;
      background: #25d366;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<script>
  
</script>
</body>
</html>
