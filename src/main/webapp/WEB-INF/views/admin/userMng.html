<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<main layout:fragment="content">
	<h2 id="boardTitle">📄 사용자 목록</h2>

	<table class="table table-bordered">
		<thead class="table-light">
			<tr>
				<th>유저 아이디</th>
				<th>유저 이름</th>
				<th>핸드폰번호</th>
				<th>가입 상태</th>
			</tr>
		</thead>
		<tbody id="userListBody">

		</tbody>
	</table>

	<nav>
		<ul class="pagination justify-content-center" id="pagination"></ul>
	</nav>

	<script th:inline="javascript">
		let userListUrl = /*[[ @{/admin/user/userList.do} ]]*/ '';
	</script>
	<script>
    const pageSize = 10;
    let currentPage = 1;

    // 게시글 목록 로딩
    function loadUserList(page = 1) {
    	$.ajax({
			type : "GET",
			url : userListUrl,
			data : {
				pageIndex : page,
			},
		}).done(function(data, textStatus, xhr) {
	        let tbody = $('#userListBody');
	        tbody.html('');
	        
	        console.log(data);
	        
	        const resultList = data.resultList || [];
	        const totalCount = parseInt(data.resultCnt || 0);
	        const totalPages = Math.ceil(totalCount / pageSize);
	        
	        resultList.forEach(item => {
	          tbody.append(`<tr>
	  	            <td>${item.userId}</td>
	  	            <td>${item.userNm}</td>
	  	            <td>${item.moblphonNo}</td>
	  	            <td>${item.sttus}</td>
	  	            </tr>
	  	          `);
	        });

	        //renderPagination(page, totalPages);
		}).fail(function() {
			Swal.fire({
				icon : "error",
				title : "오류가 발생했습니다"
			})
		});
    }

    // 페이징 UI 렌더링
    function renderPagination(currentPage, totalPages) {
      const paginationEl = document.getElementById('pagination');
      paginationEl.innerHTML = '';

      const createPageItem = (label, page, isActive = false, isDisabled = false) => {
        const li = document.createElement('li');
        li.className = `page-item ${isActive ? 'active' : ''} ${isDisabled ? 'disabled' : ''}`;
        const a = document.createElement('a');
        a.className = 'page-link';
        a.href = '#';
        a.textContent = label;
        a.addEventListener('click', e => {
          e.preventDefault();
          if (!isDisabled && page !== currentPage) {
        	  loadUserList(page);
          }
        });
        li.appendChild(a);
        return li;
      };

      // 이전 버튼
      paginationEl.appendChild(createPageItem('«', currentPage - 1, false, currentPage === 1));

      // 번호 버튼
      const maxButtons = 5;
      let start = Math.max(1, currentPage - Math.floor(maxButtons / 2));
      let end = Math.min(totalPages, start + maxButtons - 1);
      if (end - start < maxButtons - 1) {
        start = Math.max(1, end - maxButtons + 1);
      }

      for (let i = start; i <= end; i++) {
        paginationEl.appendChild(createPageItem(i, i, i === currentPage));
      }

      // 다음 버튼
      paginationEl.appendChild(createPageItem('»', currentPage + 1, false, currentPage === totalPages));
    }

    // 초기 로딩
    document.addEventListener('DOMContentLoaded', () => {
    	loadUserList();
    });
  </script>
</main>
</html>
